<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b2a1a"><meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="/v2/app/manifest.webmanifest"><link rel="icon" href="/v2/app/icono-192.png">
<title>La Aldea</title>
<!-- La Aldea (28-oct-2026, pedido del usuario: «tipo Age of Empires… escenario bonito como Foundation… NPC trabajando y yendo por
     recursos… destinar NPC a cada proyecto y pausar uno»). Cada video es una OBRA cuyas secciones (una o varias por etapa) solo
     se pueden levantar cuando la PC ya hizo esa etapa (/api/v2/estado, en vivo). Los aldeanos son la economía: leñadores, canteros
     y mineros llevan recursos al almacén; los constructores asignados a cada obra los acarrean y levantan las secciones. Cámara
     isométrica fija low poly (arrastrar y pellizcar; el capataz se manda tocando). Todo el progreso vive en el teléfono
     (localStorage «aldea»); no cambia nada en la PC. -->
<style>
:root{--bg:#10170f;--card:rgba(24,22,16,.9);--card2:#2b261b;--line:#5a4a2e;--txt:#f4ecd8;--mut:#bfae8a;--oro:#f2c14e;--ok:#7bd389;--run:#6fb7ff;--err:#ff6b6b;--acc:#e0a33a;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font:15px/1.4 Georgia,"Palatino Linotype",serif;touch-action:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.madera{background:linear-gradient(180deg,rgba(58,44,26,.94),rgba(34,26,16,.94));border:1px solid #7a6238;box-shadow:inset 0 1px 0 rgba(255,230,170,.15),0 6px 18px rgba(0,0,0,.45);border-radius:12px}
/* barra de recursos (arriba) */
#recursos{position:fixed;left:8px;right:8px;top:calc(6px + var(--safe-t));z-index:6;display:flex;align-items:center;gap:6px;padding:5px 8px;font-variant-numeric:tabular-nums}
#recursos .r{display:flex;align-items:center;gap:3px;font-weight:700;font-size:14px;min-width:0}
#recursos .r.pop{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{40%{transform:scale(1.3)}}
#recursos .sep{flex:1}
#edad{display:flex;align-items:center;gap:6px}
#edad .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,#e0a33a,#a8642a);font-size:16px;position:relative}
#edad .ic b{position:absolute;right:-5px;bottom:-5px;font:800 10px system-ui;background:#2b261b;border:1px solid #7a6238;border-radius:6px;padding:0 3px}
#edad .xp{width:54px;height:5px;border-radius:5px;background:#3a3020;overflow:hidden}
#edad .xp i{display:block;height:100%;background:linear-gradient(90deg,#f2c14e,#ff8a3d);transition:width .8s}
#edad small{font-size:10.5px;color:var(--mut);display:block;line-height:1.1}
/* minimapa */
#mini{position:fixed;left:8px;top:calc(56px + var(--safe-t));z-index:6;width:104px;height:104px;border-radius:12px;padding:3px}
#mini canvas{width:100%;height:100%;border-radius:9px;display:block}
/* botones de la derecha */
.col{position:fixed;right:9px;top:calc(56px + var(--safe-t));z-index:6;display:flex;flex-direction:column;gap:11px}
/* etiquetas vivas sobre las obras: tarjeta de pergamino que flota, barras con rayas que avanzan, chip de estado animado */
#etqs{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.et{position:absolute;left:0;top:0;will-change:transform,opacity;transform-origin:50% 100%}
.et .in{position:relative;width:196px;padding:7px 8px 7px;border-radius:13px;color:var(--txt);
  background:linear-gradient(180deg,rgba(58,42,24,.95),rgba(33,24,14,.95));border:2px solid var(--c);
  box-shadow:0 6px 16px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,235,190,.18);animation:etFlota 3.4s ease-in-out infinite,etNace .55s cubic-bezier(.2,1.5,.4,1) both;animation-delay:var(--d,0s),0s}
.et .in::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--c);border-bottom:0}
@keyframes etFlota{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes etNace{from{opacity:0;transform:scale(.3) translateY(20px)}}
.et .cab{display:flex;align-items:center;gap:7px}
.et .mini{width:34px;height:34px;border-radius:8px;object-fit:cover;flex:none;border:1.5px solid var(--c);background:#1b140c}
.et .tt{min-width:0;flex:1;line-height:1.15}
.et .tt b{display:block;font:700 12.5px/1.2 Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.et .tt small{display:block;font:600 10px/1.3 system-ui,sans-serif;color:var(--c);filter:brightness(1.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.et .pc{flex:none;width:10px;height:10px;border-radius:50%;background:var(--ok);display:none;position:relative}
.et .pc::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ok);animation:etLatido 1.3s ease-out infinite}
.et.vivo .pc{display:block}
@keyframes etLatido{from{transform:scale(.5);opacity:1}to{transform:scale(1.8);opacity:0}}
.et .br{display:flex;align-items:center;gap:5px;margin-top:5px;font:700 10.5px/1 system-ui,sans-serif}
.et .br em{font-style:normal;width:15px;text-align:center}
.et .br .b{flex:1;height:8px;border-radius:5px;background:rgba(0,0,0,.45);overflow:hidden;position:relative;box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.et .br .b i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;transition:width 1.1s cubic-bezier(.3,1.2,.4,1)}
.et .br.v .b i{background:linear-gradient(90deg,#4f9df0,#7bd389)}
.et .br.o .b i{background:linear-gradient(90deg,#f2c14e,#e07b3a)}
.et .br .b i::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.28) 0 5px,transparent 5px 10px);background-size:14px 14px;opacity:0}
.et.vivo .br.v .b i::after,.et.trab .br.o .b i::after{opacity:1;animation:etRayas .7s linear infinite}
@keyframes etRayas{to{background-position:14px 0}}
.et .br .b i::before{content:"";position:absolute;top:0;bottom:0;width:30px;left:-30px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:etBrillo 3.2s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes etBrillo{0%,60%{left:-30px}100%{left:110%}}
.et .br span{width:30px;text-align:right;font-variant-numeric:tabular-nums}
.et .chip{margin-top:6px;display:flex;align-items:center;gap:5px;padding:4px 7px;border-radius:8px;font:700 10.5px/1.2 system-ui,sans-serif;background:rgba(255,255,255,.07);white-space:nowrap;overflow:hidden}
.et .chip .ic{display:inline-block;flex:none}
.et .chip .tx{overflow:hidden;text-overflow:ellipsis;flex:1}
.et .chip .gente{flex:none;letter-spacing:-3px}
.et .chip .gente i{font-style:normal;display:inline-block;animation:etSalta .9s ease-in-out infinite}
.et .chip .gente i:nth-child(2){animation-delay:.15s}.et .chip .gente i:nth-child(3){animation-delay:.3s}.et .chip .gente i:nth-child(4){animation-delay:.45s}
@keyframes etSalta{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.et.trab .chip{background:rgba(242,193,78,.16);color:#ffe2a0}
.et.trab .chip .ic{animation:etMartillo .45s ease-in-out infinite;transform-origin:70% 70%}
@keyframes etMartillo{0%,100%{transform:rotate(15deg)}50%{transform:rotate(-40deg)}}
.et.lista .chip{background:rgba(242,193,78,.22);color:#ffe7a6;animation:etBrilla 1.6s ease-in-out infinite}
@keyframes etBrilla{50%{background:rgba(242,193,78,.42)}}
.et.lista .chip .ic{animation:etSalta .8s ease-in-out infinite}
.et.falta .chip{background:rgba(255,107,107,.2);color:#ffb3a8}
.et.falta .chip .ic{animation:etTiembla .5s linear infinite}
@keyframes etTiembla{25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
.et.espera .chip{color:var(--mut)}
.et.espera .chip .ic{animation:etReloj 2.4s ease-in-out infinite}
@keyframes etReloj{0%,40%{transform:rotate(0)}50%,90%{transform:rotate(180deg)}100%{transform:rotate(360deg)}}
.et.vivoc .chip{background:rgba(123,211,137,.16);color:#bff0c6}
.et.pausa .in{filter:saturate(.25) brightness(.8)}
.et.pausa .chip{color:#cfcfcf}
.et.fin .chip{background:linear-gradient(90deg,rgba(242,193,78,.35),rgba(255,240,180,.15),rgba(242,193,78,.35));background-size:200% 100%;color:#fff3c4;animation:etOro 1.5s linear infinite}
@keyframes etOro{to{background-position:-200% 0}}
.et.sel .in{border-color:#fff;box-shadow:0 0 0 3px var(--c),0 8px 22px rgba(0,0,0,.5)}
.et.golpe .in{animation:etGolpe .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes etGolpe{0%{transform:scale(1)}30%{transform:scale(1.12) rotate(-2deg);background:linear-gradient(180deg,#7a5a20,#3a2a14)}100%{transform:scale(1)}}
/* de lejos: solo un anillo con el % de la obra */
.et .anillo{display:none;width:46px;height:46px;border-radius:50%;place-items:center;font:800 12px system-ui,sans-serif;color:#fff;text-shadow:0 1px 2px #000;
  background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(20,14,8,.8) 0);box-shadow:0 3px 10px rgba(0,0,0,.5);position:relative;animation:etFlota 3.4s ease-in-out infinite;animation-delay:var(--d,0s)}
.et .anillo::before{content:"";position:absolute;inset:5px;border-radius:50%;background:rgba(33,24,14,.92)}
.et .anillo b{position:relative}
.et.vivo .anillo::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--ok);animation:etLatido 1.3s ease-out infinite}
.et.lejos .in{display:none}.et.lejos .anillo{display:grid}
/* Ciudadela: placa dorada sencilla */
.et.ciu .in{width:auto;max-width:180px;padding:5px 9px 6px;text-align:center;background:linear-gradient(180deg,rgba(70,52,22,.95),rgba(40,29,12,.95));border-color:#e8b931}
.et.ciu .in::after{border-top-color:#e8b931}
.et.ciu b{display:block;font:700 12px/1.2 Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.et.ciu small{display:block;font:600 10px system-ui,sans-serif;color:#f2d27a}
#velo-zona{position:fixed;inset:0;background:#0b0905;opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
#velo-zona.on{opacity:1}
#ciu-cab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + var(--safe-b));z-index:5;display:none;align-items:center;gap:10px;padding:7px 7px 7px 14px;border-radius:16px;white-space:nowrap;font-weight:700;font-size:14px}
body.ciu #ciu-cab{display:flex}
body.ciu #mini,body.ciu #modo,body.ciu #joy,body.ciu #accion{display:none!important}
.rb{width:46px;height:46px;display:grid;place-items:center;font-size:21px;position:relative;transition:transform .12s,box-shadow .12s}
/* HUD «cute» (29-oct): fichas de crema con canto de color y botones gorditos que se hunden al tocarlos */
.rb.madera{background:linear-gradient(180deg,#fff,var(--bc,#fff3dc) 70%);border:2.5px solid #fff;border-radius:16px;box-shadow:0 5px 0 var(--bb,#d9b98a),0 9px 16px rgba(30,70,80,.25)}
.rb.madera:active{transform:translateY(4px);box-shadow:0 1px 0 var(--bb,#d9b98a),0 3px 8px rgba(30,70,80,.2)}
.rb.madera::after{content:"";position:absolute;left:7px;right:7px;top:4px;height:9px;border-radius:9px;background:rgba(255,255,255,.75);pointer-events:none}
.rb.madera:has(.badge:not([hidden])){animation:rbLlama 1.8s ease-in-out infinite}
@keyframes rbLlama{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-9deg) scale(1.06)}84%{transform:rotate(8deg) scale(1.06)}92%{transform:rotate(-4deg)}}
#recursos.madera{background:none;border:0;box-shadow:none;padding:0;gap:5px;left:6px;right:6px}
#recursos .r{background:#fffaf0;color:#6a4520;border-radius:999px;padding:2px 9px 2px 2px;gap:4px;border:2px solid #fff;
  box-shadow:0 3px 0 var(--rb),0 6px 12px rgba(30,70,80,.2);font:800 13px/1 system-ui,sans-serif;letter-spacing:-.2px}
#recursos .r .i{font-style:normal;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:var(--rc);box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}
#recursos .r.pop{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
#edad{background:#fffaf0;border:2px solid #fff;border-radius:16px;padding:3px 9px 3px 3px;box-shadow:0 3px 0 #e5c08a,0 6px 12px rgba(30,70,80,.2);color:#6a4520}
#edad .ic{width:30px;height:30px;border-radius:11px;background:linear-gradient(180deg,#ffd56b,#f5a623);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
#edad .ic b{background:#8a5cf6;color:#fff;border:2px solid #fff;border-radius:9px;padding:0 4px}
#edad small{color:#8a6a45;font:800 10.5px system-ui,sans-serif}
#edad .xp{width:58px;height:7px;background:#f0e2c8;box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
#edad .xp i{background:linear-gradient(90deg,#7bd389,#3cc6a0);border-radius:5px}
#mini.madera{background:#fffaf0;border:3px solid #fff;border-radius:18px;padding:3px;box-shadow:0 5px 0 #d8c39c,0 10px 18px rgba(30,70,80,.25)}
#mini canvas{border-radius:13px}
#ciu-cab.madera{background:#fffaf0;color:#6a4520;border:2.5px solid #fff;border-radius:18px;box-shadow:0 5px 0 #c9b2e8,0 10px 18px rgba(30,70,80,.25)}
.rb .badge{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;border-radius:10px;background:#ff5a5f;color:#fff;border:2px solid #fff;font:800 10.5px system-ui;display:grid;place-items:center;padding:0 3px;z-index:1;box-shadow:0 2px 0 #c43c41}
#modo{width:56px;height:56px;font-size:24px;border-radius:16px;background:linear-gradient(135deg,#e0a33a,#a8642a);border:2px solid #f2c14e}
/* panel de selección (abajo, estilo RTS) */
#sel{position:fixed;left:8px;right:8px;bottom:calc(8px + var(--safe-b));z-index:7;padding:10px;display:none;animation:sube .35s cubic-bezier(.2,1.1,.3,1)}
#sel.on{display:block}
@keyframes sube{from{transform:translateY(120%)}}
.s1{display:flex;gap:10px;align-items:flex-start}
.retrato{width:66px;height:66px;border-radius:10px;border:2px solid #7a6238;object-fit:cover;background:#2b261b;flex:none}
.s1 .tx{min-width:0;flex:1}
.s1 h3{margin:0;font-size:15px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.s1 small{color:var(--mut);font-size:11.5px}
.s1 .x{width:30px;height:30px;border-radius:8px;background:#2b261b;border:1px solid #7a6238;flex:none;font-family:system-ui}
.barra2{display:grid;grid-template-columns:52px 1fr 36px;gap:6px;align-items:center;font-size:11px;color:var(--mut);margin-top:4px}
.barra2 .b{height:7px;border-radius:5px;background:#3a3020;overflow:hidden}
.barra2 .b i{display:block;height:100%;border-radius:inherit;transition:width .8s}
.barra2 b{font:700 11.5px system-ui;color:var(--txt);text-align:right}
.estado{font-size:12.5px;margin-top:7px;padding:6px 8px;border-radius:8px;background:rgba(0,0,0,.25);color:#e8dcc0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.etps{display:flex;gap:3px;margin-top:7px;overflow-x:auto;scrollbar-width:none}
.etps::-webkit-scrollbar{display:none}
.etps span{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:13px;background:#2b261b;border:1px solid #4a3d26;opacity:.55}
.etps span.listo,.etps span.lista{opacity:1;border-color:var(--ok);background:rgba(123,211,137,.18)}
.etps span.en_curso{opacity:1;border-color:var(--run);background:rgba(111,183,255,.2);animation:lat 1s infinite alternate}
.etps span.error{opacity:1;border-color:var(--err)}
@keyframes lat{to{opacity:.45}}
.npcs{display:flex;align-items:center;gap:6px;margin-top:8px}
.npcs .n{font:700 14px system-ui;min-width:64px;text-align:center}
.bt{height:40px;padding:0 12px;border-radius:10px;background:#3a3020;border:1px solid #7a6238;font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;transition:transform .12s}
.bt:active{transform:scale(.93)}
.bt.cuad{width:40px;padding:0;font:800 20px system-ui}
.bt.oro{background:linear-gradient(135deg,#e0a33a,#a8642a);border-color:#f2c14e;color:#1b130a}
.bt.rojo{background:#5a2a20;border-color:#a0503a}
.bt:disabled{opacity:.4}
.fila{display:flex;gap:6px;margin-top:8px}
.fila .bt{flex:1;min-width:0}
/* sin tercera persona (29-oct): todo se juega desde la isométrica */
#modo,#joy,#accion{display:none!important}
/* joystick y acción (tercera persona, ya no se muestran) */
#joy{position:fixed;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(22px + var(--safe-b));width:124px;height:124px;border-radius:50%;z-index:5;background:radial-gradient(circle,rgba(255,240,200,.08),rgba(255,240,200,.02));border:2px solid rgba(255,230,170,.2);display:none;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:linear-gradient(135deg,#e0a33a,#a8642a);box-shadow:0 6px 18px rgba(0,0,0,.4)}
.tp #joy{display:block}
#accion{position:fixed;right:calc(76px + env(safe-area-inset-right,0px));bottom:calc(30px + var(--safe-b));z-index:5;height:58px;max-width:52vw;padding:0 16px;border-radius:18px;display:none;align-items:center;gap:6px;font-weight:700;color:#1b130a;
  background:linear-gradient(135deg,#f2c14e,#e07b3a);box-shadow:0 10px 26px -6px rgba(224,123,58,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:respira 1.6s ease-in-out infinite}
.tp #accion.on{display:flex}
#accion small{display:block;font-size:11px;font-weight:500;overflow:hidden;text-overflow:ellipsis}
@keyframes respira{50%{transform:scale(1.05)}}
.tp #modo{position:fixed;right:10px;bottom:calc(30px + var(--safe-b))}
/* hojas */
.velo{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s}
.velo.on{opacity:1;pointer-events:auto}
.hoja{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88dvh;display:flex;flex-direction:column;border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.25,1.05);
  background:linear-gradient(180deg,#2f2618,#1c160d);border:1px solid #7a6238;border-bottom:0;box-shadow:0 -20px 60px rgba(0,0,0,.6)}
.hoja.on{transform:none}
.hoja .cab{display:flex;align-items:center;gap:10px;padding:13px 14px 6px;flex:none}
.hoja .cab h2{margin:0;font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hoja .cab .x{width:36px;height:36px;border-radius:10px;background:#3a3020;border:1px solid #7a6238;font-family:system-ui}
.tabs{display:flex;gap:5px;overflow-x:auto;padding:2px 14px 8px;flex:none;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;height:32px;padding:0 11px;border-radius:9px;background:#3a3020;border:1px solid #5a4a2e;font-size:13px}
.tabs button.on{background:linear-gradient(135deg,#e0a33a,#a8642a);color:#1b130a;font-weight:700;border-color:#f2c14e}
.hoja .cont{overflow-y:auto;padding:4px 14px calc(80px + var(--safe-b));-webkit-overflow-scrolling:touch;-webkit-user-select:text;user-select:text}
.sub{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin:14px 2px 7px;display:flex;justify-content:space-between;font-family:system-ui}
.tarj{background:rgba(0,0,0,.25);border:1px solid #4a3d26;border-radius:12px;padding:11px;margin-top:7px;animation:entra .35s both}
@keyframes entra{from{opacity:0;transform:translateY(10px)}}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid .it{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;background:#2b261b;border:1px solid #4a3d26;animation:entra .3s both;animation-delay:calc(var(--i)*16ms)}
.grid .it img{width:100%;height:100%;object-fit:cover;display:block}

  if(!G.dia||G.dia.fecha!==h){const r=rng(hash(h)),pool=[...MISIONES],mis=[];
    while(mis.length<3){const i=Math.floor(r()*pool.length);mis.push({id:pool[i].id,n:0,hecha:false});pool.splice(i,1);}

const CIELOS=[[0,"#0d1630","#2a2a48","#101820",.12,.25],[5.5,"#3a4a78","#f0a070",.4,.4,.5],[7.5,"#6aa7e0","#f6dcae",1.6,.9,.9],[12,"#5c9ee6","#e8f0f6",2.2,1,1],[16.5,"#6aa7e0","#f6dcae",2.1,.95,.95],[18.8,"#4a5a90","#ff9e6a",1,.6,.6],[20.5,"#141c3a","#3a2c50",.2,.3,.3],[24,"#0d1630","#2a2a48",.12,.25,.25]];
function luzDelDia(){const d=new Date(),h=G.horaReal?d.getHours()+d.getMinutes()/60:13;let a=CIELOS[0],b=CIELOS[1];for(let i=0;i<CIELOS.length-1;i++)if(h>=CIELOS[i][0]&&h<=CIELOS[i+1][0]){a=CIELOS[i];b=CIELOS[i+1];}
  const t=(h-a[0])/Math.max(.01,b[0]-a[0]),c1=new THREE.Color(a[1]).lerp(new THREE.Color(b[1]),t),c2=new THREE.Color(a[2]).lerp(new THREE.Color(b[2]),t);

  SOL.intensity=lerp(a[3],b[3],t)*.75;HEMI.intensity=lerp(a[4],b[4],t)*1.55;const ang=(h-6)/12*Math.PI;SOL.userData.dir=new THREE.Vector3(Math.cos(ang)*-.8,Math.max(.25,Math.sin(ang)),.45).normalize();

function cuadro(){
  requestAnimationFrame(cuadro);if(document.hidden)return;const dt=Math.min(reloj.getDelta(),.05),t=reloj.elapsedTime;

    if(n.vida<=0&&n.agotado&&performance.now()-n.agotado>120000){n.vida=n.max;n.cae=0;n.crece=1;n.agotado=0;}if(n.crece>0){n.crece=Math.max(0,n.crece-dt*.5);matrizNodo(n);}}

  for(const n of NUBES){n.position.x+=dt*1.6;if(n.position.x>260)n.position.x=-260;}

    if(g.userData.aspas)g.userData.aspas.rotation.z+=dt*.8;if(g.userData.chorro)g.userData.chorro.scale.y=1+Math.sin(t*8)*.15;if(g.userData.barca){g.userData.barca.position.y=NIVEL_AGUA-g.position.y+.2+Math.sin(t*1.4)*.12;g.userData.barca.rotation.z=Math.sin(t)*.05;}
    if(g.userData.cristal){g.userData.cristal.rotation.y+=dt;g.userData.cristal.position.y=19+Math.sin(t*1.5)*.5;}}
  if(MARCA.visible){MARCA.userData.t-=dt;MARCA.scale.setScalar(1+(1-MARCA.userData.t)*.6);MARCA.material.opacity=MARCA.userData.t;if(MARCA.userData.t<=0)MARCA.visible=false;}
  // cámara y sombra que la sigue
  if(MODO==="rts"){const k=80*dt*(CAM.d/90);if(TECLAS.a)CAM.tx-=k*Math.cos(CAM.yaw);if(TECLAS.d)CAM.tx+=k*Math.cos(CAM.yaw);if(TECLAS.w){CAM.tx-=k*Math.sin(CAM.yaw);CAM.tz-=k*Math.cos(CAM.yaw);}if(TECLAS.s){CAM.tx+=k*Math.sin(CAM.yaw);CAM.tz+=k*Math.cos(CAM.yaw);}camaraRTS(dt);}else camaraTP(dt);
  const foco=MODO==="rts"?new THREE.Vector3(CAM.sx,0,CAM.sz):HEROE.g.position;CIELO.position.copy(camara.position);CIELO.visible=camara===CAM_P;const dir=SOL.userData.dir||new THREE.Vector3(-.5,.8,.4);SOL.position.set(foco.x+dir.x*120,dir.y*120,foco.z+dir.z*120);SOL.target.position.set(foco.x,0,foco.z);
  const ext=MODO==="rts"?clamp(CAM.ds*.62,22,85):45;const sc=SOL.shadow.camera;if(Math.abs(sc.right-ext)>1){sc.left=-ext;sc.right=ext;sc.top=ext;sc.bottom=-ext;sc.updateProjectionMatrix();}
  tMini+=dt;if(tMini>.25){tMini=0;pintaMini(t);if(ZONA==="ciu")ocultaValle(true);if(SEL&&Math.random()<.25)pintaSel();}
  tLuz+=dt;if(tLuz>30||tLuz===dt){tLuz=0;NOCHE=luzDelDia();}
  tAve+=dt;if(tAve>(NOCHE?1.5:3.5)){tAve=0;if(Math.random()<.5&&MODO==="tp"||Math.random()<.25)(NOCHE?sfx.grillo:sfx.pajaro)();}
  tRenta+=dt;if(tRenta>60){tRenta=0;let r=0;for(const x of DECOR)if(G.decor[x.id]&&x.renta)r+=x.renta;r+=Math.ceil(ciudadelaLista().filter(p=>p.publicado).length/2);if(r){suma({oro:r});toast(`🪙 Impuestos y comercio: +${r}`,"oro");}}
  const c=interaccion();if((c&&c.t)!==(CERCA&&CERCA.t)){CERCA=c;const b=$("#accion");if(c){b.innerHTML=`<span>${c.t}</span>`;b.classList.add("on");}else b.classList.remove("on");}else if(c)CERCA.f=c.f;
  renderer.render(ESC,camara);pintaEtiquetas();
}

// ================================================================== mientras no mirabas: la aldea siguió trabajando
function ponerseAlDia(){
  if(!G.ultima)return;const seg=clamp((Date.now()-G.ultima)/1000,0,4*3600);if(seg<60)return;
  const ganado={madera:0,piedra:0,oro:0};const tasa=s=>s/16;          // un recolector ≈ 4 unidades cada 16 s
  ganado.madera=Math.floor(G.roles.lena*tasa(seg)*4*.5);ganado.piedra=Math.floor(G.roles.cant*tasa(seg)*4*.5);ganado.oro=Math.floor(G.roles.mine*tasa(seg)*4*.5);
  for(const k in ganado)G.res[k]+=ganado[k];
  let secc=0;const rondas=Math.floor(seg/6);              // cada constructor gasta ≈ 1 unidad cada 6 s (con el acarreo)
  for(const o of OBRAS.values()){const n=constructoresDe(o.v);if(!n)continue;for(let i=0;i<rondas*n;i++){const r=o.necesita();if(!r)break;if((o.s.st[r]||0)<1){if(G.res[r]<1)break;const k=Math.min(4,Math.floor(G.res[r]));G.res[r]-=k;o.s.st[r]=(o.s.st[r]||0)+k;}
      const antes=o.s.b.filter(x=>x>=1).length;o.trabaja();if(o.s.b.filter(x=>x>=1).length>antes)secc++;}}
  const min=Math.round(seg/60);toast(`🌅 Mientras no estabas (${min>=60?Math.round(min/60)+" h":min+" min"}): +${ganado.madera} 🪵 +${ganado.piedra} 🪨 +${ganado.oro} 🪙${secc?` · ${secc} secciones construidas`:""}`,"oro");
  guardar(true);pintaHUD();
}

  construyePlaza();construyeHeroe();ESC.add(MARCA);for(const id of Object.keys(G.decor))construyeDecor(id);for(const g of Object.values(DECOR_OBJ)){g.scale.setScalar(1);g.userData.nace=0;}
  fondoMini();bar.style.width="55%";tx.textContent="Leyendo los videos de la PC…";
  try{D.POR=await pedir("/api/v2/portadas");}catch(e){}bar.style.width="70%";
  await cargarSis();await cargarEstado(true);bar.style.width="100%";
  if(!Object.keys(G.obras).some(v=>G.obras[v].n)){const vivas=[...OBRAS.values()].filter(o=>o.siguiente()>=0).slice(0,2);vivas.forEach((o,i)=>{o.s.n=2;});ajustaAldeanos();}  // primera vez: 2 constructores en las obras con trabajo
  ponerseAlDia();diaDeHoy();pintaHUD();ponSonido(SND.on);NOCHE=luzDelDia();
  const vivas=[...OBRAS.values()].filter(o=>o.vivo).length;tx.textContent=`${OBRAS.size} obras en el valle · ${vivas} con la PC trabajando · ${ciudadelaLista().length} en la Ciudadela`;pintaCiuCab();
  $("#b-jugar").style.display="flex";CAM.snap=true;

}
$("#b-jugar").onclick=()=>{ac();sfx.campana();$("#carga").classList.add("fuera");setTimeout(()=>$("#carga").remove(),800);setTimeout(revisaMedallas,1500);
  if(!G.cnt.secciones&&!Object.keys(G.visitas).length)setTimeout(()=>hojaOrdenes(),900);};
document.addEventListener("visibilitychange",()=>{if(!document.hidden){reloj.getDelta();cargarEstado();cargarSis();ponerseAlDia();}else guardar(true);});
window.ALDEA={G,OBRAS,CIU,vaZona,NODOS,Obra,D,ALDEANOS,CAM,HEROE,ponModo,seleccionaObra,abreObra,enfocar,hojaAyuntamiento,hojaAldeanos,compra};   // depuración
arranca().catch(e=>{$("#carga-tx").textContent="No pude arrancar: "+(e.message||e);console.error(e);});
</script>
