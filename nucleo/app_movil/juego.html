<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0c12"><meta name="robots" content="noindex,nofollow">
<script src="/v2/app/actualiza.js" defer></script>
<link rel="manifest" href="/v2/app/manifest.webmanifest"><link rel="icon" href="/v2/app/icono-192.png">
<title>Fábrica 3D</title>
<!-- Fábrica 3D (28-oct-2026, pedido del usuario): la fábrica de videos como un juego en three.js. Cada proyecto es una celda
     de producción que se mueve EN VIVO con /api/v2/estado; al entrar, su estudio con estaciones (guion, voz, música, galería,
     clips, Montaje, entrega) donde se ve y oye todo lo producido. Progresión (XP, rangos, créditos, órdenes del día, medallas,
     tienda) guardada en el teléfono (localStorage). Solo lee: no lanza nada en la PC. -->
<style>
:root{--bg:#0a0c12;--card:#151924;--card2:#1c2231;--line:#2a3144;--txt:#eef0f7;--mut:#8f97ad;--acc:#8b74ff;--run:#4aa8ff;--ok:#3fd49a;--warn:#ffb547;--err:#ff5d7a;--oro:#ffd166;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
/* ---------- HUD */
.hud-top{position:fixed;left:10px;right:10px;top:calc(8px + var(--safe-t));z-index:5;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.hud-top>*{pointer-events:auto}
.perfil{display:flex;align-items:center;gap:9px;background:rgba(16,19,28,.78);border:1px solid var(--line);border-radius:16px;padding:6px 11px 6px 6px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);min-width:0}
.nivel{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:16px;background:linear-gradient(135deg,#7a62ff,#4aa8ff);box-shadow:0 4px 14px rgba(122,98,255,.45);flex:none;position:relative}
.nivel.sube{animation:sube 1s cubic-bezier(.3,1.6,.5,1)}
@keyframes sube{30%{transform:scale(1.5) rotate(-10deg)}}
.pf-tx{min-width:0}.pf-tx b{font-size:13px;display:block;white-space:nowrap}
.xpbar{width:96px;height:6px;border-radius:9px;background:#262d40;overflow:hidden;margin-top:3px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#8b74ff,#ff5fa8);border-radius:inherit;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.pf-tx small{font-size:11px;color:var(--mut)}
.monedas{display:flex;flex-direction:column;gap:5px;margin-left:auto}
.pill{display:flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:99px;background:rgba(16,19,28,.78);border:1px solid var(--line);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pill.pop{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{40%{transform:scale(1.25)}}
.hud-der{position:fixed;right:10px;top:calc(84px + var(--safe-t));z-index:5;display:flex;flex-direction:column;gap:8px}
.rb{width:46px;height:46px;border-radius:15px;background:rgba(16,19,28,.8);border:1px solid var(--line);display:grid;place-items:center;font-size:20px;position:relative;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .15s}
.rb:active{transform:scale(.88)}
.rb .badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--err);font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px;animation:pop .5s}
.lugar{position:fixed;left:50%;top:calc(66px + var(--safe-t));transform:translateX(-50%);z-index:4;font-size:12px;color:#cfd4e6;background:rgba(16,19,28,.7);border:1px solid var(--line);padding:5px 12px;border-radius:99px;white-space:nowrap;max-width:62vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.vivo-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;box-shadow:0 0 8px var(--ok);animation:lat 1.4s infinite}
@keyframes lat{50%{opacity:.35}}
/* joystick y botón de acción */
#joy{position:fixed;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(22px + var(--safe-b));width:128px;height:128px;border-radius:50%;z-index:5;background:radial-gradient(circle,rgba(255,255,255,.06),rgba(255,255,255,.02));border:2px solid rgba(255,255,255,.12);touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:linear-gradient(135deg,rgba(139,116,255,.9),rgba(74,168,255,.9));box-shadow:0 6px 18px rgba(0,0,0,.4);transition:transform .12s}
#joy.on i{transition:none}
#accion{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(30px + var(--safe-b));z-index:5;min-width:110px;max-width:58vw;height:62px;padding:0 18px;border-radius:22px;font-weight:750;font-size:15px;color:#fff;
  background:linear-gradient(135deg,#ff8a3d,#ff5fa8);box-shadow:0 10px 28px -6px rgba(255,95,168,.7);display:none;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:respira 1.6s ease-in-out infinite}
#accion.on{display:flex}
#accion small{display:block;font-size:11px;font-weight:500;opacity:.9;overflow:hidden;text-overflow:ellipsis}
@keyframes respira{50%{transform:scale(1.05);box-shadow:0 14px 34px -6px rgba(255,95,168,.9)}}
/* overlays */
.velo{position:fixed;inset:0;z-index:20;background:rgba(3,4,8,.55);opacity:0;pointer-events:none;transition:opacity .3s}
.velo.on{opacity:1;pointer-events:auto}
.hoja{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88dvh;background:#10131c;border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;display:flex;flex-direction:column;
  transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.25,1.05);box-shadow:0 -20px 60px rgba(0,0,0,.6)}
.hoja.on{transform:none}
.hoja .cab{display:flex;align-items:center;gap:10px;padding:14px 14px 8px;flex:none}
.hoja .cab h2{margin:0;font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hoja .cab .x{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:16px}
.hoja .cont{overflow-y:auto;padding:4px 14px calc(80px + var(--safe-b));-webkit-overflow-scrolling:touch;-webkit-user-select:text;user-select:text}
.sub{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin:14px 2px 8px;display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid .it{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#1a1f2d;border:1px solid var(--line);animation:entra .35s both;animation-delay:calc(var(--i)*18ms)}
.grid .it img{width:100%;height:100%;object-fit:cover;display:block}
.grid .it.visto:after{content:"✓";position:absolute;right:4px;top:4px;width:18px;height:18px;border-radius:50%;background:rgba(63,212,154,.9);font-size:11px;display:grid;place-items:center;color:#062}
.grid .it .tv{position:absolute;inset:auto 0 0 0;font-size:10px;padding:10px 5px 3px;background:linear-gradient(transparent,rgba(0,0,0,.8));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid .it.vid:before{content:"▶";position:absolute;inset:0;display:grid;place-items:center;font-size:22px;color:#fff;text-shadow:0 2px 8px #000;z-index:1}
@keyframes entra{from{opacity:0;transform:translateY(10px) scale(.96)}}
.lista{display:flex;flex-direction:column;gap:6px}
.fila{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px;animation:entra .3s both;animation-delay:calc(var(--i,0)*20ms)}
.fila .pl{flex:none;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#7a62ff,#4aa8ff);display:grid;place-items:center;font-size:14px;color:#fff}
.fila .pl.on{background:linear-gradient(135deg,#ff8a3d,#ff5fa8);animation:respira 1.2s infinite}
.fila .pl.no{background:#2a3144;color:var(--mut)}
.fila .tx{min-width:0;flex:1;font-size:13.5px}
.fila .tx small{display:block;color:var(--mut);font-size:11.5px}
.fila.visto .tx small:after{content:" · ✓ oída";color:var(--ok)}
.btn{height:44px;border-radius:13px;background:var(--card2);border:1px solid var(--line);font-weight:650;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;transition:transform .15s}
.btn:active{transform:scale(.95)}
.btn.pri{background:linear-gradient(135deg,#7a62ff,#4aa8ff);border:0;color:#fff}
.btn.ancho{width:100%}
.fila2{display:flex;gap:8px;margin-top:10px}
.fila2 .btn{flex:1}
.tarj{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px;animation:entra .35s both}
.mision{display:flex;gap:10px;align-items:center}
.mision .ic{font-size:24px;width:42px;height:42px;border-radius:12px;background:var(--card2);display:grid;place-items:center;flex:none}
.mision.hecha .ic{background:rgba(63,212,154,.18)}
.mision .tx{flex:1;min-width:0}
.mb{height:7px;border-radius:9px;background:#262d40;overflow:hidden;margin-top:5px}
.mb i{display:block;height:100%;background:linear-gradient(90deg,var(--warn),#ff8a3d);border-radius:inherit;transition:width .8s}
.mision.hecha .mb i{background:var(--ok)}
.premio{font-size:12px;color:var(--oro);font-weight:700;white-space:nowrap}
.medallas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.med{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;font-size:11.5px;color:var(--mut);animation:entra .35s both;animation-delay:calc(var(--i)*25ms)}
.med .e{font-size:30px;display:block;filter:grayscale(1) brightness(.5)}
.med.si{color:var(--txt);border-color:rgba(255,209,102,.5);background:linear-gradient(160deg,rgba(255,209,102,.12),var(--card))}
.med.si .e{filter:none;animation:flota 3s ease-in-out infinite}
@keyframes flota{50%{transform:translateY(-4px)}}
.med b{display:block;font-size:12.5px;margin-top:2px}
.tienda{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.art{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;animation:entra .35s both;animation-delay:calc(var(--i)*25ms)}
.art .mu{width:44px;height:44px;border-radius:50%;margin:2px auto 6px;display:grid;place-items:center;font-size:24px}
.art b{font-size:13px;display:block}
.art .btn{height:34px;font-size:12.5px;margin-top:8px;width:100%}
.art.puesto{border-color:var(--ok)}
.quiz-frase{font-size:17px;line-height:1.5;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:6px}
.quiz-frase u{display:inline-block;min-width:80px;border-bottom:3px dashed var(--warn);text-decoration:none;color:var(--warn);text-align:center}
.ops{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.ops .btn{height:50px;font-size:15.5px}
.ops .btn.bien{background:rgba(63,212,154,.25);border-color:var(--ok);animation:pop .4s}
.ops .btn.mal{background:rgba(255,93,122,.2);border-color:var(--err);animation:tiembla .4s}
@keyframes tiembla{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.trivia-img{width:100%;aspect-ratio:16/10;object-fit:contain;background:#000;border-radius:14px;border:1px solid var(--line)}
.md{font-size:13.5px;color:#d3d7e6}
.md h3{font-size:14.5px;margin:12px 0 4px}.md p,.md li{margin:3px 0}
.md code{font-size:12px;background:#0b0e16;padding:1px 4px;border-radius:4px}
.etp{display:flex;gap:9px;align-items:center;padding:6px 0;border-bottom:1px solid #1d2232;font-size:13.5px}
.etp i{width:12px;height:12px;border-radius:4px;flex:none;background:#2d3448}
.etp i.listo,.etp i.lista{background:var(--ok)}.etp i.en_curso{background:var(--run);animation:lat 1s infinite}.etp i.error{background:var(--err)}
.etp small{color:var(--mut);margin-left:auto;text-align:right;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* reproductor/visor a pantalla completa */
.pantalla{position:fixed;inset:0;z-index:30;background:#000;display:flex;flex-direction:column;animation:subeF .35s cubic-bezier(.2,.9,.25,1.05)}
@keyframes subeF{from{transform:translateY(100%)}}
.pantalla .bf{display:flex;align-items:center;gap:10px;padding:calc(8px + var(--safe-t)) 12px 8px;background:#0a0c12}
.pantalla .bf b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.pantalla .bf .x{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.pantalla iframe{flex:1;border:0;background:#0b0d13}
.pantalla video,.pantalla img{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
.pantalla .nav{display:flex;gap:8px;padding:8px 12px calc(10px + var(--safe-b));background:#0a0c12}
.pantalla .nav .btn{flex:1}
/* reproductor de audio flotante */
#mini-au{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(170px + var(--safe-b));z-index:26;display:none;align-items:center;gap:10px;max-width:calc(100vw - 24px);background:rgba(16,19,28,.94);border:1px solid var(--line);border-radius:16px;padding:8px 12px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#mini-au.on{display:flex;animation:entra .3s both}
body.con-hoja #mini-au{bottom:calc(12px + var(--safe-b))}
#mini-au span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:56vw}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:var(--ok);border-radius:2px;animation:eq .8s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.25s}.eq i:nth-child(3){animation-delay:-.5s}.eq i:nth-child(4){animation-delay:-.65s}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
/* avisos, subida de nivel, carga */
.toasts{position:fixed;left:12px;right:12px;top:calc(104px + var(--safe-t));z-index:40;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:rgba(18,22,32,.95);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:13px;padding:9px 13px;font-size:13.5px;box-shadow:0 10px 26px rgba(0,0,0,.5);animation:tin .45s cubic-bezier(.2,1.3,.4,1) both;max-width:100%}
.toast.run{border-left-color:var(--run)}.toast.err{border-left-color:var(--err)}.toast.oro{border-left-color:var(--oro)}
.toast.fuera{animation:tout .35s ease both}
@keyframes tin{from{opacity:0;transform:translateY(-24px) scale(.9)}}
@keyframes tout{to{opacity:0;transform:translateY(-14px) scale(.95)}}
.xpf{position:fixed;z-index:41;font-weight:800;font-size:16px;color:var(--oro);text-shadow:0 2px 6px #000;pointer-events:none;animation:xpf 1.2s ease-out both}
@keyframes xpf{from{transform:translate(-50%,0) scale(.6);opacity:0}20%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}to{transform:translate(-50%,-70px);opacity:0}}
#nivelup{position:fixed;inset:0;z-index:45;display:none;place-items:center;background:radial-gradient(circle,rgba(122,98,255,.35),rgba(3,4,8,.85));text-align:center}
#nivelup.on{display:grid;animation:fade .3s}
#nivelup .caja{animation:sube 1s cubic-bezier(.3,1.6,.5,1)}
#nivelup .n{font-size:84px;font-weight:900;background:linear-gradient(135deg,#ffd166,#ff5fa8,#8b74ff);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
#nivelup h2{margin:6px 0 4px;font-size:24px}#nivelup p{color:#cfd4e6;margin:0 24px 18px}
@keyframes fade{from{opacity:0}}
#carga{position:fixed;inset:0;z-index:60;background:radial-gradient(circle at 50% 40%,#1a1640,#0a0c12 70%);display:grid;place-items:center;text-align:center;transition:opacity .6s}
#carga.fuera{opacity:0;pointer-events:none}
#carga .logo{width:84px;height:84px;margin:0 auto 18px;border-radius:24px;position:relative;overflow:hidden}
#carga .logo:before{content:"";position:absolute;inset:-30%;background:conic-gradient(#8b74ff,#ff5fa8,#ffb35c,#47d1a8,#4aa8ff,#8b74ff);animation:gira 2s linear infinite}
#carga .logo:after{content:"🏭";position:absolute;inset:9px;border-radius:16px;background:#0a0c12;display:grid;place-items:center;font-size:36px}
@keyframes gira{to{transform:rotate(1turn)}}
#carga h1{margin:0;font-size:26px}#carga p{color:var(--mut);margin:6px 30px 0;font-size:14px}
#carga .bar{width:200px;height:6px;border-radius:9px;background:#262d40;margin:18px auto 0;overflow:hidden}
#carga .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8b74ff,#ff5fa8);transition:width .4s}
#carga .btn{margin:22px auto 0;width:220px;display:none}
.confeti{position:fixed;z-index:50;pointer-events:none;width:8px;height:12px;border-radius:2px;top:0;left:0}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="carga"><div><div class="logo"></div><h1>Fábrica 3D</h1><p id="carga-tx">Encendiendo las máquinas…</p><div class="bar"><i id="carga-bar"></i></div><button class="btn pri" id="b-jugar">▶ Entrar a la fábrica</button></div></div>
<div class="hud-top">
  <button class="perfil" id="b-perfil"><div class="nivel" id="nivel">1</div><div class="pf-tx"><b id="rango">Becario</b><div class="xpbar"><i id="xpbar"></i></div><small id="xptx">0 / 100 XP</small></div></button>
  <div class="monedas"><div class="pill" id="p-cr">🪙 <span id="cr">0</span></div><div class="pill" id="p-bob">🎞 <span id="bob">0</span></div></div>
</div>
<div class="lugar" id="lugar">Recepción</div>
<div class="hud-der">
  <button class="rb" id="b-mis" title="Órdenes del día">📋<span class="badge" id="badge-mis" hidden></span></button>
  <button class="rb" id="b-med" title="Medallas">🏆</button>
  <button class="rb" id="b-tienda" title="Tienda">🛒</button>
  <button class="rb" id="b-son" title="Sonido">🔊</button>
  <button class="rb" id="b-panel" title="Panel">📊</button>
</div>
<div id="joy"><i></i></div>
<button id="accion"></button>
<div id="mini-au"><span class="eq"><i></i><i></i><i></i><i></i></span><span id="au-tx"></span><button class="btn" id="au-stop" style="height:32px;padding:0 10px">⏹</button></div>
<div class="velo" id="velo"></div>
<div class="hoja" id="hoja"><div class="cab"><h2 id="hoja-t"></h2><button class="x" id="hoja-x">✕</button></div><div class="cont" id="hoja-c"></div></div>
<div class="toasts" id="toasts"></div>
<div id="nivelup"><div class="caja"><div class="n" id="nu-n">2</div><h2 id="nu-t">¡Subiste de rango!</h2><p id="nu-p"></p><button class="btn pri" id="nu-ok" style="margin:0 auto;width:200px">¡Vamos!</button></div></div>
<audio id="au" preload="none"></audio>
<script type="importmap">{"imports":{"three":"/v2/app/three.module.min.js"}}</script>
<script type="module">
import * as THREE from "three";
const RUTA=k=>location.pathname.startsWith("/v2/")?({"/juego":"/v2/aldea","/m":"/v2/movil","/fabrica3d":"/v2/juego"}[k]||k):k;   // en la PC sin la puerta no hay atajos
const $=s=>document.querySelector(s),enc=encodeURIComponent,encR=r=>r.split("/").map(enc).join("/");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const porNombre=v=>(D.E&&D.E.proyectos||[]).find(p=>p.nombre===v);

function enVivo(p){if(!p)return false;if(p.render||(p.voz_vivo&&p.voz_vivo.total)||(p.secuencia&&p.secuencia.activo))return true;if(procsDe(p.nombre).length)return true;return !!p.etapa_actual&&ahora()-(p.actividad||0)<900;}

function etapasDe(p){return (D.E.etapas||[]).filter(e=>p.etapas&&p.etapas[e.id]);}
const nombreEtapa=id=>((D.E.etapas||[]).find(e=>e.id===id)||{}).nombre||id;

function elegidos(){       // las celdas de la nave: lo que trabaja, lo que está a medias y lo último terminado (máx. 18)
  const ps=(D.E.proyectos||[]).filter(p=>!p.archivado&&!p.suspendido&&!p.reemplazado_por);
  const act=(a,b)=>(b.actividad||0)-(a.actividad||0);
  const vivos=ps.filter(enVivo),medias=ps.filter(p=>!p.oculto&&!subido(p)&&!enVivo(p)),listos=ps.filter(p=>subido(p)&&!enVivo(p));
  const out=[...vivos.sort(act),...medias.sort(act)].slice(0,14);
  for(const p of listos.sort(act)){if(out.length>=18)break;out.push(p);}
  return out;
}
function vivoTexto(p){
  if(p.render&&p.render.total)return `Render ${p.render.hechos}/${p.render.total}`;
  if(p.voz_vivo&&p.voz_vivo.total)return `${p.voz_vivo.titulo||nombreEtapa(p.voz_vivo.etapa)} ${p.voz_vivo.hechos}/${p.voz_vivo.total}`;
  if(p.secuencia&&p.secuencia.activo)return `Flow ${p.secuencia.hechos}/${p.secuencia.total}`;
  const pr=procsDe(p.nombre)[0];if(pr)return pr.rol.replace(/^fab\.py\s*/,"");
  return p.etapa_actual?nombreEtapa(p.etapa_actual):"";

function detectaCambios(){
  const act={};for(const p of D.E.proyectos||[])act[p.nombre]=Object.fromEntries(Object.entries(p.etapas||{}).map(([k,v])=>[k,v.estado]));
  if(D.prev&&!D.primera&&!document.hidden){
    for(const p of D.E.proyectos){const a=act[p.nombre],b=D.prev[p.nombre];if(!b)continue;
      for(const [k,e] of Object.entries(a)){if(e==="listo"&&b[k]&&b[k]!=="listo"){
        toast(`🏭 <b>${esc(nombreEtapa(k))}</b> terminó · ${esc(p.titulo)}`,"run");sfx.alarma();vibra([40,40,40]);
        const cel=CELDAS.get(p.nombre);if(cel)cel.celebra=2.5;evento("testigo");ganaXP(60,"testigo");}
        else if(e==="error"&&b[k]!=="error"){toast(`⚠️ Error en ${esc(nombreEtapa(k))} · ${esc(p.titulo)}`,"err");sfx.mal();}}}

async function quiz(){

  if(fr.length<3){toast("Este guion es muy corto para el juego","err");return;}
  const f=fr[Math.floor(Math.random()*fr.length)],pal=f.texto.split(/\s+/),cand=pal.map((w,i)=>[w.replace(/[^\p{L}\p{N}]/gu,""),i]).filter(([w])=>w.length>=5);

  const otras=[...new Set(fr.flatMap(x=>x.texto.split(/\s+/)).map(w=>w.replace(/[^\p{L}\p{N}]/gu,"")).filter(w=>w.length>=5&&w.toLowerCase()!==ok.toLowerCase()))].sort(()=>Math.random()-.5).slice(0,2);

canvas.addEventListener("pointerup",e=>{toques.delete(e.pointerId);if(tocaIni&&performance.now()-tocaIni.t<400&&Math.hypot(e.clientX-tocaIni.x,e.clientY-tocaIni.y)<12)toca(e.clientX,e.clientY);tocaIni=null;});

const ray=new THREE.Raycaster(),suelo=new THREE.Plane(new THREE.Vector3(0,1,0),0);
function toca(x,y){
  const p=new THREE.Vector2(x/innerWidth*2-1,-(y/innerHeight)*2+1);ray.setFromCamera(p,camara);
  const cand=INTER.filter(i=>i.esc===ESC);const hits=ray.intersectObjects(cand.map(c=>c.obj),true);
  if(hits.length){let o=hits[0].object;while(o&&!cand.find(c=>c.obj===o))o=o.parent;const it=cand.find(c=>c.obj===o);
    if(it){yo.objetivo=it.pos.clone();yo.alLlegar=it;sfx.tap();marcaDestino(it.pos);return;}}
  const q=new THREE.Vector3();if(ray.ray.intersectPlane(suelo,q)){yo.objetivo=q;yo.alLlegar=null;sfx.tap();marcaDestino(q);}
}

// ================================================================== bucle principal
const reloj=new THREE.Clock();let tBob=0,tPaso=0,tEst=0;
function cuadro(){
  requestAnimationFrame(cuadro);if(document.hidden)return;
  const dt=Math.min(reloj.getDelta(),.05),t=reloj.elapsedTime;
  // movimiento
  let mx=JOY.x,mz=JOY.y;if(TECLAS.a||TECLAS.arrowleft)mx=-1;if(TECLAS.d||TECLAS.arrowright)mx=1;if(TECLAS.w||TECLAS.arrowup)mz=-1;if(TECLAS.s||TECLAS.arrowdown)mz=1;
  if(yo.objetivo&&!mx&&!mz){const d=new THREE.Vector3().subVectors(yo.objetivo,yo.g.position);d.y=0;const L=d.length();
    if(L<.35){yo.objetivo=null;DEST.visible=false;if(yo.alLlegar){const it=yo.alLlegar;yo.alLlegar=null;if(it.tipo==="estacion"||it.tipo==="trivia"||it.tipo==="ordenes"||it.tipo==="tienda"||it.tipo==="reactor")usa(it);}}
    else{mx=d.x/L;mz=d.z/L;}}
  const m=Math.hypot(mx,mz),vel=7.5*Math.min(1,m);
  if(m>.08){const nx=yo.g.position.x+mx/m*vel*dt,nz=yo.g.position.z+mz/m*vel*dt;mueveCon(nx,nz);yo.dir=Math.atan2(mx,mz);yo.paso+=dt*vel*1.6;
    tPaso+=dt*vel;if(tPaso>1.6){tPaso=0;sfx.paso();}if(t-tEst>.03){tEst=t;emiteEstela(t);}}
  else yo.paso*=.85;
  let dr=yo.dir-yo.g.rotation.y;dr=Math.atan2(Math.sin(dr),Math.cos(dr));yo.g.rotation.y+=dr*Math.min(1,dt*12);
  const sw=Math.sin(yo.paso)*.5*Math.min(1,m*2);if(yo.pi){yo.pi.rotation.x=sw;yo.pd.rotation.x=-sw;yo.bi.rotation.x=-sw*.8;yo.bd.rotation.x=sw*.8;yo.cuerpo.position.y=1.05+Math.abs(Math.sin(yo.paso))*.08;yo.bola.position.y=3.08+Math.sin(t*4)*.04;}
  // cámara
  const off=ESC===NAVE?new THREE.Vector3(0,15,13):new THREE.Vector3(0,11,10);off.multiplyScalar(ZOOM.v);
  const meta=yo.g.position.clone().add(off);if(yo.snap){camara.position.copy(meta);yo.snap=false;}else camara.position.lerp(meta,Math.min(1,dt*4));camara.lookAt(yo.g.position.x,yo.g.position.y+1.2,yo.g.position.z-1);
  // escenas
  if(ESC===NAVE){for(const c of CELDAS.values())c.anima(t,dt);
    if(REACTOR){const s=D.SIS,gpu=(s&&s.gpu&&s.gpu.uso)||0,cpu=(s&&s.cpu&&s.cpu.uso)||0;REACTOR.nucleo.rotation.y+=dt*(.4+gpu/60);REACTOR.nucleo.rotation.x+=dt*.2;
      REACTOR.nucleo.material.emissiveIntensity=1+Math.sin(t*(2+gpu/25))*.4+gpu/120;REACTOR.aros.forEach((a,i)=>{a.rotation.x=t*(.3+i*.2+cpu/150);a.rotation.y=t*(.5-i*.15);});}}
  else{if(HOLO)HOLO.rotation.y+=dt*.5;HOLO&&HOLO.children.forEach((a,i)=>{if(a.userData.st==="en_curso")a.material.opacity=.5+Math.sin(t*6)*.45;});
    for(const it of INTER){if(it.esc!==SALA||it.tipo!=="estacion")continue;const u=it.obj.userData;if(u.ic)u.ic.position.y=3.9+Math.sin(t*2+it.pos.x)*.15;
      it.obj.traverse(o=>{const d=o.userData;if(d.gira)d.gira.rotation.y+=dt*1.5;if(d.late)d.late.scale.setScalar(1+Math.sin(t*6)*.06);if(d.barras)d.barras.forEach((b,k)=>{b.scale.y=.3+Math.abs(Math.sin(t*(3+k)+k))*1.2;});if(d.parpadea)d.parpadea.material.color.setHSL((t*.1)%1,.6,.55);});}}
  // bobinas
  for(let i=BOBINAS.length-1;i>=0;i--){const b=BOBINAS[i];if(b.esc!==ESC)continue;b.t+=dt;b.m.rotation.z+=dt*3;b.m.position.y=1+Math.sin(b.t*3)*.2;
    if(b.nace>0){b.nace-=dt*2;b.m.scale.setScalar(1-Math.max(0,b.nace));}
    if(b.m.position.distanceTo(new THREE.Vector3(yo.g.position.x,1,yo.g.position.z))<1.3){ESC.remove(b.m);BOBINAS.splice(i,1);G.bob++;sfx.bobina();vibra(8);ganaXP(4);
      if(G.bob%5===0)ganaCr(1);evento("bobina");const p=$("#p-bob");p.classList.remove("pop");void p.offsetWidth;p.classList.add("pop");}}
  tBob+=dt;if(tBob>6){tBob=0;bobinasAlAzar();}
  if(DEST.visible){DEST.userData.t+=dt;DEST.scale.setScalar(1+Math.sin(DEST.userData.t*6)*.15);}
  // botón de acción
  const it=interaccionCercana();if(it!==CERCA){CERCA=it;const b=$("#accion");if(it){b.innerHTML=`<span>${textoAccion(it)}</span>`;b.classList.add("on");}else b.classList.remove("on");}
  renderer.render(ESC,camara);
}
function mueveCon(nx,nz){
  if(ESC===NAVE){nx=clamp(nx,-W/2+2,W/2-2);nz=clamp(nz,-L/2+2,L/2+4);
    for(const c of CELDAS.values()){const cx=c.g.position.x,cz=c.g.position.z;if(nx>cx-5.4&&nx<cx+5.4&&nz>cz-4.9&&nz<cz+3.6){
      const opts=[[cx-5.4,nz],[cx+5.4,nz],[nx,cz-4.9],[nx,cz+3.6]];let best=opts[0],bd=1e9;for(const o of opts){const d=Math.hypot(o[0]-nx,o[1]-nz);if(d<bd){bd=d;best=o;}}nx=best[0];nz=best[1];}}
    for(const [x,z,r] of [[0,24,2.8],[-12,24,1.8],[12,24,1.9],[24,25,2.4]]){const d=Math.hypot(nx-x,nz-z);if(d<r){nx=x+(nx-x)/d*r;nz=z+(nz-z)/d*r;}}}
  else{const d=Math.hypot(nx,nz);if(d>10.8){nx*=10.8/d;nz*=10.8/d;}if(d<2.2){nx*=2.2/Math.max(d,.01);nz*=2.2/Math.max(d,.01);}
    for(const it of INTER){if(it.esc!==SALA||it.tipo!=="estacion")continue;const p=it.obj.position,dd=Math.hypot(nx-p.x,nz-p.z);if(dd<1.6){nx=p.x+(nx-p.x)/dd*1.6;nz=p.z+(nz-p.z)/dd*1.6;}}}
  yo.g.position.x=nx;yo.g.position.z=nz;
}
