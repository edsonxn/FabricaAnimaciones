<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control del directo</title>
<style>
  :root { --fondo: #14100b; --caja: #1f1810; --linea: #3a2d1c; --texto: #f2e6c8; --suave: #b5a37a; --oro: #e8c776; --rojo: #e5483c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font: 14px/1.4 system-ui, "Segoe UI", sans-serif; padding: 14px; }
  h1 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; letter-spacing: .04em; }
  h1 i { width: 10px; height: 10px; border-radius: 50%; background: var(--rojo); animation: p 1.2s infinite; }
  @keyframes p { 50% { opacity: .3; } }
  .caja { background: var(--caja); border: 1px solid var(--linea); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .eti { color: var(--suave); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
  .tema { font-size: 17px; font-weight: 700; color: var(--oro); }
  .frase { color: var(--texto); opacity: .9; margin-top: 6px; font-style: italic; min-height: 2.8em; }
  form { display: flex; gap: 6px; }
  input[type=text] { flex: 1; min-width: 0; background: #0e0b07; color: var(--texto); border: 1px solid var(--linea); border-radius: 8px; padding: 10px; font-size: 15px; }
  button { background: var(--oro); color: #1a1209; border: 0; border-radius: 8px; padding: 9px 12px; font-weight: 700; cursor: pointer; font-size: 14px; }
  button.sec { background: #2c2216; color: var(--texto); border: 1px solid var(--linea); }
  button:active { transform: translateY(1px); }
  .ops { display: grid; gap: 6px; margin-top: 6px; }
  .op { display: flex; gap: 6px; align-items: center; }
  .op span { flex: 1; }
  .op b { color: var(--oro); min-width: 28px; text-align: right; }
  .fila { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 8px; border-radius: 99px; background: #2c2216; color: var(--suave); }
  .chip.ok { color: #9be39b; } .chip.mal { color: #ff9b8f; }
  pre { margin: 0; white-space: pre-wrap; font: 11px/1.45 ui-monospace, Consolas, monospace; color: var(--suave); max-height: 190px; overflow: auto; }
  label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  select { background: #0e0b07; color: var(--texto); border: 1px solid var(--linea); border-radius: 6px; padding: 4px; }
</style>
</head>
<body>
<h1><i></i> CONTROL DEL DIRECTO <span id="canal" class="chip"></span></h1>

<div class="caja">
  <div class="eti">Al aire</div>
  <div class="tema" id="tema">—</div>
  <div class="frase" id="frase"></div>
  <div class="fila" style="margin-top:6px">
    <span class="chip" id="bufer"></span><span class="chip" id="estado"></span><span class="chip" id="tmedio"></span>
  </div>
</div>

<div class="caja">
  <div class="eti">Cambiar el tema ahora</div>
  <form id="f"><input id="nuevo" type="text" placeholder="p. ej. Los dragones que no son de Alduin" autocomplete="off"><button>Cambiar</button></form>
  <div class="eti" style="margin-top:10px">Sugerencias del bloque al aire (clic = cambiar ya)</div>
  <div class="ops" id="sug"></div>
</div>

<div class="caja">
  <div class="fila" style="justify-content:space-between">
    <label><input type="checkbox" id="votacion"> Votación del público en pantalla</label>
  </div>
  <div class="eti" style="margin-top:8px">Votos (aquí simulas al chat; gana al cerrar el bloque)</div>
  <div class="ops" id="votos"></div>
</div>

<div class="caja fila">
  <button class="sec" id="pausa">Pausar producción</button>
  <label>Guionista <select id="modelo"><option>sonnet</option><option>haiku</option></select></label>
  <a class="chip" href="/" target="_blank" style="text-decoration:none">abrir pantalla ↗</a>
</div>

<div class="caja"><div class="eti">Registro</div><pre id="log"></pre></div>

<script>
const $ = id => document.getElementById(id);
const post = (u, b) => fetch(u, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b) });
let e = {};
$("f").onsubmit = ev => { ev.preventDefault(); const t = $("nuevo").value.trim(); if (t) { post("/api/tema", { tema: t }); $("nuevo").value = ""; } };
$("votacion").onchange = () => post("/api/ajuste", { votacion: $("votacion").checked });
$("pausa").onclick = () => post("/api/ajuste", { pausado: !e.pausado });
$("modelo").onchange = () => post("/api/ajuste", { modelo: $("modelo").value });
function lista(cont, ops, boton, votos) {
  const firma = JSON.stringify([ops, votos]);
  if (cont.dataset.f === firma) return; cont.dataset.f = firma;
  cont.innerHTML = "";
  for (const o of ops) {
    const d = document.createElement("div"); d.className = "op";
    const s = document.createElement("span"); s.textContent = o; d.appendChild(s);
    if (votos) { const b = document.createElement("b"); b.textContent = votos[o] || 0; d.appendChild(b); }
    const bt = document.createElement("button"); bt.className = "sec"; bt.textContent = boton; d.appendChild(bt);
    bt.onclick = () => votos ? post("/api/votar", { opcion: o }) : post("/api/tema", { tema: o });
    cont.appendChild(d);
  }
}
async function leer() {
  try {
    e = await (await fetch("/api/estado")).json();
    $("canal").textContent = e.canal;
    $("tema").textContent = e.al_aire ? e.al_aire.tema : e.tema;
    $("frase").textContent = e.al_aire ? "«" + e.al_aire.frase + "»" : "esperando el primer bloque…";
    if (e.al_aire && e.al_aire.tema !== e.tema) $("tema").textContent += "  →  " + e.tema;
    $("bufer").textContent = `búfer: ${e.bufer.length} bloque(s) · ${e.bufer_s} s`;
    $("bufer").className = "chip " + (e.bufer.length ? "ok" : "mal");
    $("estado").textContent = e.pausado ? "PAUSADO" : e.estado;
    $("tmedio").textContent = e.tiempo_medio ? `≈ ${e.tiempo_medio} s por bloque` : "";
    $("votacion").checked = e.votacion;
    $("pausa").textContent = e.pausado ? "Reanudar producción" : "Pausar producción";
    $("modelo").value = e.modelo;
    lista($("sug"), e.opciones, "Ir", null);
    lista($("votos"), e.opciones, "+1", e.votos);
    $("log").textContent = e.log.slice().reverse().join("\n");
  } catch (err) { $("estado").textContent = "sin conexión"; }
  setTimeout(leer, 1000);
}
leer();
</script>
</body>
</html>
