<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>En vivo</title>
<style>
  /* La letra del kit de Crónicas de Tamriel (nucleo/mg_tes.py): Bahnschrift Condensed, lo más parecido a la Futura Condensed de Skyrim */
  @font-face { font-family: "Bahn"; src: url(/fuente/bahnschrift.ttf); font-weight: 300 700; font-stretch: 75% 100%; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: absolute; inset: 0; margin: auto; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; display: block; }
  video { display: none; }
  #arranque { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column;
    background: radial-gradient(circle at 50% 45%, #1b1b1d 0%, #060608 70%); color: #ece6d6; font-family: Bahn, sans-serif;
    font-stretch: 75%; cursor: pointer; z-index: 5; letter-spacing: .18em; }
  #arranque b { font-size: 44px; font-weight: 600; }
  #arranque span { margin-top: 14px; font-size: 16px; color: #96928a; letter-spacing: .12em; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<video id="v0" muted playsinline preload="auto"></video>
<video id="v1" muted playsinline preload="auto"></video>
<div id="arranque"><b>EMPEZAR EL DIRECTO</b><span>CLIC PARA ACTIVAR EL SONIDO · EN OBS USA ?AUTO=1</span></div>
<script>
"use strict";
const W = 1920, H = 1080;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const vids = [document.getElementById("v0"), document.getElementById("v1")];
// colores de mg_tes.py / peg_estilos.TEMAS["tes"]
const HUESO = "rgb(236,230,214)", GRIS = "rgb(150,146,138)", SANGRE = "rgb(196,38,30)", ORO = "rgb(214,186,120)";
const PAPEL = "rgb(214,194,150)", TINTA = "rgb(58,40,24)", BLANCO_P = "rgb(250,247,238)";
const ahora = () => performance.now() / 1000;
const CODIGO = new URLSearchParams(location.search).get("codigo") || "";
const ease = t => 1 - Math.pow(1 - Math.min(Math.max(t, 0), 1), 3);
const pop = (dt, dur = 0.35) => { if (dt <= 0) return 0; const u = dt / dur; return u >= 1.6 ? 1 : 1 - Math.exp(-6 * u) * Math.cos(9 * u); };
const rnd = (a, b) => a + Math.random() * (b - a);
const F = (estilo, px) => `${estilo} condensed ${px}px Bahn, Bahnschrift, sans-serif`;   // 400 Condensed, 600 SemiBold, 700 Bold

// ---------------- estado ----------------
let seg = null, idx = -1, siguiente = null, pidiendo = false, enPuente = false, esperaInfo = null;
let relleno = null;   // bloque del tema viejo que suena mientras se escribe el nuevo (sin pantalla de espera)
// latencia del cambio de tema (4-nov noche): lo nuevo (la frase puente) no entra antes de lat_min s y, si la frase vieja
// sigue sonando a los lat_max s, se corta con un fundido corto
let cambioT = -1e9, verVisto = null, cortando = false;
let audio = null, finFraseTimer = null, arrancado = false;
let vidCur = 0, vidAlpha = [1, 0], vidFade = null, vidClip = ["", ""], vidPrep = [null, null], clipPendiente = false;
let pegatinas = [], aviso = null, ficha = null, temaBar = { txt: "", t0: 0 };
let estado = { votacion: false, opciones: [], votos: {} };
let nPeg = Math.floor(Math.random() * 8), anuncioVisto = Date.now() / 1000;
// comentarios del chat: «carta» grande (la que contesta la voz, o la que enseña la IA / el panel) y la fijada
let carta = null, cartaSale = null, cartaPend = null, cartaVista = "";
// ?monitor=1: espejo para el panel /admin; no pide bloques ni suena (sigue lo que está al aire en la pantalla de OBS)
const MONITOR = new URLSearchParams(location.search).has("monitor");
const cacheImg = new Map();

// ---------------- texto al estilo mg_tes._texto: sombra dura 2 px + espaciado ----------------
function texto(s, x, y, estilo, px, color, align = "center", alpha = 1, track = 0, maxW) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.font = F(estilo, px); ctx.textAlign = align; ctx.textBaseline = "middle"; ctx.letterSpacing = track + "px";
  ctx.globalAlpha = alpha * 0.85; ctx.fillStyle = "#000"; ctx.fillText(s, x + 2, y + 2, maxW);
  ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.fillText(s, x, y, maxW);
  ctx.restore();
}
function anchoTexto(s, estilo, px, track = 0) {
  ctx.save(); ctx.font = F(estilo, px); ctx.letterSpacing = track + "px"; const w = ctx.measureText(s).width; ctx.restore(); return w;
}
// separador de los menús: línea que se desvanece hacia los extremos, rombo al centro
function separador(cx, y, medio, alpha = 1, rombo = true) {
  ctx.save();
  for (const s of [-1, 1]) {
    const g = ctx.createLinearGradient(cx + s * 8, 0, cx + s * (8 + medio), 0);
    g.addColorStop(0, `rgba(236,230,214,${0.9 * alpha})`); g.addColorStop(1, "rgba(236,230,214,0)");
    ctx.fillStyle = g; ctx.fillRect(Math.min(cx + s * 8, cx + s * (8 + medio)), y - 1, medio, 2);
  }
  if (rombo) {
    ctx.globalAlpha = alpha;
    ctx.beginPath(); ctx.moveTo(cx - 7, y); ctx.lineTo(cx, y - 7); ctx.lineTo(cx + 7, y); ctx.lineTo(cx, y + 7); ctx.closePath();
    ctx.fillStyle = "rgba(0,0,0,0.63)"; ctx.fill(); ctx.strokeStyle = HUESO; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - 3, y); ctx.lineTo(cx, y - 3); ctx.lineTo(cx + 3, y); ctx.lineTo(cx, y + 3); ctx.closePath();
    ctx.fillStyle = HUESO; ctx.fill();
  }
  ctx.restore();
}
// panel de humo negro con bordes difuminados (mg_tes._humo), precalculado por tamaño
const cacheHumo = new Map();
function dibujarHumo(x, y, w, h, alpha = 1, fuerza = 0.8) {
  const k = `${Math.round(w)}x${Math.round(h)}x${fuerza}`;
  if (!cacheHumo.has(k)) {
    const M = 70, c = document.createElement("canvas"); c.width = Math.round(w) + 2 * M; c.height = Math.round(h) + 2 * M;
    const g = c.getContext("2d"); g.filter = "blur(26px)"; g.fillStyle = `rgba(6,6,8,${fuerza})`;
    g.beginPath(); g.roundRect(M + 10, M + 10, w - 20, h - 20, 40); g.fill();
    cacheHumo.set(k, { c, M });
  }
  if (alpha <= 0) return;
  const { c, M } = cacheHumo.get(k); ctx.save(); ctx.globalAlpha = alpha; ctx.drawImage(c, x - M, y - M); ctx.restore();
}

// ---------------- red ----------------
async function pedirSiguiente() {
  if (pidiendo || siguiente) return;
  pidiendo = true;
  try {
    while (true) {
      let r;
      try { r = await (await fetch("/api/siguiente?espera=15")).json(); }
      catch (e) { await new Promise(s => setTimeout(s, 1500)); continue; }
      if (r.espera) { esperaInfo = r; continue; }
      if (!vigente(r)) {                                 // del tema viejo: solo de relleno mientras llega el nuevo
        if (!relleno) { relleno = r; precargar(r); }
        if (enPuente && relleno) { siguiente = relleno; relleno = null; empezarBloque(); }
        continue;
      }
      siguiente = r; esperaInfo = null; precargar(r);
      if (enPuente) empezarBloque();
      break;
    }
  } finally { pidiendo = false; }
}
function precargar(s) {
  for (const f of s.frases) {
    if (f.audio && !MONITOR) { f._audio = new Audio(f.audio); f._audio.preload = "auto"; }
    if (f.peg) { f.peg.estilo = elegirEstilo(f.peg); pegatinaLista(f.peg); }
  }
}

// ---------------- pegatinas (mg_tes.pegatina + nucleo/peg_estilos.py) ----------------
// carta: foto con marco blanco y su rótulo · silueta: recorte con contorno blanco · camafeo: medallón con anillo de runas
// legajo: expediente de pergamino con retrato en sepia · grande: personaje sin fondo a media pantalla saliendo del borde
const ESTILOS_FOTO = ["carta", "camafeo", "carta", "legajo"];
function elegirEstilo(p) {
  nPeg++;
  if (p.rec && nPeg % 2 === 0) return "grande";
  return p.rec ? "silueta" : ESTILOS_FOTO[nPeg % ESTILOS_FOTO.length];
}
function pegatinaLista(p) {
  const clave = p.url + "|" + p.estilo;
  if (cacheImg.has(clave)) return cacheImg.get(clave);
  const o = { listo: false, can: null };
  cacheImg.set(clave, o);
  const im = new Image();
  im.onload = () => { try { o.can = construir(im, p); o.listo = true; } catch (e) { console.error(e); } };
  im.src = (p.estilo === "grande" || p.estilo === "silueta") && p.rec ? p.rec : p.url;
  return o;
}
function recortar(im) {           // ¿tiene fondo transparente? -> recorte a su caja (como mg_tes._base_pegatina)
  const c = document.createElement("canvas"); c.width = im.width; c.height = im.height;
  const g = c.getContext("2d", { willReadFrequently: true }); g.drawImage(im, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height).data;
  let vacios = 0, n = 0, x0 = c.width, y0 = c.height, x1 = 0, y1 = 0;
  for (let y = 0; y < c.height; y += 2) for (let x = 0; x < c.width; x += 2) {
    n++;
    if (d[(y * c.width + x) * 4 + 3] < 10) vacios++; else { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (vacios / n <= 0.12 || x1 <= x0) return { img: c, transparente: false };
  const r = document.createElement("canvas"); r.width = x1 - x0 + 2; r.height = y1 - y0 + 2;
  r.getContext("2d").drawImage(c, -x0, -y0);
  return { img: r, transparente: true };
}
function escalar(img, tam) {
  const e = tam / Math.max(img.width, img.height), c = document.createElement("canvas");
  c.width = Math.max(2, Math.round(img.width * e)); c.height = Math.max(2, Math.round(img.height * e));
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); return c;
}
function contornoBlanco(img, borde) {
  const tin = document.createElement("canvas"); tin.width = img.width; tin.height = img.height;
  const t = tin.getContext("2d"); t.drawImage(img, 0, 0); t.globalCompositeOperation = "source-in"; t.fillStyle = BLANCO_P; t.fillRect(0, 0, img.width, img.height);
  const P = borde * 2, c = document.createElement("canvas"); c.width = img.width + 2 * P; c.height = img.height + 2 * P;
  const g = c.getContext("2d");
  for (let a = 0; a < 28; a++) { const r = a / 28 * Math.PI * 2; g.drawImage(tin, P + Math.cos(r) * borde, P + Math.sin(r) * borde); }
  g.drawImage(img, P, P); return c;
}
function rotuloBlanco(g, cx, y, txt, px) {     // pestaña blanca con el nombre en tinta oscura (las pegatinas del canal)
  g.save(); g.font = F(700, px); g.letterSpacing = "2px";
  const w = Math.min(g.measureText(txt).width + 40, 900);
  g.fillStyle = BLANCO_P; g.beginPath(); g.roundRect(cx - w / 2, y, w, px + 22, 10); g.fill();
  g.fillStyle = "rgb(24,22,20)"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(txt, cx, y + (px + 22) / 2 + 1, 860);
  g.restore();
}
function construir(im, p) {
  const nombre = (p.nombre || "").toUpperCase();
  const { img, transparente } = recortar(im);
  if (p.estilo === "grande") return escalar(img, 1000);
  if (p.estilo === "silueta" || (transparente && p.estilo !== "camafeo")) {
    const s = contornoBlanco(escalar(img, 640), 11);
    const c = document.createElement("canvas"); c.width = Math.max(s.width, 420); c.height = s.height + 70;
    const g = c.getContext("2d"); g.drawImage(s, (c.width - s.width) / 2, 0);
    if (nombre) rotuloBlanco(g, c.width / 2, s.height - 28, nombre, 30);
    return c;
  }
  if (p.estilo === "camafeo") {
    const R = 230, c = document.createElement("canvas"); c.width = 2 * R + 80; c.height = 2 * R + 140;
    const g = c.getContext("2d"), cx = c.width / 2, cy = R + 40;
    g.save(); g.beginPath(); g.arc(cx, cy, R - 18, 0, 7); g.clip();
    const e = Math.max((2 * R) / img.width, (2 * R) / img.height); g.drawImage(img, cx - img.width * e / 2, cy - img.height * e / 2, img.width * e, img.height * e);
    g.restore();
    g.strokeStyle = ORO; g.lineWidth = 6; g.beginPath(); g.arc(cx, cy, R - 14, 0, 7); g.stroke();
    g.strokeStyle = HUESO; g.lineWidth = 2; g.beginPath(); g.arc(cx, cy, R + 4, 0, 7); g.stroke();
    for (let i = 0; i < 36; i++) { const a = i / 36 * Math.PI * 2, r0 = R - 4, r1 = R + (i % 3 ? 0 : 12);
      g.beginPath(); g.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0); g.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); g.stroke(); }
    g.font = F(700, 40); g.letterSpacing = "3px"; g.textAlign = "center"; g.textBaseline = "middle";
    g.fillStyle = "rgba(0,0,0,.85)"; g.fillText(nombre, cx + 2, cy + R + 52, c.width - 20); g.fillStyle = HUESO; g.fillText(nombre, cx, cy + R + 50, c.width - 20);
    return c;
  }
  if (p.estilo === "legajo") {
    const foto = escalar(img, 470), w = foto.width + 90, h = foto.height + 190;
    const c = document.createElement("canvas"); c.width = w; c.height = h; const g = c.getContext("2d");
    g.fillStyle = PAPEL; g.beginPath(); g.moveTo(0, 6);                      // borde rasgado
    for (let x = 0; x <= w; x += 18) g.lineTo(x, rnd(0, 9)); for (let y = 0; y <= h; y += 18) g.lineTo(w - rnd(0, 7), y);
    for (let x = w; x >= 0; x -= 18) g.lineTo(x, h - rnd(0, 9)); for (let y = h; y >= 0; y -= 18) g.lineTo(rnd(0, 7), y); g.fill();
    const gr = g.createRadialGradient(w / 2, h / 2, h * 0.2, w / 2, h / 2, h * 0.75); gr.addColorStop(0, "rgba(0,0,0,0)"); gr.addColorStop(1, "rgba(90,60,30,.35)");
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.filter = "sepia(0.85) contrast(1.05)"; g.drawImage(foto, 45, 45); g.filter = "none";
    g.strokeStyle = TINTA; g.lineWidth = 3; g.strokeRect(45, 45, foto.width, foto.height);
    g.font = F(700, 46); g.letterSpacing = "2px"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillStyle = TINTA;
    g.fillText(nombre, w / 2, foto.height + 95, w - 40);
    g.fillStyle = "rgba(58,40,24,.5)"; g.fillRect(w * 0.2, foto.height + 130, w * 0.6, 2);
    return c;
  }
  // carta: foto con esquinas redondeadas, marco blanco y la pestaña con el nombre
  const foto = escalar(img, 560), b = 14, c = document.createElement("canvas");
  c.width = foto.width + 2 * b; c.height = foto.height + 2 * b + 60; const g = c.getContext("2d");
  g.fillStyle = BLANCO_P; g.beginPath(); g.roundRect(0, 0, c.width, foto.height + 2 * b, 2 * b); g.fill();
  g.save(); g.beginPath(); g.roundRect(b, b, foto.width, foto.height, b); g.clip(); g.drawImage(foto, b, b); g.restore();
  if (nombre) rotuloBlanco(g, c.width / 2, foto.height + b - 6, nombre, 30);
  return c;
}
// dónde va (varía tamaño y posición; la ficha ocupa arriba a la derecha)
// (nada por debajo de ~0,83 H: ahí van la barra del tema y la votación)
const LUGARES = [{ x: 0.17, y: 0.56, h: 0.50 }, { x: 0.80, y: 0.55, h: 0.54 }, { x: 0.24, y: 0.50, h: 0.64 }, { x: 0.20, y: 0.60, h: 0.42 }, { x: 0.78, y: 0.60, h: 0.42 }];
let nLugar = Math.floor(Math.random() * 5);

// ---------------- clips de fondo (dos <video> que se funden) ----------------
function prepararClip(i, url) {
  const v = vids[i];
  if (vidClip[i] === url) return vidPrep[i];
  vidClip[i] = url;
  vidPrep[i] = new Promise(res => {
    const listo = () => { v.removeEventListener("loadedmetadata", alMeta); res(); };
    const alMeta = () => { const d = v.duration || 8; v.currentTime = d > 9 ? rnd(0.5, d - 8) : 0.2; v.addEventListener("seeked", listo, { once: true }); };
    v.addEventListener("loadedmetadata", alMeta);
    v.src = url; v.load();
    setTimeout(res, 2500);
  });
  return vidPrep[i];
}
// gameplay de YouTube por enlace directo (yt_vivo.py): arranca en un punto al azar (10-85 %); si no carga en 4 s, el del disco
function prepararYT(i, yt) {
  const v = vids[i];
  vidClip[i] = yt.url;
  return new Promise(res => {
    let fin = false;
    const acaba = ok => { if (fin) return; fin = true; v.removeEventListener("error", mal); res(ok); };
    const mal = () => acaba(false);
    v.addEventListener("error", mal, { once: true });
    v.addEventListener("loadedmetadata", () => { v.currentTime = yt.desde || (v.duration || 300) * 0.4;
      v.addEventListener("seeked", () => acaba(true), { once: true }); }, { once: true });
    v.src = yt.url; v.load();
    setTimeout(() => acaba(false), 4000);
  });
}
function avisaClip(fuente, titulo, canal) {
  if (MONITOR || !seg) return;
  fetch("/api/progreso", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: seg.id, frase: idx, clip: { fuente, titulo, canal } }) }).catch(() => {});
}
async function ponerClip(url, yt) {
  if (yt && yt.url && vidClip[vidCur] !== yt.url && !clipPendiente) {
    clipPendiente = true;
    const otro = 1 - vidCur;
    try {
      if (await prepararYT(otro, yt)) {
        try { await vids[otro].play(); } catch (e) {}
        vidFade = { de: vidCur, a: otro, t0: ahora() }; vidCur = otro;
        avisaClip("yt", yt.titulo, yt.canal);
        return;
      }
      vidClip[otro] = null; vidPrep[otro] = null;            // no cargó: el del disco, sin que se note
    } finally { clipPendiente = false; }
  }
  if (!url || vidClip[vidCur] === url || clipPendiente) return;
  clipPendiente = true;
  const otro = 1 - vidCur;
  try {
    await prepararClip(otro, url);
    try { await vids[otro].play(); } catch (e) {}
    vidFade = { de: vidCur, a: otro, t0: ahora() }; vidCur = otro;
    avisaClip("disco", url.split("/").slice(-2).join("/"), "");
  } finally { clipPendiente = false; }
}
function clipSiguiente() {
  if (seg && idx + 1 < seg.frases.length) return seg.frases[idx + 1].clip;
  return siguiente ? siguiente.frases[0].clip : null;
}

// ---------------- reproducción ----------------
function ponerAviso(arriba, titulo, dur, color = HUESO) { aviso = { arriba: (arriba || "").toUpperCase(), titulo: (titulo || "").toUpperCase(), t0: ahora(), dur, color }; }
function empezarBloque() {
  enPuente = false;
  const prev = seg;
  seg = siguiente; siguiente = null; idx = -1;
  if (vigente(seg)) relleno = null;
  const yaAnunciado = prev && prev.inmediato && prev.ver === seg.ver;    // la frase puente ya puso el aviso del tema nuevo
  if (seg.puente && !yaAnunciado) ponerAviso(seg.origen === "votación" ? "El chat decidió" : seg.origen === "chat" ? "Lo pidió el chat" : "Nuevo tema", seg.tema, 4.5, SANGRE);
  else ponerAviso("En vivo · " + (seg.tema || ""), seg.titulo, 3.8);
  if (temaBar.txt !== seg.tema) temaBar = { txt: seg.tema, t0: ahora() };
  siguienteFrase();
}
const vigente = s => !s || s.conservado || (s.ver || 0) >= (estado.tema_ver || 0);
function guardarRelleno() { if (siguiente && !vigente(siguiente)) { if (!relleno) relleno = siguiente; siguiente = null; } }
function siguienteFrase() {
  clearTimeout(finFraseTimer);
  if (!MONITOR) guardarRelleno();
  if (seg && siguiente && (siguiente.ver || 0) > (seg.ver || 0) && ahora() - cambioT >= (estado.lat_min || 0)) return empezarBloque();   // ya está el tema nuevo
  idx++;
  if (!seg || idx >= seg.frases.length) {
    if (MONITOR) return;
    if (!siguiente && relleno) { siguiente = relleno; relleno = null; }   // aún no está el tema nuevo: sigue el viejo
    if (siguiente) return empezarBloque();
    enPuente = true; pedirSiguiente(); return;
  }
  const f = seg.frases[idx];
  if (f.com) ponerCarta(f.com, (f.dur || 5) + 0.6, true);              // la voz contesta este comentario: sale en pantalla
  if (!MONITOR) fetch("/api/progreso", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: seg.id, frase: idx, dt: Math.round((ahora() - cambioT) * 10) / 10 }) }).catch(() => {});
  // ficha de inventario (arriba a la derecha)
  if (ficha) ficha.tOut = ahora();
  const fichaNueva = f.ficha ? { ...f.ficha, t0: ahora() + 0.3, tOut: null } : null;
  if (fichaNueva) setTimeout(() => { ficha = fichaNueva; }, ficha ? 380 : 0); else if (!ficha) ficha = null;
  // pegatina
  const actual = pegatinas.find(p => !p.tOut);
  if (!(f.peg && actual && actual.url === f.peg.url)) {
    pegatinas.forEach(p => { if (!p.tOut) p.tOut = ahora(); });
    if (f.peg) {
      if (!f.peg.estilo) f.peg.estilo = elegirEstilo(f.peg);
      let L = f.peg.estilo === "grande" ? { x: nLugar % 2 ? 0.76 : 0.24, y: 1.0, h: 0.92, grande: true } : LUGARES[nLugar % LUGARES.length];
      nLugar++;
      if ((f.ficha || estado.votacion) && L.x > 0.5) L = { ...L, x: 1 - L.x };   // no encima de la ficha ni de la votación
      if ((f.com || cartaVisible()) && L.x < 0.5) L = { ...L, x: 1 - L.x };          // ni encima del comentario del chat
      pegatinas.push({ url: f.peg.url, o: pegatinaLista(f.peg), L, t0: ahora(), tOut: null, rot: L.grande ? 0 : rnd(-6, 6), lado: L.x > 0.5 ? 1 : -1, fase: rnd(0, 6), nombre: (f.peg.nombre || "").toUpperCase() });
    }
  }
  if (f.rotulo) ponerAviso(seg.tema, f.rotulo, Math.max(3.2, (f.dur || 4) - 0.4));
  if (f.clip || f.yt) ponerClip(f.clip, f.yt);
  if (MONITOR) return;                                                  // el espejo no suena ni lleva el reloj
  // voz
  const dur = f.dur || 4;
  audio = f._audio || (f.audio ? new Audio(f.audio) : null);
  if (audio) {
    audio.onended = () => { clearTimeout(finFraseTimer); finFraseTimer = setTimeout(siguienteFrase, 250); };
    audio.play().catch(() => { clearTimeout(finFraseTimer); finFraseTimer = setTimeout(siguienteFrase, dur * 1000 + 250); });
    finFraseTimer = setTimeout(siguienteFrase, dur * 1000 + 2500);       // por si «ended» no llega
  } else finFraseTimer = setTimeout(siguienteFrase, dur * 1000 + 250);
  // pedir el bloque que sigue cuando quedan menos de ~9 s de este
  let resta = 0; for (let k = idx; k < seg.frases.length; k++) resta += (seg.frases[k].dur || 4) + 0.25;
  if (resta < 9) pedirSiguiente();
  setTimeout(() => { const c = clipSiguiente(); if (c && !clipPendiente && !vidFade) prepararClip(1 - vidCur, c); }, 1200);
}

// ---------------- música (OST del juego) con «ducking» bajo la voz ----------------
let ost = null, ostLista = [], ostI = 0, ostVol = 0;
async function arrancarOST() {
  try { ostLista = await (await fetch("/api/ost")).json(); } catch (e) { ostLista = []; }
  if (!ostLista.length) return;
  ost = new Audio(); ost.volume = 0;
  ost.onended = () => { ostI = (ostI + 1) % ostLista.length; ost.src = ostLista[ostI]; ost.play().catch(() => {}); };
  ost.src = ostLista[0]; ost.play().catch(() => {});
}

// ---------------- estado del control (votación, avisos del chat) ----------------
async function leerEstado() {
  try { estado = await (await fetch("/api/estado")).json(); } catch (e) {}
  if (verVisto !== null && (estado.tema_ver || 0) > verVisto) cambioT = ahora();
  if (estado.tema_ver !== undefined) verVisto = estado.tema_ver;
  // cambio de tema: lo precargado del tema viejo pasa a relleno (suena si el nuevo aún no está) y se pide ya el nuevo;
  // en cuanto llega, se salta a él en el próximo cambio de frase
  if (!MONITOR) {
    guardarRelleno();
    if (arrancado && seg && (seg.ver || 0) < (estado.tema_ver || 0) && !siguiente) pedirSiguiente();
  } else espejo();
  const cm = estado.com_mostrar;                      // comentario que enseña la IA o el panel
  if (cm && cm.id + cm.t !== cartaVista) { cartaVista = cm.id + cm.t; if (Date.now() / 1000 - cm.t < 30) cartaPend = cm; }
  if (!cm && carta && !carta.voz) quitarCarta();
  const an = estado.anuncio;
  if (an && an.t > anuncioVisto) {
    if (an.origen === "votación") ponerAviso("El chat eligió · en un momento", an.tema, 5, SANGRE);
    if (an.origen === "chat") ponerAviso("El chat lo pidió · en un momento", an.tema, 5, SANGRE);
    anuncioVisto = an.t;
  }
  setTimeout(leerEstado, MONITOR ? 600 : 1000);
}

// ---------------- dibujo ----------------
const vineta = (() => {

  const r = g.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 1.05);

})();

function dibujarVideo(v, alpha, t) {
  if (!v.videoWidth || alpha <= 0) return;
  const z = 1.03 + 0.02 * Math.sin(t * 0.07);
  const esc = Math.max(W / v.videoWidth, H / v.videoHeight) * z, w = v.videoWidth * esc, h = v.videoHeight * esc;
  ctx.globalAlpha = alpha; ctx.drawImage(v, (W - w) / 2, (H - h) / 2, w, h); ctx.globalAlpha = 1;
}

function dibujarPegatinas(t) {
  pegatinas = pegatinas.filter(p => !p.tOut || t - p.tOut < 0.45);
  for (const p of pegatinas) {
    if (!p.o.listo) continue;
    const c = p.o.can, L = p.L;
    const ent = pop(t - p.t0, 0.45), sal = p.tOut ? ease((t - p.tOut) / 0.35) : 0;
    let hh = H * L.h, ww = hh * c.width / c.height;
    if (ww > W * 0.46) { ww = W * 0.46; hh = ww * c.height / c.width; }

      const y = H - hh * ease((t - p.t0) / 0.7) + sal * hh * 0.6 + Math.sin(t * 0.8 + p.fase) * 4;
      const x = W * L.x - ww / 2;
      ctx.save(); ctx.globalAlpha = 1 - sal; ctx.shadowColor = "rgba(0,0,0,0.7)"; ctx.shadowBlur = 50;
      ctx.drawImage(c, x, Math.max(y, H - hh + 30), ww, hh); ctx.restore();
      if (p.nombre) {
        const a = ease((t - p.t0 - 0.5) / 0.4) * (1 - sal), al = L.x > 0.5 ? "right" : "left", nx = al === "right" ? x - 30 : x + ww + 30;
        const tw = Math.min(anchoTexto(p.nombre, 600, 58, 4), 600);
        dibujarHumo(al === "right" ? nx - tw - 40 : nx - 40, H * 0.62 - 60, tw + 80, 120, a, 0.7);
        texto(p.nombre, nx, H * 0.62, 600, 58, HUESO, al, a, 4, 600);
      }
      continue;
    }
    const s = 0.4 + 0.6 * ent, bob = Math.sin(t * 1.4 + p.fase) * 6;
    const cx = Math.min(Math.max(W * L.x, ww / 2 + 50), W - ww / 2 - 50);   // fotos anchas: que no se salgan del cuadro
    const x = cx + p.lado * sal * 240, y = H * L.y + bob;
    ctx.save();
    ctx.globalAlpha = Math.min(1, (t - p.t0) * 5) * (1 - sal);
    ctx.translate(x, y); ctx.rotate((p.rot + Math.sin(t * 0.9 + p.fase) * 1.0) * Math.PI / 180); ctx.scale(s, s);
    ctx.shadowColor = "rgba(0,0,0,0.55)"; ctx.shadowBlur = 24; ctx.shadowOffsetX = 6; ctx.shadowOffsetY = 12;
    ctx.drawImage(c, -ww / 2, -hh / 2, ww, hh);
    ctx.restore();
  }
}

function dibujarAviso(t) {

  const a = ease(dt / 0.5) * (1 - ease((dt - aviso.dur + 0.4) / 0.4)), cx = W / 2, y = 112;

// ficha de inventario (mg_tes.objeto): categoría gris, nombre, separador con rombo y el dato con negritas
function dibujarFicha(t) {
  if (!ficha) return;
  const dt = t - ficha.t0; if (dt < 0) return;
  const sal = ficha.tOut ? ease((t - ficha.tOut) / 0.35) : 0; if (sal >= 1) { ficha = null; return; }
  const a = ease(dt / 0.35) * (1 - sal), s = pop(dt, 0.45);
  const ancho = 720, cx = W * 0.76, cy = H * 0.36, lineas = partirNegritas(ficha.texto || "", 34, ancho - 90);
  const h = 190 + lineas.length * 46, y0 = cy - h / 2;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(0.85 + 0.15 * s, 0.85 + 0.15 * s); ctx.translate(-cx, -cy);
  dibujarHumo(cx - ancho / 2, y0, ancho, h, a, 0.85);
  if (ficha.arriba) texto(ficha.arriba.toUpperCase(), cx, y0 + 48, 400, 26, GRIS, "center", a, 4, ancho - 60);
  texto((ficha.nombre || "").toUpperCase(), cx, y0 + 92, 600, 50, HUESO, "center", a, 2, ancho - 60);
  separador(cx, y0 + 132, ancho * 0.36, a);
  lineas.forEach((l, i) => {
    const tot = l.reduce((s2, [w, b]) => s2 + anchoTexto(w, b ? 700 : 400, 34), 0);
    let x = cx - tot / 2; const y = y0 + 172 + i * 46;
    for (const [w, b] of l) { texto(w, x, y, b ? 700 : 400, 34, b ? HUESO : "rgb(214,208,192)", "left", a); x += anchoTexto(w, b ? 700 : 400, 34); }
  });
  ctx.restore();
}
function partirNegritas(s, px, ancho) {     // «texto con **negritas**» -> líneas de [palabra, negrita]
  const trozos = []; let negra = false;
  for (const parte of s.split("**")) {
    for (const w of parte.split(/\s+/).filter(Boolean)) {
      if (/^[,.;:!?)»]/.test(w) && trozos.length) trozos[trozos.length - 1][0] = trozos[trozos.length - 1][0].trimEnd();   // «Ysgramor**,» sin espacio
      trozos.push([w + " ", negra]);
    }
    negra = !negra;
  }
  const out = []; let linea = [], an = 0;
  for (const tr of trozos) { const w = anchoTexto(tr[0], tr[1] ? 700 : 400, px); if (an + w > ancho && linea.length) { out.push(linea); linea = []; an = 0; } linea.push(tr); an += w; }
  if (linea.length) out.push(linea); return out.slice(0, 4);
}

      ctx.fillStyle = "rgba(236,230,214,0.18)"; ctx.fillRect(x + 88, yy + 24, ancho - 150, 4);
      ctx.fillStyle = o === lider ? SANGRE : HUESO; ctx.fillRect(x + 88, yy + 24, (ancho - 150) * fr, 4);
    });
  }
}

// ---------------- espejo del panel ----------------
let espejoPidiendo = false;
async function espejo() {
  const a = estado.al_aire;
  if (!a || espejoPidiendo) return;
  if (!seg || seg.id !== a.id) {
    espejoPidiendo = true;
    try { const r = await fetch("/api/bloque/" + a.id); if (r.ok) { const b = await r.json(); precargar(b); seg = b; idx = -1; temaBar.txt !== b.tema && (temaBar = { txt: b.tema, t0: ahora() }); } }
    catch (e) {} finally { espejoPidiendo = false; }
    if (!seg || seg.id !== a.id) return;
  }
  if (a.idx >= 0 && a.idx !== idx) { idx = a.idx - 1; siguienteFrase(); }
}

// ---------------- comentarios del chat en pantalla (tarjeta tipo YouTube oscuro, como comentarios.tarjeta) ----------------
const ETI_COM = { pregunta: "PREGUNTA DEL CHAT", agradecimiento: "EL CHAT DICE", critica: "CRÍTICA DEL CHAT", pedido: "EL CHAT PIDE" };
function ponerCarta(c, dur, voz = false) {
  if (carta && carta.c.id === c.id) { carta.dur = Math.max(carta.dur, ahora() - carta.t0 + dur); carta.voz = carta.voz || voz; return; }
  if (carta) cartaSale = { ...carta, tOut: ahora() };
  carta = { c, t0: ahora(), dur, voz };
}
function quitarCarta() { if (carta) { cartaSale = { ...carta, tOut: ahora() }; carta = null; } }
function cartaVisible() { return !!carta && ahora() - carta.t0 < carta.dur; }
function colorAutor(n) { let h = 0; for (const ch of n) h = (h * 31 + ch.charCodeAt(0)) % 360; return `hsl(${h},45%,42%)`; }
function partirLineas(s, font, ancho, max) {
  ctx.save(); ctx.font = font;
  const out = []; let act = "";
  for (const w of s.split(/\s+/)) {
    const prueba = act ? act + " " + w : w;
    if (ctx.measureText(prueba).width > ancho && act) { out.push(act); act = w; } else act = prueba;
  }
  if (act) out.push(act);
  ctx.restore();
  if (out.length > max) { out.length = max; out[max - 1] = out[max - 1].replace(/[\s.,;]+$/, "") + "…"; }
  return out;
}
function tarjetaCom(c, x, y, ancho, a, k = 1) {          // k = escala (la fijada va más chica)
  const fT = `400 ${36 * k}px "Segoe UI", Roboto, sans-serif`, fN = `600 ${32 * k}px "Segoe UI", Roboto, sans-serif`;
  const av = 84 * k, pad = 30 * k, tx = x + pad + av + 24 * k, lin = partirLineas(c.texto || "", fT, ancho - (tx - x) - pad, k < 1 ? 2 : 4);
  const h = pad * 2 + 46 * k + lin.length * 48 * k;
  ctx.save(); ctx.globalAlpha = a;
  ctx.shadowColor = "rgba(0,0,0,0.6)"; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
  ctx.fillStyle = "rgba(15,15,15,0.9)"; ctx.beginPath(); ctx.roundRect(x, y, ancho, h, 26 * k); ctx.fill();
  ctx.shadowColor = "transparent"; ctx.strokeStyle = "rgba(255,255,255,0.16)"; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = colorAutor(c.autor || "?"); ctx.beginPath(); ctx.arc(x + pad + av / 2, y + pad + av / 2, av / 2, 0, 7); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.font = `600 ${42 * k}px "Segoe UI", sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText((c.autor || "?").replace(/^@/, "").charAt(0).toUpperCase(), x + pad + av / 2, y + pad + av / 2 + 2);
  ctx.textAlign = "left"; ctx.font = fN; ctx.fillStyle = "rgb(241,241,241)";
  const nombre = "@" + (c.autor || "").replace(/^@/, ""); ctx.fillText(nombre, tx, y + pad + 18 * k);
  ctx.font = `400 ${26 * k}px "Segoe UI", sans-serif`; ctx.fillStyle = "rgb(170,170,170)";
  ctx.fillText("en el chat · ahora", tx + ctx.measureText(nombre).width * (32 / 26) + 18 * k, y + pad + 20 * k);
  ctx.font = fT; ctx.fillStyle = "rgb(241,241,241)";
  lin.forEach((l, i) => ctx.fillText(l, tx, y + pad + 70 * k + i * 48 * k));
  ctx.restore();
  return h;
}
function dibujarCarta(o, t) {
  const dt = t - o.t0, sal = o.tOut ? ease((t - o.tOut) / 0.35) : 0;
  if (sal >= 1) return false;
  const a = ease(dt / 0.35) * (1 - sal), dx = (1 - pop(dt, 0.5)) * -120 - sal * 160;

function dibujarCartas(t) {

function dibujarPuente(t) {

function cuadro() {
  const t = ahora();

    texto("CONTROL DEL TELÉFONO · CÓDIGO", 64, H - 98, 500, 22, GRIS, "left", al, 4);

  requestAnimationFrame(cuadro);
}

// al llegar al máximo, la frase vieja se corta (fundido de 0,3 s) y entra lo nuevo
setInterval(() => {
  if (MONITOR || cortando || !seg || !siguiente || (siguiente.ver || 0) <= (seg.ver || 0)) return;
  if (ahora() - cambioT < Math.max(estado.lat_max || 8, estado.lat_min || 0)) return;
  cortando = true;
  const a = audio, v0 = a ? a.volume : 1;
  let k = 0;
  const paso = setInterval(() => {
    k++;
    if (a) a.volume = Math.max(0, v0 * (1 - k / 6));
    if (k >= 6) { clearInterval(paso); if (a) { a.onended = null; a.pause(); } cortando = false; siguienteFrase(); }
  }, 50);
}, 200);

async function arrancar() {
  if (arrancado) return; arrancado = true;
  document.getElementById("arranque").remove();
  try { await document.fonts.load(F(600, 40)); } catch (e) {}
  if (MONITOR) return;
  arrancarOST();
  enPuente = true;
  pedirSiguiente();
}
document.getElementById("arranque").addEventListener("click", arrancar);
if (new URLSearchParams(location.search).has("auto") || MONITOR) arrancar();
document.fonts.load(F(600, 40)).catch(() => {});
leerEstado();
requestAnimationFrame(cuadro);
</script>
