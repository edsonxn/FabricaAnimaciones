      <stop offset="0" stop-color="#1b1646"/><stop offset=".55" stop-color="#5a2a7a"/><stop offset="1" stop-color="#e0703a"/>
    </linearGradient>
    <radialGradient id="sol" cx=".5" cy=".5" r=".5">
