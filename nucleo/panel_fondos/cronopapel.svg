<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" preserveAspectRatio="xMaxYMid slice">
  <defs>
    <filter id="grano" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" result="r"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .35  0 0 0 0 .22  0 0 0 0 .1  0 0 0 .22 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="rasgado"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="3" seed="9" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="9"/></filter>
  </defs>
  <rect width="1200" height="300" fill="#d3b17f"/>
  <rect width="1200" height="300" fill="#fff" filter="url(#grano)"/>
  <!-- territorios pegados (con media luna de sombra) -->
  <g filter="url(#rasgado)">
    <path d="M520 70 L640 40 L720 90 L700 170 L590 200 L510 150Z" fill="#9a4a2f" opacity=".5" transform="translate(7 8)"/>
    <path d="M520 70 L640 40 L720 90 L700 170 L590 200 L510 150Z" fill="#c8623c"/>
    <path d="M700 60 L850 30 L960 80 L930 160 L790 190 L710 150Z" fill="#6d5230" opacity=".5" transform="translate(7 8)"/>
    <path d="M700 60 L850 30 L960 80 L930 160 L790 190 L710 150Z" fill="#e3b259"/>
    <path d="M900 120 L1040 80 L1170 120 L1150 230 L1010 260 L910 210Z" fill="#285a5a" opacity=".5" transform="translate(7 8)"/>
    <path d="M900 120 L1040 80 L1170 120 L1150 230 L1010 260 L910 210Z" fill="#3f8a85"/>
    <path d="M560 170 L700 190 L780 240 L740 290 L610 290 L540 240Z" fill="#6d5230" opacity=".45" transform="translate(7 8)"/>
    <path d="M560 170 L700 190 L780 240 L740 290 L610 290 L540 240Z" fill="#a9b36a"/>
    <path d="M800 190 L900 175 L960 220 L930 290 L830 290Z" fill="#8a3f3a" opacity=".4" transform="translate(6 7)"/>
    <path d="M800 190 L900 175 L960 220 L930 290 L830 290Z" fill="#d98c5f"/>
  </g>
  <!-- líneas de grano de acuarela / bordes de lápiz -->
  <g fill="none" stroke="#3a2a1a" stroke-opacity=".5" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 5">
    <path d="M520 70 L640 40 L720 90 L700 170 L590 200 L510 150Z"/><path d="M700 60 L850 30 L960 80 L930 160 L790 190 L710 150Z"/>
    <path d="M900 120 L1040 80 L1170 120 L1150 230 L1010 260 L910 210Z"/>
  </g>
  <!-- ruta punteada con X -->
  <path d="M560 235 C 620 150, 700 215, 770 130 S 900 70, 1050 160" fill="none" stroke="#7b1f1f" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 12"/>
  <g stroke="#7b1f1f" stroke-width="7" stroke-linecap="round"><line x1="1032" y1="142" x2="1068" y2="178"/><line x1="1068" y1="142" x2="1032" y2="178"/></g>
  <!-- pegatinas -->
  <g transform="translate(615 118) rotate(-12)"><rect x="-34" y="-24" width="68" height="48" rx="6" fill="#f7efdc" stroke="#d9c9a4" stroke-width="2"/><path d="M-18 14 L0 -12 L18 14Z" fill="#c8623c"/><circle cx="14" cy="-9" r="5" fill="#e3b259"/></g>
  <g transform="translate(850 105) rotate(9)"><circle r="26" fill="#f7efdc" stroke="#d9c9a4" stroke-width="2"/><path d="M0 -17 L5 -2 L0 17 L-5 -2Z" fill="#7b1f1f"/><path d="M-17 0 L-2 -5 L17 0 L-2 5Z" fill="#3a2a1a"/></g>
  <!-- sello circular rojo -->
  <g transform="translate(1105 62) rotate(-14)" fill="none" stroke="#a4262c" opacity=".85">
    <circle r="34" stroke-width="4"/><circle r="27" stroke-width="1.8"/>
    <text y="6" text-anchor="middle" font-family="Georgia,serif" font-size="17" font-weight="bold" fill="#a4262c" stroke="none">史</text>
  </g>
  <!-- cinta adhesiva -->
  <g opacity=".75"><rect x="500" y="30" width="86" height="26" fill="#f1e4a6" transform="rotate(-8 543 43)"/><rect x="1110" y="250" width="86" height="26" fill="#f1e4a6" transform="rotate(14 1153 263)"/></g>
</svg>
