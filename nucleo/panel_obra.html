<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La obra</title>
<!--
  «La obra» (19-nov-2026): vista de estrategia en tiempo real de lo que se está produciendo en la fábrica.
  Servida por nucleo/panel_v2.py en /v2/obra · datos de /api/v2/obra · arte en nucleo/obra/img · sonido en nucleo/obra/sonido.
  ?video=<v>  enfoca esa obra (pop-up de la ruleta «En producción» de la pestaña «Canales»)
  ?tele=1     tele (tablero de Puente TV): sin sonido, media resolución, menos aldeanos; window.__pausa(si) la detiene.
  Arte y sonidos ORIGINALES (Flow + ElevenLabs), «en el espíritu de» los RTS medievales de fines de los 90: nada copiado.
-->
<style>
:root{--madera:#4b2f16;--madera2:#2e1c0c;--oro:#ffd88a;--perg1:#ecdcae;--perg2:#d3b97e;--tinta:#2b1d0e}
html,body{margin:0;height:100%;overflow:hidden;background:#1d2a18;font-family:Georgia,"Palatino Linotype","Book Antiqua",serif;color:var(--tinta);-webkit-user-select:none;user-select:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#c.arr{cursor:grabbing}
.tele #c{cursor:none}
.perg{background:linear-gradient(var(--perg1),var(--perg2));border:2px solid #5a3b1a;border-radius:4px;
  box-shadow:inset 0 0 0 2px rgba(255,248,220,.55),inset 0 0 14px rgba(90,59,26,.45),0 3px 12px rgba(0,0,0,.5)}
#barra{position:absolute;left:0;right:0;top:0;height:40px;display:flex;align-items:center;gap:16px;padding:0 12px;
  background:linear-gradient(#5a391b,var(--madera2));border-bottom:3px solid #a57c3a;color:#f3e2b5;font-size:15px;
  box-shadow:0 2px 10px rgba(0,0,0,.55);white-space:nowrap;overflow:hidden}
#barra .r{display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
#barra .r img{height:26px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
#barra .r b{color:#fff3cf;min-width:2ch}
#barra .r small{color:#d9c08a;font-size:12px}
#barra .sep{width:1px;height:24px;background:rgba(255,220,150,.25)}
#barra .tit{margin-left:auto;letter-spacing:.08em;font-variant:small-caps;color:var(--oro);font-size:17px;text-shadow:0 1px 2px #000}
#son{background:linear-gradient(#7a5226,#4b2f16);border:1px solid #c59a52;color:#fff;border-radius:4px;font-size:16px;
  width:34px;height:28px;cursor:pointer;padding:0}
#mini{position:absolute;left:10px;bottom:10px;width:236px;height:135px;padding:4px}
#mini canvas{width:100%;height:100%;display:block;cursor:crosshair;image-rendering:auto}
#info{position:absolute;left:262px;bottom:10px;max-width:660px;right:10px;min-height:70px;padding:8px 14px 8px 8px;display:flex;gap:12px;align-items:center}
#info img{width:124px;height:70px;object-fit:cover;border:2px solid #5a3b1a;background:#2a1a0c;flex:none}
#info .tx{min-width:0;flex:1}
#info h2{margin:0 0 2px;font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#info .sub{font-size:13px;color:#4a3418;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
#info .sub i{width:10px;height:10px;border-radius:2px;display:inline-block;border:1px solid rgba(0,0,0,.4)}
#info .pb{height:11px;margin:5px 0 3px;background:#3b2a14;border:1px solid #1d1208;border-radius:2px;overflow:hidden}
#info .pb i{display:block;height:100%;background:linear-gradient(#8ef06a,#2f9a1e);transition:width .8s}
#info .sale{font-size:12.5px;color:#4a3418}
#info .late{color:#a3201a;font-weight:700}
#toca{position:absolute;top:52px;left:50%;transform:translateX(-50%);padding:6px 16px;cursor:pointer;display:none;font-size:14px}
#carga{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#1d2a18;color:var(--oro);font-size:20px;letter-spacing:.05em;transition:opacity .6s}
#carga.fuera{opacity:0;pointer-events:none}
#aviso{position:absolute;top:50px;right:12px;padding:4px 10px;font-size:12px;display:none}
.tele #son,.tele #toca{display:none}
.enmarco #barra{padding-right:52px}
.tele #barra{font-size:17px;height:44px}
.tele #info h2{font-size:19px}
@media(max-width:700px){#mini{display:none}#info{left:10px}#barra .r small,#barra .opc{display:none}}
</style>

<body>
<canvas id="c"></canvas>
<div id="barra">
  <span class="r" title="Madera entregada"><img src="/v2/obra/img/madera.png" alt=""><b id="nMadera">0</b><small>madera</small></span>
  <span class="r" title="Silicio entregado"><img src="/v2/obra/img/silicio.png" alt=""><b id="nSilicio">0</b><small>silicio</small></span>

  <span class="r" title="Rollos de película entregados"><img src="/v2/obra/img/pelicula.png" alt=""><b id="nPelicula">0</b><small>película</small></span>

  <span class="r opc" title="Videos en producción">🏗️ <b id="nObras">0</b><small>obras</small></span>

  <button id="son" title="Sonido">🔊</button>
</div>
<div id="mini" class="perg"><canvas id="mc" width="228" height="127"></canvas></div>
<div id="info" class="perg"><img id="iImg" alt=""><div class="tx"><h2 id="iTit">…</h2><div class="sub" id="iSub"></div>
  <div class="pb"><i id="iPb" style="width:0"></i></div><div class="sale" id="iSale"></div></div></div>

<div id="aviso" class="perg">La fábrica no contesta</div>
<div id="carga">Levantando la obra…</div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search), TELE = Q.get('tele') === '1', FOCO = Q.get('video') || '';
if (TELE) document.documentElement.classList.add('tele');
if (window.parent !== window && !TELE) document.documentElement.classList.add('enmarco');   // dentro del pop-up: la ✕ va arriba a la derecha
const MW = 3200, MH = 1800;                                     // el mundo, en px «de pantalla» (los sprites vienen al doble)
const R = TELE ? 0.5 : Math.min(1.5, window.devicePixelRatio || 1);
const COL = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#4a3aa7', '#e34948'];
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
const cv = $('c'), ctx = cv.getContext('2d');
let VW = 1, VH = 1, ZB = 1;
function tam() {
  VW = innerWidth; VH = innerHeight; ZB = clamp(Math.min(VW / 1300, VH / 760), 0.55, 1.7);
  cv.width = Math.max(1, Math.round(VW * R)); cv.height = Math.max(1, Math.round(VH * R));
}
addEventListener('resize', tam); tam();
function rnd(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const azar = Math.random;
function hash(s) { let h = 2166136261; for (const ch of s) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; }
function oscuro(hex, f) { const n = parseInt(hex.slice(1), 16); const r = (n >> 16) * f | 0, g = (n >> 8 & 255) * f | 0, b = (n & 255) * f | 0; return `rgb(${r},${g},${b})`; }

// ================================================================ arte
const NOMBRES = ['cimientos', 'armazon', 'taller', 'madera', 'silicio', 'componentes', 'pelicula', 'roca', 'piedras', 'arbusto',
  'arbusto_flor', 'tocon', 'barril', 'cajas', 'carretilla', 'costal', 'cerca', 'roble', 'pino', 'abedul', 'castano', 'pino_chico', 'arce'];
const ARBOLES = ['roble', 'pino', 'abedul', 'castano', 'pino_chico', 'arce'];
const IMG = {};
const cargaImg = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
async function cargarArte() {
  await Promise.all([...NOMBRES.map(n => cargaImg('/v2/obra/img/' + n + '.png').then(i => { IMG[n] = i; })),
    cargaImg('/v2/obra/img/pasto.jpg').then(i => { IMG.pasto = i; }), cargaImg('/v2/obra/img/tierra.jpg').then(i => { IMG.tierra = i; })]);
  for (const n of NOMBRES) {
    const i = IMG[n]; if (!i) continue;
    i._k = 0.5;                                                 // px en pantalla por px del archivo (vienen al doble)
    if (TELE) {                                                 // en la tele, sprites ya reducidos: el GPU del Chromecast no los achica cada cuadro
      const f = 0.65, c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(i.width * 0.5 * f)); c.height = Math.max(1, Math.round(i.height * 0.5 * f));
      c.getContext('2d').drawImage(i, 0, 0, c.width, c.height); c._k = 1 / f; IMG[n] = c;
    }
  }
}
function spr(c, n, x, y, s = 1, ax = 0.5, ay = 1) {
  const i = IMG[n]; if (!i) return;
  const w = i.width * i._k * s, h = i.height * i._k * s;
  c.drawImage(i, x - w * ax, y - h * ay, w, h);
}
const ancho = (n, s = 1) => IMG[n] ? IMG[n].width * IMG[n]._k * s : 0;
const alto = (n, s = 1) => IMG[n] ? IMG[n].height * IMG[n]._k * s : 0;
function sombra(c, x, y, rx, ry, a = 0.24) { c.fillStyle = `rgba(0,0,0,${a})`; c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, TAU); c.fill(); }

// ================================================================ sonido (WebAudio; nunca en la tele)
let AC = null, MASTER = null, SON = true, VOCES = 0, ULT_SON = 0;
const BUF = {};
const SONIDOS = ['martillo_1', 'martillo_2', 'martillo_3', 'hacha_1', 'hacha_2', 'pico_1', 'pico_2', 'deposito_1', 'deposito_2', 'sierra', 'listo', 'ambiente'];
try { SON = localStorage.getItem('obra_son') !== '0'; } catch (e) {}
function audioIniciar() {
  if (TELE || AC) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; return; }
  MASTER = AC.createGain(); MASTER.gain.value = SON ? 1 : 0; MASTER.connect(AC.destination);
  for (const n of SONIDOS) fetch('/v2/obra/sonido/' + n + '.mp3').then(r => r.ok ? r.arrayBuffer() : Promise.reject())
    .then(b => AC.decodeAudioData(b)).then(b => { BUF[n] = b; if (n === 'ambiente') ambiente(); }).catch(() => {});
  AC.onstatechange = botonesSon;
  botonesSon();
}
function ambiente() {
  const b = BUF.ambiente; if (!b || !AC) return;
  const s = AC.createBufferSource(), g = AC.createGain(); s.buffer = b; s.loop = true; g.gain.value = 0.35;
  s.connect(g).connect(MASTER); s.start();
}
function sonar(n, x, y, vol = 1, minimo = 0) {
  if (!AC || !SON || pausado || AC.state !== 'running') return;
  const b = BUF[n]; if (!b) return;
  const ahora = performance.now(); if (ahora - ULT_SON < 45 || VOCES > 9) return;
  const hw = VW / (2 * cam.z), d = Math.hypot(x - cam.x, (y - cam.y) * 1.4);
  let g = vol * Math.max(minimo, 1 - d / (hw * 1.5)) * clamp(cam.z / ZB, 0.35, 1);
  if (g < 0.04) return;
  ULT_SON = ahora; VOCES++;
  const s = AC.createBufferSource(), ga = AC.createGain(); s.buffer = b; s.playbackRate.value = 0.93 + azar() * 0.14; ga.gain.value = g;
  let nodo = s.connect(ga);
  if (AC.createStereoPanner) { const p = AC.createStereoPanner(); p.pan.value = clamp((x - cam.x) / hw, -1, 1) * 0.75; nodo = nodo.connect(p); }
  nodo.connect(MASTER); s.onended = () => { VOCES--; }; s.start();
}
function botonesSon() {
  $('son').textContent = SON ? '🔊' : '🔇';
  $('toca').style.display = !TELE && SON && AC && AC.state !== 'running' && !pausado ? 'block' : 'none';
}
$('son').onclick = e => {
  e.stopPropagation(); SON = !SON; try { localStorage.setItem('obra_son', SON ? '1' : '0'); } catch (er) {}
  if (MASTER) MASTER.gain.value = SON ? 1 : 0; if (SON && AC) AC.resume(); botonesSon();
};
const despertar = () => { if (AC && SON && AC.state !== 'running' && !pausado) AC.resume().then(botonesSon, () => {}); };
addEventListener('pointerdown', despertar, true); addEventListener('keydown', despertar, true);
$('toca').onclick = despertar;
addEventListener('keydown', e => { if (e.key === 'Escape' && window.parent !== window) window.parent.postMessage('obra:cerrar', location.origin); });

// ================================================================ mundo
const POS = {0: [[1600, 950]], 1: [[1600, 950]], 2: [[1150, 900], [2100, 1000]], 3: [[1000, 1000], [1700, 800], [2350, 1100]]};
const POS_MAS = [[1000, 1000], [1700, 800], [2350, 1100], [1380, 1400], [2050, 1430], [2800, 1020]];
const REC = {
  madera: {x: 470, y: 900, n: 'Madera', herr: 'hacha', son: 'hacha'},
  silicio: {x: 1500, y: 330, n: 'Silicio', herr: 'pico', son: 'pico'},
  componentes: {x: 2750, y: 600, n: 'Componentes', herr: 'mano'},
  pelicula: {x: 2600, y: 1500, n: 'Película', herr: 'mano'},
};
const RECS = Object.keys(REC);
const DEP = {madera: -115, silicio: -40, componentes: 40, pelicula: 115};   // dónde descarga cada recurso, frente a la obra
const BOSQUE = {x: 330, y: 880, r: 250};                         // el bosque de los leñadores (árboles que se dibujan cada cuadro)
const LIBRE_POS = [[700, 1500], [1300, 1600], [1950, 1630], [3010, 1260], [880, 430], [2240, 420]];
const ETAPAS = ['cimientos', 'armazon', 'taller'], ESCALA = [0.72, 0.9, 1];
let DATOS = null, OBRAS = [], ALD = [], ESCENA = [], ARB = [], LIBRES = [], PART = [], CAMINOS = [], LETREROS = [];
let SUELO = null, MINIBASE = null, CLAVE = '';
const ENT = {madera: 0, silicio: 0, componentes: 0, pelicula: 0};
const etapaDe = p => p < 0.3 ? 0 : p < 0.7 ? 1 : 2;

function curva(a, b, c, n = 26) {
  const p = [];
  for (let i = 0; i <= n; i++) { const t = i / n, u = 1 - t; p.push([u * u * a[0] + 2 * u * t * b[0] + t * t * c[0], u * u * a[1] + 2 * u * t * b[1] + t * t * c[1]]); }
  const acc = [0]; for (let i = 1; i < p.length; i++) acc.push(acc[i - 1] + Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]));
  return {p, acc, L: acc[acc.length - 1]};
}
function enCurva(r, s) {
  s = clamp(s, 0, r.L); let i = 1; while (i < r.acc.length - 1 && r.acc[i] < s) i++;
  const t = (s - r.acc[i - 1]) / Math.max(1e-6, r.acc[i] - r.acc[i - 1]), a = r.p[i - 1], b = r.p[i];
  return [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];
}
function control(a, c, k) {                                       // punto de control de la curva obra → recurso
  const mx = (a[0] + c[0]) / 2, my = (a[1] + c[1]) / 2, dx = c[0] - a[0], dy = c[1] - a[1], L = Math.hypot(dx, dy) || 1;
  return [mx - dy / L * L * 0.13 * k, my + dx / L * L * 0.13 * k];
}

function construir() {
  const obras = DATOS.obras.slice(0, 6);
  if (FOCO && !obras.some(o => o.video === FOCO)) { const f = DATOS.obras.find(o => o.video === FOCO); if (f) obras[obras.length - 1] = f; }
  const pos = obras.length <= 3 ? POS[obras.length] : POS_MAS;
  const viejas = Object.fromEntries(OBRAS.map(o => [o.video, o]));
  OBRAS = (obras.length ? obras : [null]).map((d, i) => {
    const v = d ? viejas[d.video] : null;
    const o = {d, video: d ? d.video : '', x: pos[i][0], y: pos[i][1], prog: d ? d.progreso : 1, sin: !d,
      col: d ? COL[d.color % 8] : '#8a6a3a', vist: d ? d.vistazos || [] : [], vi: 0, vt: 2 + i * 1.3, prev: null, cache: {},
      ent: v ? v.ent : {madera: 0, silicio: 0, componentes: 0, pelicula: 0}};
    o.etapa = etapaDe(o.prog);
    return o;
  });
  const rr = rnd(hash(CLAVE) || 7);
  ESCENA = []; ARB = []; CAMINOS = []; LETREROS = [];
  // caminos de tierra de cada obra a cada recurso
  OBRAS.forEach((o, oi) => RECS.forEach((r, ri) => {
    const a = [o.x + DEP[r], o.y + 58], c = [REC[r].x + (r === 'madera' ? 150 : 0), REC[r].y + (r === 'madera' ? 40 : 60)];
    CAMINOS.push({o: oi, r, a, b: control(a, c, (ri % 2 ? 1 : -1) * (oi % 2 ? -1 : 1)), c, curva: null});
  }));
  for (const k of CAMINOS) k.curva = curva(k.a, k.b, k.c);
  // edificios y su utilería
  for (const o of OBRAS) {
    ESCENA.push({x: o.x, y: o.y - 30, dib: t => dibObra(o, t)});
    for (const r of RECS) ESCENA.push({x: o.x + DEP[r], y: o.y + 80, dib: () => { const n = o.ent[r]; if (n > 0) { sombra(ctx, o.x + DEP[r] + 4, o.y + 80, 20, 6, .2); spr(ctx, r, o.x + DEP[r], o.y + 84, 0.2 + Math.min(0.14, n * 0.006)); } }});
    const ad = [['cajas', 222, 30, .8], ['barril', 248, 62, .8], ['carretilla', -238, 44, .75], ['costal', -205, 78, .9], ['cerca', -300, -40, .9], ['cerca', -262, -60, .9], ['barril', 210, -70, .7], ['piedras', 160, 95, .9]];
    for (const [n, dx, dy, s] of ad) ESCENA.push(cosa(n, o.x + dx, o.y + dy, s));
    if (o.sin) LETREROS.push({x: o.x + 250, y: o.y + 70, txt: ['Sin obras', 'ningún video en producción']});
  }
  for (const L of LETREROS) ESCENA.push({x: L.x, y: L.y, dib: () => dibLetrero(L)});
  // recursos
  ESCENA.push(cosa('silicio', REC.silicio.x, REC.silicio.y, 1), cosa('silicio', REC.silicio.x - 95, REC.silicio.y - 30, .6), cosa('roca', REC.silicio.x + 105, REC.silicio.y - 25, .9),
    cosa('piedras', REC.silicio.x - 40, REC.silicio.y + 50, 1), cosa('roca', REC.silicio.x - 150, REC.silicio.y + 20, .6));
  ESCENA.push(cosa('componentes', REC.componentes.x, REC.componentes.y, 1), cosa('cajas', REC.componentes.x + 100, REC.componentes.y - 10, .9),
    cosa('barril', REC.componentes.x - 95, REC.componentes.y - 20, .9), cosa('costal', REC.componentes.x + 70, REC.componentes.y + 40, .9));
  ESCENA.push(cosa('pelicula', REC.pelicula.x, REC.pelicula.y, 1), cosa('cajas', REC.pelicula.x + 95, REC.pelicula.y - 15, .8), cosa('barril', REC.pelicula.x - 85, REC.pelicula.y + 10, .8));
  ESCENA.push(cosa('madera', 620, 965, .8), cosa('tocon', 560, 1040, .55), cosa('tocon', 690, 880, .45), cosa('carretilla', 700, 1000, .7));
  // el bosque de los leñadores
  const rb = rnd(99);
  for (let k = 0; k < 60 && ARB.length < 17; k++) {
    const a = rb() * TAU, d = Math.sqrt(rb()) * BOSQUE.r, x = BOSQUE.x + Math.cos(a) * d * 1.15, y = BOSQUE.y + Math.sin(a) * d * 0.95;
    if (ARB.some(t => Math.hypot(t.x - x, (t.y - y) * 1.6) < 85) || Math.hypot(x - 620, y - 965) < 90) continue;
    const n = ['roble', 'pino', 'castano', 'abedul', 'arce', 'pino'][rb() * 6 | 0];
    const t = {x, y, n, s: 0.85 + rb() * 0.25, sac: 0, dib(tt) { dibArbol(ctx, this, tt); }};
    ARB.push(t); ESCENA.push(t);
  }
  const tala = ARB.filter(t => t.x > BOSQUE.x - 40).sort((a, b) => b.x - a.x).slice(0, 4);
  REC.madera.tala = tala.length ? tala : ARB.slice(0, 2);
  // huecos por llenar: uno por canal, los más cercanos
  const vistos = new Set(); LIBRES = [];
  for (const h of DATOS.libres || []) {
    if (vistos.has(h.canal) || LIBRES.length >= (TELE ? 4 : 6)) continue; vistos.add(h.canal);
    const [x, y] = LIBRE_POS[LIBRES.length], L = {x, y, d: h, col: COL[h.color % 8], logo: null};
    if (h.logo) cargaImg(h.logo).then(i => { L.logo = i; });
    LIBRES.push(L); ESCENA.push({x, y: y + 12, dib: () => dibLibre(L)});
  }
  // aldeanos
  ALD = [];
  const n = OBRAS.length, por = TELE ? Math.max(3, Math.floor(10 / n)) : Math.max(5, Math.min(8, Math.floor(36 / n)));
  OBRAS.forEach((o, oi) => {

  c.textAlign = 'left'; c.fillStyle = '#7a1a10'; c.font = 'bold 12px Georgia'; c.fillText(L.d.atrasado ? 'ATRASADO' : 'POR LLENAR', bx + 50, by + 17);

// ================================================================ cámara (recorrido de RTS + manual)
const cam = {x: 1600, y: 900, z: 0.9, vx: 0, vy: 0, vz: 0};

function obraFoco() { return OBRAS.find(o => o.video === FOCO) || null; }

  if (toma.t === 'obra') return {x: toma.o.x, y: toma.o.y - (toma.o.etapa === 2 ? 170 : 140), z: 1.1 * ZB};
  if (toma.t === 'ald') return {x: toma.a.x, y: toma.a.y - 25, z: 1.6 * ZB};

// ================================================================ HUD
let infoClave = '', hudT = 0, miniT = 0;
function obraInfo() {
  if (toma && toma.t === 'obra') return toma.o;

  let mejor = obraFoco() || OBRAS[0], dm = 1e9;

  return dm < 900 / cam.z ? mejor : obraFoco() || mejor;
}

  $('nObras').textContent = DATOS.obras.length; $('nAld').textContent = ALD.length; $('nLibres').textContent = (DATOS.libres || []).length;

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, ch => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[ch]));

// ================================================================ bucle
let raf = 0, tPrev = 0, pausado = false, oculto = false;

  }

function dibujar(t) {

// ================================================================ datos
async function cargarDatos() {

    if (primera) {

      o.d = n; o.prog = n.progreso; o.etapa = e;

}
(async () => {
  audioIniciar();
  await cargarArte();
  while (!(await cargarDatos())) { $('carga').textContent = 'La fábrica no contesta… reintentando'; await new Promise(r => setTimeout(r, 4000)); }
  $('carga').classList.add('fuera');

  setInterval(cargarDatos, TELE ? 60000 : 30000);
})();
