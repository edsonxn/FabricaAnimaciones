<!--
  «La obra» (19-nov-2026): vista de estrategia en tiempo real de lo que se está produciendo en la fábrica.
  Servida por nucleo/panel_v2.py en /v2/obra · datos de /api/v2/obra · arte en nucleo/obra/img · sonido en nucleo/obra/sonido.
  ?video=<v>  enfoca esa obra (pop-up de la ruleta «En producción» de la pestaña «Canales»)
  ?tele=1     tele (tablero de Puente TV): sin sonido, media resolución, menos aldeanos; window.__pausa(si) la detiene.
  &menu=1     con ?tele=1: menú de la app de la tele (OK): proyectos, recursos del proyecto, cámara a mano, silenciar.
  &son=1      con ?tele=1: con sonido (la app de la tele; el tablero va sin él).
  &res=N      con ?tele=1: resolución del lienzo (0.5 por omisión; la app «La obra» de la tele pide más). Teclas: flechas, +/−, Enter (window.obraTecla).
  Arte y sonidos ORIGINALES (Flow + ElevenLabs), «en el espíritu de» los RTS medievales de fines de los 90: nada copiado.
-->
<style>

<script>
'use strict';
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search), TELE = Q.get('tele') === '1', FOCO = Q.get('video') || '';
if (TELE) document.documentElement.classList.add('tele');
if (window.parent !== window && !TELE) document.documentElement.classList.add('enmarco');   // dentro del pop-up: la ✕ va arriba a la derecha
const MW = 3200, MH = 1800;                                     // el mundo, en px «de pantalla» (los sprites vienen al doble)
// ?tele=1&res=N: resolución del lienzo en la tele (0.5 = tablero; la app «La obra» pide más, se ve nítido; 19-nov-2026)
const RT = TELE ? Math.min(2, Math.max(0.5, parseFloat(Q.get('res')) || 0.5)) : 1, RED = 0.65 * RT / 0.5;   // RED: reducción previa de sprites
const R = TELE ? RT : Math.min(1.5, window.devicePixelRatio || 1);
const COL = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#4a3aa7', '#e34948'];
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
const cv = $('c'), ctx = cv.getContext('2d');
let VW = 1, VH = 1, ZB = 1;
function tam() {
  VW = innerWidth; VH = innerHeight; ZB = clamp(Math.min(VW / 1300, VH / 760), 0.55, 1.7);
  cv.width = Math.max(1, Math.round(VW * R)); cv.height = Math.max(1, Math.round(VH * R));
}
addEventListener('resize', tam); tam();
function rnd(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const azar = Math.random;
function hash(s) { let h = 2166136261; for (const ch of s) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; }
function oscuro(hex, f) { const n = parseInt(hex.slice(1), 16); const r = (n >> 16) * f | 0, g = (n >> 8 & 255) * f | 0, b = (n & 255) * f | 0; return `rgb(${r},${g},${b})`; }

// ================================================================ arte
const NOMBRES = ['cimientos', 'armazon', 'taller', 'madera', 'silicio', 'componentes', 'pelicula', 'roca', 'piedras', 'arbusto',
  'arbusto_flor', 'tocon', 'barril', 'cajas', 'carretilla', 'costal', 'cerca', 'roble', 'pino', 'abedul', 'castano', 'pino_chico', 'arce'];
const ARBOLES = ['roble', 'pino', 'abedul', 'castano', 'pino_chico', 'arce'];
const IMG = {};
const cargaImg = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
async function cargarArte() {
  await Promise.all([...NOMBRES.map(n => cargaImg('/v2/obra/img/' + n + '.png').then(i => { IMG[n] = i; })),
    cargaImg('/v2/obra/img/pasto.jpg').then(i => { IMG.pasto = i; }), cargaImg('/v2/obra/img/tierra.jpg').then(i => { IMG.tierra = i; })]);
  for (const n of NOMBRES) {
    const i = IMG[n]; if (!i) continue;
    i._k = 0.5;                                                 // px en pantalla por px del archivo (vienen al doble)
    if (TELE && RED < 1) {                                      // en la tele, sprites ya reducidos: el GPU del Chromecast no los achica cada cuadro
      const f = RED, c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(i.width * 0.5 * f)); c.height = Math.max(1, Math.round(i.height * 0.5 * f));
      c.getContext('2d').drawImage(i, 0, 0, c.width, c.height); c._k = 1 / f; IMG[n] = c;
    }
  }
}
function spr(c, n, x, y, s = 1, ax = 0.5, ay = 1) {
  const i = IMG[n]; if (!i) return;
  const w = i.width * i._k * s, h = i.height * i._k * s;
  c.drawImage(i, x - w * ax, y - h * ay, w, h);
}
const ancho = (n, s = 1) => IMG[n] ? IMG[n].width * IMG[n]._k * s : 0;
const alto = (n, s = 1) => IMG[n] ? IMG[n].height * IMG[n]._k * s : 0;
function sombra(c, x, y, rx, ry, a = 0.24) { c.fillStyle = `rgba(0,0,0,${a})`; c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, TAU); c.fill(); }

// ================================================================ sonido (WebAudio; en la tele solo con &son=1: la app «La obra», 19-nov-2026)
let AC = null, MASTER = null, SON = true, VOCES = 0, ULT_SON = 0;
const BUF = {};
const SONIDOS = ['martillo_1', 'martillo_2', 'martillo_3', 'hacha_1', 'hacha_2', 'pico_1', 'pico_2', 'deposito_1', 'deposito_2', 'sierra', 'listo', 'ambiente'];
try { SON = localStorage.getItem('obra_son') !== '0'; } catch (e) {}
function audioIniciar() {
  if ((TELE && Q.get('son') !== '1') || AC) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; return; }
  MASTER = AC.createGain(); MASTER.gain.value = SON ? 1 : 0; MASTER.connect(AC.destination);
  for (const n of SONIDOS) fetch('/v2/obra/sonido/' + n + '.mp3').then(r => r.ok ? r.arrayBuffer() : Promise.reject())
    .then(b => AC.decodeAudioData(b)).then(b => { BUF[n] = b; if (n === 'ambiente') ambiente(); }).catch(() => {});
  AC.onstatechange = botonesSon;
  botonesSon();
}
function ambiente() {
  const b = BUF.ambiente; if (!b || !AC) return;
  const s = AC.createBufferSource(), g = AC.createGain(); s.buffer = b; s.loop = true; g.gain.value = 0.35;
  s.connect(g).connect(MASTER); s.start();
}
function sonar(n, x, y, vol = 1, minimo = 0) {
  if (!AC || !SON || pausado || AC.state !== 'running') return;
  const b = BUF[n]; if (!b) return;
  const ahora = performance.now(); if (ahora - ULT_SON < 45 || VOCES > 9) return;
  const hw = VW / (2 * cam.z), d = Math.hypot(x - cam.x, (y - cam.y) * 1.4);
  let g = vol * Math.max(minimo, 1 - d / (hw * 1.5)) * clamp(cam.z / ZB, 0.35, 1);
  if (g < 0.04) return;
  ULT_SON = ahora; VOCES++;
  const s = AC.createBufferSource(), ga = AC.createGain(); s.buffer = b; s.playbackRate.value = 0.93 + azar() * 0.14; ga.gain.value = g;
  let nodo = s.connect(ga);
  if (AC.createStereoPanner) { const p = AC.createStereoPanner(); p.pan.value = clamp((x - cam.x) / hw, -1, 1) * 0.75; nodo = nodo.connect(p); }
  nodo.connect(MASTER); s.onended = () => { VOCES--; }; s.start();
}
function botonesSon() {
  $('son').textContent = SON ? '🔊' : '🔇';
  $('toca').style.display = !TELE && SON && AC && AC.state !== 'running' && !pausado ? 'block' : 'none';
}
$('son').onclick = e => {
  e.stopPropagation(); SON = !SON; try { localStorage.setItem('obra_son', SON ? '1' : '0'); } catch (er) {}
  if (MASTER) MASTER.gain.value = SON ? 1 : 0; if (SON && AC) AC.resume(); botonesSon();
};
const despertar = () => { if (AC && SON && AC.state !== 'running' && !pausado) AC.resume().then(botonesSon, () => {}); };
addEventListener('pointerdown', despertar, true); addEventListener('keydown', despertar, true);
$('toca').onclick = despertar;
// pantalla completa (la vista se abre en pestaña nueva desde «Canales»; el usuario, 19-nov-2026)
function pantallaCompleta() {
  try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (e) {}
}
$('pc').onclick = e => { e.stopPropagation(); pantallaCompleta(); };
addEventListener('keydown', e => { if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey && !e.altKey) pantallaCompleta(); });
document.addEventListener('fullscreenchange', () => { $('pc').textContent = document.fullscreenElement ? '🗗' : '⛶'; });
addEventListener('keydown', e => { if (e.key === 'Escape' && window.parent !== window) window.parent.postMessage('obra:cerrar', location.origin); });

// ================================================================ mundo
const POS = {0: [[1600, 950]], 1: [[1600, 950]], 2: [[1150, 900], [2100, 1000]], 3: [[1000, 1000], [1700, 800], [2350, 1100]]};
const POS_MAS = [[1000, 1000], [1700, 800], [2350, 1100], [1380, 1400], [2050, 1430], [2800, 1020]];
const REC = {
  madera: {x: 470, y: 900, n: 'Madera', herr: 'hacha', son: 'hacha'},
  silicio: {x: 1500, y: 330, n: 'Silicio', herr: 'pico', son: 'pico'},
  componentes: {x: 2750, y: 600, n: 'Componentes', herr: 'mano'},
  pelicula: {x: 2600, y: 1500, n: 'Película', herr: 'mano'},
};
const RECS = Object.keys(REC);
const DEP = {madera: -115, silicio: -40, componentes: 40, pelicula: 115};   // dónde descarga cada recurso, frente a la obra
// Materiales REALES del video (de /api/v2/obra → obras[i].materiales, sacados de las etapas; el usuario, 19-nov-2026):
// cada uno se consigue en un sitio del mapa y se apila frente a la obra; la pila crece con lo que de verdad lleva hecho.
const DEPM = {guion: -195, musica: -108, voz: -22, clips: 64, efectos: 150};
const SITIO_N = {madera: 'Bosque', silicio: 'Mina', componentes: 'Taller de piezas', pelicula: 'Carreta de película'};
const BOSQUE = {x: 330, y: 880, r: 250};                         // el bosque de los leñadores (árboles que se dibujan cada cuadro)
const LIBRE_POS = [[700, 1500], [1300, 1600], [1950, 1630], [3010, 1260], [880, 430], [2240, 420]];
const ETAPAS = ['cimientos', 'armazon', 'taller'], ESCALA = [0.72, 0.9, 1];
let DATOS = null, OBRAS = [], ALD = [], ESCENA = [], ARB = [], LIBRES = [], PART = [], CAMINOS = [], LETREROS = [];
let SUELO = null, MINIBASE = null, CLAVE = '', QUITADOS = 0;
const FLOT = [];                                                 // «+12 Voz» que sube sobre la pila al llegar material real
const etapaDe = p => p < 0.3 ? 0 : p < 0.7 ? 1 : 2;

function medir(p) {
  const acc = [0]; for (let i = 1; i < p.length; i++) acc.push(acc[i - 1] + Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]));
  return {p, acc, L: acc[acc.length - 1]};
}
function curva(a, b, c, n = 26) {
  const p = [];
  for (let i = 0; i <= n; i++) { const t = i / n, u = 1 - t; p.push([u * u * a[0] + 2 * u * t * b[0] + t * t * c[0], u * u * a[1] + 2 * u * t * b[1] + t * t * c[1]]); }
  return medir(p);
}
// ---- capas (19-nov-2026, «aldeanos que caminan sobre árboles o detrás de los cimientos»): nadie cruza la planta de un
// edificio. La planta es un rombo (medido de la silueta de armazon/taller); una ruta que la cruzaría la rodea por un costado.
const HUE = {rx: 228, ry: 92, dy: -62};
const enHuella = (o, x, y, m = 1) => Math.abs(x - o.x) / (HUE.rx * m) + Math.abs(y - o.y - HUE.dy) / (HUE.ry * m) < 1;
function ruta(o, b, ini, fin, prof = 0) {                       // o: la obra de donde sale; rodea la suya y cualquier otra
  const d = curva(ini, b, fin);
  if (prof > 4) return d;
  let X = null, i0 = -1;
  for (let i = 0; i < d.p.length && !X; i++) { X = OBRAS.find(q => enHuella(q, d.p[i][0], d.p[i][1], 1.1)); i0 = i; }
  if (!X) return d;
  const mid = (a, c) => [(a[0] + c[0]) / 2, (a[1] + c[1]) / 2];
  let w, b1, b2;
  if (X === o) {                                                 // la propia: sale por el frente y sube por un costado, tras las pilas
    w = [X.x + (fin[0] >= X.x ? 340 : -340), X.y + 30];
    b1 = [(ini[0] + w[0]) / 2, Math.max(ini[1], w[1]) + 12]; b2 = [w[0], fin[1]];
  } else {                                                       // otra: pasa por delante (frente a sus pilas) o por detrás
    let i1 = i0; while (i1 + 1 < d.p.length && enHuella(X, d.p[i1 + 1][0], d.p[i1 + 1][1], 1.1)) i1++;
    w = (d.p[i0][1] + d.p[i1][1]) / 2 > X.y + HUE.dy ? [X.x, X.y + 140] : [X.x, X.y - 215];
    b1 = mid(ini, w); b2 = mid(w, fin);
  }
  const r1 = ruta(o, b1, ini, w, prof + 1), r2 = ruta(o, b2, w, fin, prof + 1);
  return medir(r1.p.concat(r2.p.slice(1)));
}
// PASO: rejilla con todos los puntos por donde puede caminar un aldeano (rutas a los sitios y vuelta de los constructores).
// Sirve para decidir qué árbol o cosa del suelo se dibuja ordenada con ellos y cuál estorba (se quita).
const PC = 64;
let PASO = new Map();
function pasoPon(x, y) { const k = (Math.floor(y / PC) + 20) * 400 + Math.floor(x / PC) + 20; let v = PASO.get(k); if (!v) PASO.set(k, v = []); v.push(x, y); }
function pasoHay(x0, x1, y0, y1) {                               // ¿alguien pasa por este rectángulo?
  for (let cy = Math.floor(y0 / PC); cy <= Math.floor(y1 / PC); cy++) for (let cx = Math.floor(x0 / PC); cx <= Math.floor(x1 / PC); cx++) {
    const v = PASO.get((cy + 20) * 400 + cx + 20); if (!v) continue;
    for (let i = 0; i < v.length; i += 2) if (v[i] > x0 && v[i] < x1 && v[i + 1] > y0 && v[i + 1] < y1) return true;
  }
  return false;
}
function sitiosTrabajo(r) {                                      // dónde se para a trabajar quien va a ese sitio (nuevoViaje)
  if (r === 'madera') return REC.madera.tala.map(tr => [tr.x + 33, tr.y + 7]);
  const R0 = REC[r], rad = r === 'silicio' ? 88 : 80, out = [];
  for (let i = 0; i <= 6; i++) { const ang = (0.15 + 0.7 * i / 6) * Math.PI; out.push([R0.x + Math.cos(ang) * rad, R0.y + 18 + Math.sin(ang) * 34]); }
  return out;
}
function trazarPaso() {
  PASO = new Map();
  const dxs = [...new Set([...Object.values(DEPM), ...Object.values(DEP)])];
  OBRAS.forEach((o, oi) => {
    for (const r of RECS) {

  if (tv.grande) {                                               // en grande: ◀ ▶ el anterior / siguiente de la pestaña
    if (n === 'izq' || n === 'der') { tv.sel = (tv.sel + (n === 'der' ? 1 : -1) + N) % N; const it = c.items[tv.sel]; if (it.t === 'a') { cerrarGrande(); tocar(it); } else verGrande(it); }
    else if (n === 'ok') cerrarGrande();
    return true;
  }
  if (tv.enTabs) {
    if (n === 'izq' || n === 'der') { tv.ci = (tv.ci + (n === 'der' ? 1 : -1) + tv.cats.length) % tv.cats.length; tv.sel = 0; }
    else if (n === 'aba' || n === 'ok') tv.enTabs = false;
  } else if (n === 'arr' && tv.sel < cols) tv.enTabs = true;
  else if (n === 'arr') tv.sel -= cols;
  else if (n === 'aba') tv.sel = Math.min(N - 1, tv.sel + cols);
  else if (n === 'izq') tv.sel = Math.max(0, tv.sel - 1);
  else if (n === 'der') tv.sel = Math.min(N - 1, tv.sel + 1);
  else if (n === 'ok') { const it = c.items[tv.sel]; if (it.t === 'a') tocar(it); else verGrande(it); }
  pintaVisor(); return true;
}
function menuTecla(n) {
  if (n === 'silencio') { ponSon(!SON); pista(SON ? 'Con sonido' : 'Silenciado', 2500); return true; }
  if (tmModo === 'visor') return teclaVisor(n);
  if (tmModo === 'menu') {
    if (n === 'arr' || n === 'aba') moverMenu(n === 'aba' ? 1 : -1);
    else if (n === 'ok' || n === 'der') { const it = tmItems[tmSel]; cerrarMenu(); it.f(); }
    else if (n === 'atras' || n === 'izq') cerrarMenu();
    return true;
  }
  if (tmModo === 'libre') {
    if (n === 'ok' || n === 'atras') { tmModo = 'mapa'; manualHasta = performance.now() + 4000; pista('Listo', 1500); return true; }
    return camTecla(n);
  }
  // mapa
  if (n === 'ok') { abrirMenu(); return true; }
  if (n === 'izq' || n === 'der') {
    const ps = proyectos(); if (!ps.length) return true;
    let i = ps.findIndex(o => o.video === seguirV);
    if (i < 0) i = Math.max(0, ps.indexOf(obraInfo())); else i = (i + (n === 'der' ? 1 : -1) + ps.length) % ps.length;
    seguir(ps[i]); return true;
  }
  if (n === 'arr' || n === 'aba') {                               // acercar / alejar sobre lo que se ve
    const base = mano || {x: cam.x, y: cam.y, z: cam.z};
    mano = {x: base.x, y: base.y, z: clamp(base.z * (n === 'arr' ? 1.25 : 0.8), zmin(), 2.4 * ZB)};
    if (!seguirV) manualHasta = performance.now() + 30000;
    return true;
  }
  if (n === 'mas' || n === 'menos') return camTecla(n);
  if (n === 'atras') { if (seguirV) { recorrido(); return true; } return false; }   // false: la app se cierra
  return false;
}
if (MENU) {
  const st = document.createElement('style'); st.textContent = MENU_CSS; document.head.appendChild(st);
  for (const [id, cls] of [['tm', 'perg'], ['tv', ''], ['tl', ''], ['tpista', 'perg']]) { const d = document.createElement('div'); d.id = id; if (cls) d.className = cls; document.body.appendChild(d); }
  setTimeout(() => pista('OK: menú · ◀ ▶ proyectos · ▲ ▼ acercar', 9000), 2500);
}
(async () => {
  audioIniciar();
  await cargarArte();
  while (!(await cargarDatos())) { $('carga').textContent = 'La fábrica no contesta… reintentando'; await new Promise(r => setTimeout(r, 4000)); }
  $('carga').classList.add('fuera'); setTimeout(() => { $('carga').style.display = 'none'; }, 900);
  hud(); minimapa(); pausar();
  setInterval(cargarDatos, 20000);                               // = caché del servidor (obra_datos, 20 s): el material sale a tiempo
})();
