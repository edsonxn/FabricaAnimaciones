<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lienzo · Fábrica de Animaciones</title>
<meta name="ui-version" content="v2-lienzo">
<script>try{const t=localStorage.getItem("t");if(t)document.documentElement.dataset.tema=t;}catch(e){}</script>
<style>
/* Panel v2 «Lienzo» (21-oct-2026). Backend: nucleo/panel_v2.py. Misma clave de tema que el panel clásico (localStorage.t). */
:root{
  --bg:#eceef4; --dot:rgba(28,34,58,.16); --panel:#ffffff; --panel2:#f3f4f8; --hover:#f6f7fb; --line:#dfe2ea; --line2:#c9cedb;
  --txt:#161a24; --mut:#626a82; --faint:#9aa0b4; --cristal:rgba(255,255,255,.86);
  --acc:#6b4dff; --ok:#14a06c; --run:#2f6bff; --warn:#d9771a; --bad:#d9435b;
  --sombra:0 1px 2px rgba(20,24,40,.06),0 6px 20px rgba(20,24,40,.07);
  --sombra2:0 2px 8px rgba(20,24,40,.12),0 22px 56px rgba(20,24,40,.18);
  --top:56px; --lado:290px; --insp:390px;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root:not([data-tema="claro"]){
  --bg:#0b0d13; --dot:rgba(255,255,255,.085); --panel:#151821; --panel2:#1c202b; --hover:#22262f; --line:#272c39; --line2:#363c4d;
  --txt:#e9ebf3; --mut:#8d93a8; --faint:#5f6579; --cristal:rgba(21,24,33,.86);
  --acc:#8b74ff; --ok:#3ecf8e; --run:#5b93ff; --warn:#ffa94d; --bad:#ff6b81;
  --sombra:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); --sombra2:0 2px 10px rgba(0,0,0,.5),0 26px 64px rgba(0,0,0,.6);
}}
:root[data-tema="oscuro"]{
  --bg:#0b0d13; --dot:rgba(255,255,255,.085); --panel:#151821; --panel2:#1c202b; --hover:#22262f; --line:#272c39; --line2:#363c4d;
  --txt:#e9ebf3; --mut:#8d93a8; --faint:#5f6579; --cristal:rgba(21,24,33,.86);
  --acc:#8b74ff; --ok:#3ecf8e; --run:#5b93ff; --warn:#ffa94d; --bad:#ff6b81;
  --sombra:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); --sombra2:0 2px 10px rgba(0,0,0,.5),0 26px 64px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--txt);font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}
button{font:inherit;color:inherit}
code{font:12px/1.3 ui-monospace,"Cascadia Mono",Consolas,monospace}
.k{color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;font-weight:650}

/* ---------- barra superior: sistema en vivo */
#barra{position:fixed;inset:0 0 auto 0;height:var(--top);display:flex;align-items:center;gap:8px;padding:0 10px;
  background:var(--cristal);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);z-index:40}
.marca{display:flex;align-items:center;gap:9px;font-weight:700;white-space:nowrap;flex:none;font-size:14.5px}
.logo{width:26px;height:26px;border-radius:8px;background:conic-gradient(from 210deg,var(--acc),#ff5fa8,#ffb35c,#47d1a8,var(--acc));box-shadow:inset 0 0 0 5px var(--panel)}
.marca small{display:block;font-weight:500;color:var(--mut);font-size:11px;line-height:1.1}
#met{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding:4px 2px}
#met::-webkit-scrollbar{display:none}
.m{display:flex;align-items:center;gap:7px;height:38px;padding:0 10px;border:1px solid var(--line);border-radius:11px;background:var(--panel);
  white-space:nowrap;font-size:12.5px;flex:none}
.m b{font-variant-numeric:tabular-nums;font-weight:650}
.m .sub{color:var(--mut);font-variant-numeric:tabular-nums}
.m.btn{cursor:pointer}.m.btn:hover{border-color:var(--line2);background:var(--hover)}
.m.mal b.v{color:var(--bad)}.m.ojo b.v{color:var(--warn)}
.spark{width:48px;height:22px;display:block}
.spark polyline{fill:none;stroke-width:1.6;vector-effect:non-scaling-stroke}
.spark path{stroke:none;opacity:.16}
.barrita{width:34px;height:5px;border-radius:9px;background:var(--panel2);overflow:hidden;display:inline-block;vertical-align:middle}
.barrita i{display:block;height:100%;border-radius:9px;background:var(--run)}
.disco{display:inline-flex;align-items:center;gap:5px}
.disco+.disco{margin-left:6px;padding-left:8px;border-left:1px solid var(--line)}
.pulso{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulso 2s infinite;flex:none}
.pulso.off{background:var(--bad);animation:none}
@keyframes pulso{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
.acciones{display:flex;gap:6px;flex:none}
.bt{height:38px;padding:0 12px;border-radius:11px;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px;text-decoration:none;color:var(--txt)}
.bt:hover{background:var(--hover);border-color:var(--line2)}
.bt.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
.bt.ico{width:38px;padding:0;justify-content:center}
.bt .cuenta{min-width:18px;height:18px;border-radius:9px;background:var(--acc);color:#fff;font-size:11px;display:inline-grid;place-items:center;padding:0 5px}

/* ---------- popovers */
.pop{position:fixed;top:calc(var(--top) + 6px);z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sombra2);
  max-height:calc(100vh - var(--top) - 24px);overflow:auto;display:none;padding:14px;width:min(560px,calc(100vw - 24px))}
.pop.on{display:block}
.pop h3{margin:0 0 10px;font-size:14px}
.pop h3 small{color:var(--mut);font-weight:400;margin-left:6px}
.tabla{width:100%;border-collapse:collapse;font-size:12.5px}
.tabla th{text-align:left;font-weight:600;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:4px 6px;border-bottom:1px solid var(--line)}
.tabla td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.tabla td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tabla tr.hijo td{color:var(--mut);font-size:12px;padding-top:3px;padding-bottom:3px}
.tabla tr.trabajo{cursor:pointer}.tabla tr.trabajo:hover td{background:var(--hover)}
.nucleos{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;margin:4px 0 14px;height:42px;align-items:end}
.nucleos i{display:block;background:var(--run);border-radius:3px 3px 1px 1px;min-height:2px}
.vid-link{color:var(--acc);cursor:pointer;text-decoration:underline dotted}
.av{display:grid;grid-template-columns:48px 1fr auto auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.av .hora{color:var(--mut);font-variant-numeric:tabular-nums}
.est{font-size:11.5px;color:var(--mut)}
.est.error{color:var(--bad)}
.mini{height:28px;padding:0 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:12.5px}
.mini:hover{border-color:var(--line2)}
.fila-voz{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
select.mini{padding:0 6px}

/* ---------- barra lateral: proyectos */
#lado{position:fixed;top:var(--top);left:0;bottom:0;width:var(--lado);background:var(--panel);border-right:1px solid var(--line);z-index:30;
  display:flex;flex-direction:column;transition:transform .18s ease}
body.sin-lado #lado{transform:translateX(-100%)}
.lado-cab{padding:12px 12px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
#q{width:100%;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);padding:0 11px;font:inherit;color:var(--txt)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:12.5px;color:var(--mut)}
.chips button.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
.sel-f{height:32px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font:inherit;font-size:12.5px;padding:0 6px;width:100%}
.sel-f.on{border-color:var(--txt)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kpis div{background:var(--panel2);border-radius:9px;padding:6px 8px}
.kpis b{display:block;font-size:18px;line-height:1.1}
#lista{flex:1;overflow:auto;padding:6px}
.fila{display:grid;grid-template-columns:8px 1fr 44px;gap:9px;align-items:center;width:100%;text-align:left;border:0;background:none;border-radius:10px;padding:8px;cursor:pointer}
.fila:hover{background:var(--hover)}
.fila.sel{background:color-mix(in srgb,var(--acc) 14%,transparent)}
.fila>i{width:8px;height:30px;border-radius:4px}
.fila b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila small{display:block;color:var(--mut);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .fp{height:5px;border-radius:9px;background:var(--panel2);overflow:hidden}
.fila .fp i{display:block;height:100%;background:var(--ok)}
.fila.corre .fp i{background:var(--run)}
.fila.corre small{color:var(--run)}
.lado-pie{padding:8px 12px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}
.vacio{padding:18px;color:var(--mut);font-size:13px;text-align:center}

/* ---------- lienzo */
#vista{position:fixed;top:var(--top);left:var(--lado);right:0;bottom:0;overflow:hidden;background-color:var(--bg);
  background-image:radial-gradient(circle,var(--dot) 1.1px,transparent 1.4px);cursor:grab;touch-action:none;transition:left .18s ease}
body.sin-lado #vista{left:0}
/* arrastrar el lienzo nunca selecciona texto (el usuario, 21-oct): para copiar, el inspector y el visor (fuera del lienzo) */
#vista{-webkit-user-select:none;user-select:none}
#vista.arrastrando{cursor:grabbing}
#vista.arrastrando *{pointer-events:none}
/* will-change SOLO mientras te mueves: con él fijo, Chrome rasteriza el lienzo una vez y al hacer zoom estira esa imagen
   (texto borroso, el usuario 21-oct). Al detenerse (~160 ms) se quita y el navegador vuelve a dibujar nítido a la escala real. */
#mundo{position:absolute;left:0;top:0;transform-origin:0 0}
#mundo.moviendo{will-change:transform}
.banda{position:absolute;z-index:0;border-radius:28px;background:color-mix(in srgb,var(--cc) 6%,transparent);border:1px solid color-mix(in srgb,var(--cc) 22%,transparent)}
.etq-carril{position:absolute;z-index:2;width:max-content;transform-origin:0 100%;display:flex;align-items:center;gap:10px;height:44px;padding:0 16px 0 8px;border-radius:14px;
  background:var(--panel);border:1px solid var(--line);box-shadow:var(--sombra);white-space:nowrap;pointer-events:auto;cursor:pointer}
.etq-carril .fondo{width:34px;height:34px;border-radius:10px;background:var(--cc) center/cover no-repeat;flex:none}
.etq-carril b{font-size:17px}
.etq-carril span{color:var(--mut);font-size:13px}

/* tableros (un video por tablero) */
.tab{position:absolute;z-index:1;width:340px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sombra);cursor:default}
.tab::before{content:"";position:absolute;left:18px;right:18px;top:-1px;height:3px;border-radius:0 0 3px 3px;background:var(--cc)}
.tab.sel{box-shadow:0 0 0 2px var(--acc),var(--sombra2)}
.tab.corre{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--run) 70%,transparent),0 0 34px color-mix(in srgb,var(--run) 22%,transparent),var(--sombra)}
/* proceso en marcha (el usuario, 21-oct): borde que gira alrededor de la tarjeta + insignia arriba con la etapa. El grosor y la
   insignia crecen al alejar (--inv = 1/zoom), así se ve desde lejos. */
@property --giro{syntax:"<angle>";initial-value:0deg;inherits:false}
.tab.corre::after{content:"";position:absolute;--g:calc(3px * min(max(var(--inv,1),1),6));inset:calc(-1 * var(--g) - 3px);padding:var(--g);
  border-radius:calc(21px + var(--g));pointer-events:none;animation:giro 2.6s linear infinite;
  background:conic-gradient(from var(--giro),var(--run),color-mix(in srgb,var(--run) 10%,transparent) 110deg,var(--acc) 180deg,color-mix(in srgb,var(--run) 10%,transparent) 290deg,var(--run));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
@keyframes giro{to{--giro:360deg}}
.insignia{position:absolute;left:16px;top:-13px;z-index:3;display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 11px 0 9px;border-radius:999px;
  background:var(--run);color:#fff;font-size:11.5px;font-weight:700;letter-spacing:.3px;white-space:nowrap;pointer-events:none;
  box-shadow:0 4px 14px color-mix(in srgb,var(--run) 45%,transparent);transform-origin:0 100%;transform:scale(min(max(calc(var(--inv,1) * .7),1),4))}
.insignia i{width:7px;height:7px;border-radius:50%;background:#fff;flex:none;animation:punto 1.1s ease-in-out infinite}
@keyframes punto{50%{opacity:.25;transform:scale(.55)}}
.tab.abierto{width:max-content;min-width:720px}
.tab.atenuado{opacity:.22}
.tab-sup{order:0}
.tab-cuerpo{order:2}
.tab-pie{order:3;display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px 14px}
.tab.abierto .tab-pie{order:1;padding:2px 18px 10px}
.tab-cab{display:flex;gap:10px;align-items:flex-start;padding:15px 14px 8px;cursor:pointer}
.tg{flex:none;height:34px;padding:0 11px 0 9px;border-radius:10px;border:0;background:var(--acc);color:#fff;font-size:16px;line-height:1;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 10px color-mix(in srgb,var(--acc) 40%,transparent)}
.tg span{font-size:13px;font-weight:650}
.tg:hover{filter:brightness(1.15)}
.tg.ab{background:var(--txt);color:var(--bg);box-shadow:none}
.tab.abierto .tg{height:38px;padding:0 14px 0 12px}
.tab.abierto .tab-cab{padding:18px 18px 8px}
.tab-tit{flex:1;min-width:0}
.tab-tit b{display:block;font-size:15px;line-height:1.25;font-weight:650;overflow-wrap:anywhere}
.tab.abierto .tab-tit b{font-size:20px}
.tab-tit small{display:flex;flex-wrap:wrap;gap:3px 9px;color:var(--mut);font-size:11.5px;margin-top:5px}
.tab-tit .cc{color:var(--cc);font-weight:650}
.tab-tit .pub{color:var(--ok);font-weight:600}
.tab-tit .err{color:var(--bad)}
.anillo{width:42px;height:42px;position:relative;flex:none}
.anillo svg{transform:rotate(-90deg)}
.anillo circle{fill:none;stroke-width:6}
.anillo .f{stroke:var(--panel2)}.anillo .v{stroke:var(--ok);stroke-linecap:round}
.anillo.run .v{stroke:var(--run)}
.anillo b{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700}
.etapas{display:flex;gap:2px;padding:0 14px 10px}
.tab.abierto .etapas{padding:0 18px 10px;gap:4px}
.etapas i{flex:1;height:6px;border-radius:3px;background:var(--panel2)}
.tab.abierto .etapas i{height:22px;border-radius:6px;font-style:normal;font-size:10.5px;display:grid;place-items:center;color:var(--mut);white-space:nowrap;overflow:hidden;padding:0 3px}
.etapas i.listo{background:color-mix(in srgb,var(--ok) 75%,var(--panel2))}
.tab.abierto .etapas i.listo{color:#fff}
.etapas i.parcial{background:color-mix(in srgb,var(--ok) 35%,var(--panel2))}
.etapas i.en_curso{background:var(--run);animation:latido 1.4s ease-in-out infinite}
.tab.abierto .etapas i.en_curso{color:#fff}
.etapas i.atencion{background:var(--warn)}
.etapas i.omitido{background:transparent;border:1px dashed var(--line2)}
@keyframes latido{50%{opacity:.55}}
.vivo{margin:0 14px 10px;padding:8px 10px;border-radius:11px;background:color-mix(in srgb,var(--run) 11%,var(--panel));font-size:12.5px;line-height:1.35}
.tab.abierto .vivo{margin:0 18px 10px}
.vivo b{color:var(--run)}
.pb{height:4px;border-radius:9px;background:color-mix(in srgb,var(--run) 18%,transparent);overflow:hidden;margin-top:6px}
.pb i{display:block;height:100%;background:var(--run);border-radius:9px;transition:width .6s}
.bp{height:30px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:12.5px;display:inline-flex;align-items:center;gap:5px}
.bp:hover{border-color:var(--line2);background:var(--hover)}
.bp small{color:var(--mut)}
.bp.prim{background:var(--txt);color:var(--bg);border-color:var(--txt)}
.portada{position:relative;margin:0 14px;border-radius:12px;overflow:hidden;aspect-ratio:16/9;background:var(--panel2);cursor:pointer}
.portada img,.portada video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.portada.vert img,.portada.vert video{object-fit:contain}
.portada .nada{display:grid;place-items:center;height:100%;color:var(--faint);font-size:12px}
.play{position:absolute;left:10px;bottom:10px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(10,12,20,.72);color:#fff;font-size:15px;cursor:pointer;
  display:grid;place-items:center;backdrop-filter:blur(4px)}
.play:hover{background:var(--acc)}
.portada .etq{position:absolute;inset:auto 0 0 0;padding:28px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.82));color:#fff;font-weight:700;line-height:1.15;display:none;
  font-size:calc(13px * min(max(var(--inv,1) * .42, 1), 3.4))}
.desc-est{padding:10px 14px 0;font-size:12.5px;color:var(--mut);margin:0}
.desc-est b{color:var(--txt)}

/* contenido de un tablero abierto: columnas = etapas del pipeline */
.cols{display:flex;gap:64px;padding:8px 18px 22px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:14px;flex:none;position:relative}
.col>h4{position:relative;margin:0;display:flex;align-items:center;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);height:30px;white-space:nowrap}
.col>h4 em{font-style:normal;text-transform:none;letter-spacing:0;color:var(--faint);font-weight:400}
.col>h4 .num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--txt);color:var(--bg);font-size:11.5px;font-weight:700;flex:none}
.col:not(:last-child)>h4::after{content:"";position:absolute;left:calc(100% + 10px);width:44px;top:50%;border-top:2px dashed var(--line2)}
.col:not(:last-child)>h4::before{content:"";position:absolute;left:calc(100% + 50px);top:calc(50% - 5px);border:5px solid transparent;border-left:7px solid var(--line2)}
.cargando{padding:30px 18px;color:var(--mut)}
.nodo{background:var(--panel2);border:1px solid var(--line);border-radius:13px;overflow:hidden;position:relative}
.n-cab{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;font-size:12.5px;font-weight:650;border-bottom:1px solid var(--line);background:var(--panel)}
.n-cab span{color:var(--mut);font-weight:400;white-space:nowrap}
.n-cab small{color:var(--mut);font-weight:400}
.n-cab{align-items:center}
.n-cab .nn{flex:1;min-width:0;color:var(--txt);font-weight:650;overflow:hidden;text-overflow:ellipsis}
.n-cab[data-plegar],.col>h4[data-plegar]{cursor:pointer}
.pl{width:22px;height:22px;flex:none;border-radius:6px;border:1px solid var(--line2);background:var(--panel2);color:var(--txt);font-size:11px;line-height:1;
  cursor:pointer;display:inline-grid;place-items:center;padding:0}
.pl:hover{background:var(--acc);color:#fff;border-color:var(--acc)}
.nodo.plegado>:not(.n-cab){display:none}
.nodo.plegado>.n-cab{border-bottom:0}
.col.plegada>.nodo{display:none}
.col.plegada>h4{color:var(--faint)}
.scroll{overflow:auto;overscroll-behavior:contain}
.sel-n{outline:2px solid var(--acc);outline-offset:1px}
/* guion */
.n-guion{width:390px}
.n-guion .scroll{max-height:560px;padding:4px 0}
.esc{padding:6px 12px 8px;border-bottom:1px dashed var(--line)}
.esc:last-child{border-bottom:0}
.esc-cab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin:4px 0}
.esc-cab b{color:var(--txt);font-weight:650}
.fr{display:grid;grid-template-columns:24px 1fr;gap:6px;margin:3px 0;font-size:13px;line-height:1.4;border-radius:7px;padding:2px 4px 2px 0}
.fr.sonando{background:color-mix(in srgb,var(--acc) 14%,transparent)}
.mp{width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);background:var(--panel);cursor:pointer;font-size:9.5px;display:grid;place-items:center;padding:0;margin-top:1px}
.mp:hover{background:var(--acc);color:#fff;border-color:var(--acc)}
.mp.no{border-style:dashed;color:var(--faint);cursor:default;background:none}
.sonando>.mp,.sonando .mp{background:var(--acc);color:#fff;border-color:var(--acc)}
.cargando-audio .mp{animation:latido .8s infinite}
.act{color:var(--acc);font-size:11.5px;font-weight:600}
/* texto (ESTADO.md) */
.n-texto{width:390px}
.n-texto .scroll{max-height:380px;padding:6px 14px 12px;font-size:12.5px}
.md h3,.md h4,.md h5,.md h6{margin:10px 0 4px;font-size:13px}
.md p{margin:4px 0}
.md ul{margin:4px 0;padding-left:18px}
.md .tr{display:flex;gap:8px;border-bottom:1px solid var(--line);padding:3px 0;font-size:12px}
.md .tr span{flex:1;min-width:0}
.md code{background:var(--panel);padding:0 3px;border-radius:4px}
/* rejillas de imágenes y clips */
.rejilla{display:grid;grid-template-columns:repeat(4,124px);gap:6px;padding:8px}
.rejilla.r2{grid-template-columns:repeat(2,250px)}
.t{margin:0;position:relative;width:124px;height:70px;border-radius:8px;overflow:hidden;background:var(--panel);cursor:pointer;outline-offset:1px}
.r2 .t{width:250px;height:141px}
.t img,.t video{width:100%;height:100%;object-fit:cover;display:block}
.t.png img{object-fit:contain;background:repeating-conic-gradient(var(--panel2) 0 25%,var(--panel) 0 50%) 0 0/14px 14px}
.t .badge{position:absolute;right:4px;bottom:4px;font-size:9px;background:rgba(0,0,0,.65);color:#fff;border-radius:4px;padding:1px 5px}
.t.aud{display:grid;place-items:center;color:var(--mut);font-size:20px}
.t:hover{outline:2px solid var(--line2)}
.t.sel-n{outline:2px solid var(--acc)}
.mas{display:block;width:calc(100% - 16px);margin:0 8px 8px;height:30px;border-radius:8px;border:1px dashed var(--line2);background:none;cursor:pointer;color:var(--mut);font-size:12.5px}
.mas:hover{color:var(--txt);border-color:var(--txt)}
.nota{padding:0 10px 8px;color:var(--mut);font-size:11.5px}
/* pistas de audio y archivos */
.n-audio{width:330px}
.pistas{max-height:420px;overflow:auto;overscroll-behavior:contain;padding:4px}
.pista{display:grid;grid-template-columns:26px 1fr auto;gap:2px 8px;align-items:center;padding:6px 7px;border-radius:9px;cursor:pointer;font-size:12.5px}
.pista:hover{background:var(--hover)}
.pista .pn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pista .pd{color:var(--mut);font-size:11.5px;font-variant-numeric:tabular-nums}
.pista .pp{grid-column:2/4;height:3px;border-radius:3px;background:var(--line);overflow:hidden;display:none}
.pista .pp i{display:block;height:100%;width:0;background:var(--acc)}
.pista.sonando .pp,.pista.pausado .pp{display:block}
.pista .doc{width:22px;text-align:center}
/* entrega */
.n-video{width:520px}
.pantalla{position:relative;aspect-ratio:16/9;background:#000;cursor:pointer}
.pantalla.vert{aspect-ratio:9/16;width:260px;margin:0 auto}
.pantalla img,.pantalla video{width:100%;height:100%;object-fit:contain;display:block}
.gran-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:68px;height:68px;border-radius:50%;border:0;background:rgba(10,12,20,.7);color:#fff;font-size:24px;cursor:pointer;backdrop-filter:blur(4px)}
.gran-play:hover{background:var(--acc)}
.n-pie{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;font-size:12.5px;background:var(--panel)}
.n-pie span{color:var(--mut)}
.n-yt{width:520px}
.yt{padding:10px 12px;font-size:12.5px}
.yt>b{display:block;font-size:14px;margin-bottom:4px}
.yt .alt{color:var(--mut);font-size:12px;margin:0 0 6px}
.yt p{margin:6px 0;white-space:pre-line;color:var(--mut)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tags span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11.5px}
/* nivel de detalle según el zoom (el usuario, 21-oct: «de lejos se ve raro: menos texto, más visual»). Tres niveles:
   cerca (≥ 70 %) todo · medio (40-70 %, .medio) sin letra menuda ni botones salvo ⤢ · lejos (< 40 %, .lejos) solo lo visual:
   portadas, miniaturas, etapas en color, el borde azul de lo que corre y el canal; las secciones de texto se vuelven un bloque
   con icono. En medio y lejos el título sale al pasar el ratón (#tip) y solo lo que está EN MARCHA lleva encima su pastilla de
   avance (#etiquetas, a tamaño fijo de pantalla). */
#etiquetas{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden;display:none}
#vista.medio #etiquetas{display:block}
.eq{position:absolute;left:0;top:0;display:flex;align-items:center;gap:7px;height:30px;padding:0 10px 0 4px;border-radius:9px;
  background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-left:4px solid var(--cc);box-shadow:var(--sombra);
  color:var(--txt);font-size:13px;font-weight:650;white-space:nowrap;will-change:transform}
.eq b{overflow:hidden;text-overflow:ellipsis;min-width:0}
.eq.corre{border-color:var(--run);box-shadow:0 0 0 1.5px var(--run),0 6px 20px color-mix(in srgb,var(--run) 35%,transparent)}
.eq .pt{width:8px;height:8px;border-radius:50%;background:var(--run);flex:none;animation:punto 1.1s ease-in-out infinite}
/* en marcha: la pastilla lleva el avance (barra gruesa + etapa · % · hora de término) y se ve también de lejos */
.eq.corre{height:auto;align-items:flex-start;padding:6px 11px 8px 5px;min-width:250px}
.eq-c{min-width:0;flex:1;display:flex;flex-direction:column;gap:5px}
.eq-c b{overflow:hidden;text-overflow:ellipsis}
.eq-pb{height:8px;border-radius:5px;background:color-mix(in srgb,var(--run) 20%,transparent);overflow:hidden}
.eq-pb i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--run),var(--acc));transition:width .8s}
.eq-st{display:flex;align-items:center;gap:6px;color:var(--run);font-size:12.5px;font-weight:750;letter-spacing:.2px}
#vista.lejos .eq.corre{font-size:14px;padding:8px 12px 9px 6px;min-width:280px}
#vista.lejos .eq-pb{height:10px}
#vista.medio .insignia{display:none}
#tip{position:absolute;left:0;top:0;z-index:6;pointer-events:none;display:none;max-width:340px;padding:8px 11px;border-radius:11px;background:var(--panel);
  border:1px solid var(--line);border-left:4px solid var(--cc);box-shadow:var(--sombra2);font-size:13px;line-height:1.35}
#tip b{display:block}
#tip small{color:var(--mut)}
#tip small.run{color:var(--run);font-weight:650}
/* medio y lejos: fuera la letra menuda y los botones; la cabecera la sustituye el rótulo (o el #tip) */
#vista.medio .tab-tit,#vista.lejos .tab-cab .tg,#vista.medio .tab-pie,#vista.medio .vivo,#vista.medio .portada .etq,
#vista.medio .col>h4>*,#vista.medio .n-cab>*,#vista.medio .mas,#vista.medio .nota,#vista.medio .t .badge{visibility:hidden}
#vista.medio .tab.abierto .etapas i,#vista.medio .col>h4{color:transparent}
#vista.lejos .tab-cab{pointer-events:none}
/* las secciones de texto se vuelven un bloque con un icono grande */
#vista.medio .n-guion>.scroll,#vista.medio .n-texto>.scroll,#vista.medio .n-audio>.pistas,#vista.medio .n-yt>.yt{visibility:hidden}
#vista.medio .n-guion:not(.plegado)::after,#vista.medio .n-texto:not(.plegado)::after,#vista.medio .n-audio:not(.plegado)::after,#vista.medio .n-yt:not(.plegado)::after{
  position:absolute;left:0;right:0;top:34px;bottom:0;display:grid;place-items:center;font-size:calc(30px * min(max(var(--inv,1),1),4));
  background:color-mix(in srgb,var(--cc,var(--acc)) 6%,transparent)}
#vista.medio .n-guion::after{content:"📝"}
#vista.medio .n-texto::after{content:"📋"}
#vista.medio .n-audio::after{content:"🎵"}
#vista.medio .n-yt::after{content:"📺"}
#vista.lejos .insignia .ins-t{display:none}
#vista.lejisimo .t img,#vista.lejisimo .pantalla img{display:none}

/* controles del lienzo */
.ctl{position:absolute;left:14px;bottom:14px;display:flex;gap:4px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:var(--sombra);z-index:5}
.ctl button{height:32px;min-width:32px;padding:0 8px;border:0;border-radius:8px;background:none;cursor:pointer;font-size:14px}
.ctl button:hover{background:var(--hover)}
.ctl .z{min-width:52px;font-variant-numeric:tabular-nums;font-size:12.5px}
.ctl .sep{width:1px;height:20px;background:var(--line)}
#minimapa{position:absolute;right:14px;bottom:14px;width:210px;height:132px;background:var(--cristal);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sombra);cursor:pointer;z-index:5}
body.con-insp #minimapa{right:calc(var(--insp) + 14px)}
.ayuda{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px 8px 14px;font-size:12.5px;color:var(--mut);
  box-shadow:var(--sombra);display:flex;gap:10px;align-items:center;z-index:5;max-width:calc(100% - 460px)}
.ayuda b{color:var(--txt)}

/* reproductor de audio (sigue sonando aunque te muevas por el lienzo) */
#rep{position:absolute;left:50%;bottom:66px;transform:translateX(-50%);display:none;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:6px 10px;box-shadow:var(--sombra2);z-index:6;width:min(520px,calc(100% - 40px))}
#rep.on{display:flex}
#rep .rn{flex:1;min-width:0;font-size:12.5px}
#rep .rn b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rep .rn small{color:var(--mut)}
#rep input[type=range]{width:100%;accent-color:var(--acc);height:14px;margin:2px 0 0}

/* inspector */
#insp{position:fixed;top:var(--top);right:0;bottom:0;width:var(--insp);background:var(--panel);border-left:1px solid var(--line);z-index:35;transform:translateX(100%);transition:transform .18s ease;
  display:flex;flex-direction:column;box-shadow:var(--sombra2)}
body.con-insp #insp{transform:none}
.i-cab{display:flex;gap:8px;align-items:flex-start;padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.i-cab b{flex:1;font-size:15px;overflow-wrap:anywhere;line-height:1.3}
.i-cuerpo{flex:1;overflow:auto;padding:14px}
.i-prev{border-radius:12px;overflow:hidden;background:#000;margin-bottom:12px}
.i-prev img,.i-prev video{display:block;width:100%;max-height:420px;object-fit:contain}
.i-prev audio{display:block;width:100%;background:var(--panel2)}
.i-prev.txt{background:var(--panel2)}
pre.txt{margin:0;padding:12px;max-height:440px;overflow:auto;font:12px/1.45 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
dl.meta{display:grid;grid-template-columns:96px 1fr;gap:5px 10px;margin:0 0 14px;font-size:12.5px}
dl.meta dt{color:var(--mut)}
dl.meta dd{margin:0;overflow-wrap:anywhere}
.i-acc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.i-sec{margin:16px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);font-weight:650}
.et-fila{display:grid;grid-template-columns:10px 92px 1fr;gap:8px;align-items:baseline;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--line)}
.et-fila i{width:10px;height:10px;border-radius:3px;background:var(--panel2)}
.et-fila i.listo{background:var(--ok)}.et-fila i.en_curso{background:var(--run)}.et-fila i.parcial{background:color-mix(in srgb,var(--ok) 45%,var(--panel2))}
.et-fila i.atencion{background:var(--warn)}.et-fila i.omitido{border:1px dashed var(--line2);background:none}
.et-fila span{color:var(--mut)}
.sig{background:var(--panel2);border-radius:10px;padding:9px 10px;font-size:12.5px}
.sig code{display:block;margin:5px 0;overflow-wrap:anywhere}
.log{background:var(--panel2);border-radius:10px;padding:9px 10px;font:11.5px/1.45 ui-monospace,Consolas,monospace;white-space:pre-wrap;max-height:200px;overflow:auto;color:var(--mut)}

/* visor grande */
#caja{position:fixed;inset:0;z-index:80;background:rgba(6,8,14,.92);display:none;flex-direction:column}
#caja.on{display:flex}
.c-cab{display:flex;align-items:center;gap:10px;padding:10px 14px;color:#e9ebf3}
.c-cab b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-cab span{color:#9aa0b4;font-variant-numeric:tabular-nums}
.c-cab .mini{background:#1c202b;border-color:#363c4d;color:#e9ebf3;text-decoration:none;display:inline-flex;align-items:center}
.c-medio{flex:1;min-height:0;display:grid;place-items:center;position:relative;padding:0 64px 14px}
.c-medio img,.c-medio video{max-width:100%;max-height:100%;object-fit:contain;display:block}
.c-medio audio{width:min(640px,90%)}
.c-medio pre{background:#151821;color:#e9ebf3;border-radius:12px;max-width:min(900px,100%);max-height:100%;overflow:auto;padding:16px;margin:0;font:12.5px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap}
.c-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:64px;border-radius:12px;border:0;background:rgba(255,255,255,.08);color:#fff;font-size:22px;cursor:pointer}
.c-nav:hover{background:rgba(255,255,255,.18)}
.c-ant{left:10px}.c-sig{right:10px}

/* diálogos del panel clásico (Montaje, Vista previa, Muestra) incrustados */
#emb{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:90;background:transparent}
/* cajón de Canales */
#cajon{position:fixed;top:var(--top);right:0;bottom:0;width:min(1180px,96vw);background:var(--bg);border-left:1px solid var(--line);z-index:70;transform:translateX(102%);
  transition:transform .2s ease;display:flex;flex-direction:column;box-shadow:var(--sombra2)}
#cajon.on{transform:none}
.cajon-cab{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.cajon-cab b{flex:1}
.cajon-cuerpo{flex:1;overflow:auto;padding:10px}
#can-frame{display:block;width:100%;height:900px;border:0}

/* la barra de métricas no cabe en una línea por debajo de ~1900 px: pasa a una segunda fila completa */
@media (max-width:1880px){
  :root{--top:100px}
  #barra{flex-wrap:wrap;align-content:center;row-gap:5px;padding:5px 10px}
  #met{order:3;flex:1 0 100%;padding:0}
  .acciones{margin-left:auto}
}
@media (max-width:1250px){.ayuda{display:none}}
@media (max-width:900px){
  :root{--lado:0px;--insp:100vw}
  #lado{width:290px;box-shadow:var(--sombra2)}
  body:not(.sin-lado) #vista{left:0}
  .marca small,.acciones .txt{display:none}
  .ayuda{display:none}
  #minimapa{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header id="barra">
  <button class="bt ico" data-acc="lado" title="Mostrar u ocultar la lista de proyectos">☰</button>
  <div class="marca"><span class="logo"></span><span>Fábrica<small>lienzo · v2</small></span></div>
  <div id="met" aria-label="Sistema en vivo"><div class="m"><span class="pulso"></span><b>conectando…</b></div></div>
  <div class="acciones">
    <button class="bt" data-pop="curso" id="bt-curso" title="Producciones en marcha">▶ <span class="txt">En curso</span> <span class="cuenta" id="n-curso">0</span></button>
    <button class="bt" data-pop="av" id="bt-av" title="Avisos por voz">🔔 <span class="cuenta" id="n-av" style="display:none">0</span></button>
    <button class="bt" data-acc="estilos" id="bt-est" title="Muestra en el lienzo un video de ejemplo por cada estilo de la fábrica">🎨 <span class="txt">Estilos</span></button>
    <button class="bt" data-acc="canales" title="Calendario y estadísticas de los canales">📅 <span class="txt">Canales</span></button>
    <a class="bt" href="/" title="El panel de siempre (tarjetas)">▤ <span class="txt">Clásico</span></a>
    <button class="bt ico" data-acc="tema" title="Cambiar tema claro/oscuro">◐</button>
  </div>
</header>

<aside id="lado" aria-label="Proyectos">
  <div class="lado-cab">
    <input id="q" type="search" placeholder="Buscar video…  ( / )" autocomplete="off">
    <div class="chips" id="filtros"></div>
    <select class="sel-f" id="f-canal" title="Solo los videos de un canal"></select>
    <select class="sel-f" id="f-estilo" title="Solo los videos de un estilo visual"></select>
    <div class="kpis" id="kpis"></div>
  </div>
  <div id="lista"><div class="vacio">Cargando…</div></div>
  <div class="lado-pie"><button class="mini" data-acc="todo">⤢ Ver todo</button><button class="mini" data-acc="contraer">Contraer tableros</button><button class="mini" data-acc="reordenar" title="Vuelve a ordenar: lo que está en curso primero">↻ Reordenar</button></div>
</aside>

<main id="vista" aria-label="Lienzo">
  <div id="mundo"></div>
  <div id="etiquetas" aria-hidden="true"></div>
  <div id="tip" aria-hidden="true"></div>
  <div class="ctl">
    <button data-acc="zoom-" title="Alejar (−)">−</button><button class="z" id="zlbl" data-acc="zoom100" title="Zoom al 100 % (1)">100%</button><button data-acc="zoom+" title="Acercar (+)">+</button>
    <span class="sep"></span><button data-acc="todo" title="Ver todo el lienzo (F)">⤢</button>
    <button id="bt-rueda" data-acc="rueda" title="Qué hace la rueda del ratón"></button>
  </div>
  <div id="rep"><button class="mp" id="rep-play" style="width:34px;height:34px;font-size:12px">❚❚</button><div class="rn"><b id="rep-n"></b><input type="range" id="rep-pos" min="0" max="1000" value="0"><small id="rep-t"></small></div><button class="mini" id="rep-x" title="Cerrar">✕</button></div>
  <canvas id="minimapa" title="Mapa del lienzo: clic para ir"></canvas>
  <div class="ayuda" id="ayuda"><span><b>Arrastra</b> para moverte · <b>rueda</b> para acercar · <b>doble clic</b> en un tablero para ver todo lo producido · <b>F</b> encuadra todo</span><button class="mini" data-acc="ayuda-x">Entendido</button></div>
</main>

<aside id="insp" aria-label="Detalle"><div class="i-cab"><b id="i-tit"></b><button class="mini" data-acc="insp-x" title="Cerrar (Esc)">✕</button></div><div class="i-cuerpo" id="i-cuerpo"></div></aside>

<div class="pop" id="pop-proc"></div>
<div class="pop" id="pop-curso"></div>
<div class="pop" id="pop-av"></div>

<div id="caja" role="dialog" aria-label="Visor">
  <div class="c-cab"><b id="c-tit"></b><span id="c-i"></span><a class="mini" id="c-abrir" target="_blank" rel="noopener">↗ Abrir aparte</a><button class="mini" data-acc="caja-revelar">📂 Carpeta</button><button class="mini" data-acc="caja-x">✕ Cerrar</button></div>
  <div class="c-medio" id="c-medio"></div>
</div>

<div id="cajon"><div class="cajon-cab"><b>Canales · calendario y estadísticas</b><button class="mini" data-acc="cajon-x">✕ Cerrar</button></div><div class="cajon-cuerpo"><iframe id="can-frame" title="Canales"></iframe></div></div>

<script>
"use strict";
// ====================================================== utilidades
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mmss=s=>{s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const hace=t=>{const s=Math.max(0,Date.now()/1000-t);if(s<90)return "hace "+Math.round(s)+" s";if(s<5400)return "hace "+Math.round(s/60)+" min";if(s<172800)return "hace "+Math.round(s/3600)+" h";return "hace "+Math.round(s/86400)+" d"};

// ====================================================== carga perezosa de imágenes (solo lo que está a la vista)
// Por turnos, máx. 6 a la vez y lo último que entró a la vista primero: el servidor del panel solo encola 5 conexiones y, con
// la CPU al 100 %, pedir 60 miniaturas de golpe hacía que Windows rechazara las demás (se quedaban en blanco).
const COLA_IMG=[];let cargandoImg=0;
function encolarImg(im){COLA_IMG.push(im);bombearImg();}
function bombearImg(){
  while(cargandoImg<6&&COLA_IMG.length){
    const im=COLA_IMG.pop();if(!im.isConnected||!im.dataset.src)continue;
    cargandoImg++;
    const fin=ok=>{cargandoImg--;im.onload=im.onerror=null;
      if(!ok){if(!im._reint){im._reint=1;im.dataset.src=im.src;setTimeout(()=>encolarImg(im),2500);}else im.style.visibility="hidden";}
      bombearImg();};
    im.onload=()=>fin(true);im.onerror=()=>fin(false);
    im.src=im.dataset.src;im.removeAttribute("data-src");
  }
}
const io=new IntersectionObserver(ents=>{for(const en of ents)if(en.isIntersecting){io.unobserve(en.target);encolarImg(en.target);}},
  {root:vista,rootMargin:"400px"});
const observar=el=>$$("img[data-src]",el).forEach(im=>io.observe(im));
// al acercar, las miniaturas a la vista piden una versión más grande (de 160 en 160 px, hasta 960) para no verse pixeladas
function nitidez(){
  if(mundo.classList.contains("moviendo"))return;
  const dpr=window.devicePixelRatio||1,vr=vista.getBoundingClientRect();
  for(const im of $$("img[src*='/v2/mini/']",mundo)){
    const r=im.getBoundingClientRect();
    if(!r.width||r.right<vr.left||r.left>vr.right||r.bottom<vr.top||r.top>vr.bottom)continue;
    const u=new URL(im.src),w=+u.searchParams.get("w")||240,real=r.width*dpr;
    if(real>w*1.15&&w<960&&!im.dataset.src){u.searchParams.set("w",Math.min(960,Math.ceil(real/160)*160));im.dataset.src=u.pathname+u.search;encolarImg(im);}   // la vieja se ve hasta que llega la nueva
  }
}

function filtrados(){
  const D=S.D;if(!D)return [];
  const sel=D.proyectos.filter(p=>(!S.fCanal||(p.canal||"experimento")===S.fCanal)&&(!S.fEstilo||(p.estilo||SIN_ESTILO)===S.fEstilo));
  let ps=S.filtro==="ocultos"?sel.filter(p=>p.oculto):sel.filter(p=>!p.oculto);
  if(S.filtro==="curso")ps=ps.filter(p=>p.etapa_actual);
  if(S.filtro==="pend")ps=ps.filter(p=>p.progreso<1);
  if(S.filtro==="listos")ps=ps.filter(p=>p.progreso>=1);
  return ps;
}
function carriles(ps){
  const m=new Map(),rango=p=>p.etapa_actual?0:(p.progreso<1?1:2);
  for(const p of ps){const c=p.canal||"experimento";if(!m.has(c))m.set(c,{id:c,nombre:p.canal_nombre||c,ps:[]});m.get(c).ps.push(p);}
  const L=[...m.values()];
  L.forEach(l=>l.ps.sort((a,b)=>rango(a)-rango(b)||(b.actividad||0)-(a.actividad||0)));
  const act=l=>Math.max(...l.ps.map(p=>p.actividad||0)),top=l=>Math.min(...l.ps.map(rango));
  L.sort((a,b)=>top(a)-top(b)||act(b)-act(a));
  return L.map(l=>({id:l.id,nombre:l.nombre,ns:l.ps.map(p=>p.nombre)}));
}
function construir(reordenar){
  if(!S.D)return;
  const ps=filtrados(),nombres=new Set(ps.map(p=>p.nombre)),antes=S.orden?new Set(S.orden.filter(l=>l.id!=="__est").flatMap(l=>l.ns)):null;
  if(reordenar||!antes||antes.size!==nombres.size||[...nombres].some(n=>!antes.has(n)))S.orden=carriles(ps);
  else S.orden=S.orden.filter(l=>l.id!=="__est");
  if(S.verEst&&S.GAL&&S.GAL.estilos.length)S.orden.push({id:"__est",nombre:"Estilos de la fábrica",ns:S.GAL.estilos.map(g=>"est:"+g.id)});
  const quedan=new Set(),carrQuedan=new Set();
  for(const l of S.orden){
    carrQuedan.add(l.id);
    if(!CARR.has(l.id)){
      const banda=document.createElement("div");banda.className="banda";
      const etq=document.createElement("div");etq.className="etq-carril";etq.dataset.carril=l.id;
      mundo.prepend(banda);mundo.appendChild(etq);CARR.set(l.id,{banda,etq,x:0,w:0});
    }
    const c=CARR.get(l.id),cc=l.id==="__est"?"var(--acc)":colorDe(l.id);
    c.banda.style.setProperty("--cc",cc);c.etq.style.setProperty("--cc",cc);
    const fondo=FONDOS.has(l.id)?`style="background-image:url(/fondo/${enc(l.id)}.svg)"`:"";
    c.etq.innerHTML=`<span class="fondo" ${fondo}></span><b>${esc(l.nombre)}</b><span>${l.ns.length} ${l.id==="__est"?"estilos":l.ns.length===1?"video":"videos"}</span>`;
    for(const n of l.ns){
      quedan.add(n);let el=TABS.get(n);
      if(!el){el=document.createElement("article");el.className="tab";el.dataset.n=n;
        el.innerHTML=`<div class="tab-sup"><div class="s-cab"></div><div class="s-et"></div><div class="s-vivo"></div></div><div class="tab-pie s-pie"></div><div class="tab-cuerpo"></div>`;mundo.appendChild(el);TABS.set(n,el);}
      pintarTab(n);
    }
  }
  for(const [n,el] of TABS)if(!quedan.has(n)){el.remove();TABS.delete(n);}
  for(const [id,c] of CARR)if(!carrQuedan.has(id)){c.banda.remove();c.etq.remove();CARR.delete(id);}
  maquetar();pintarLado();
}
// cada canal es un carril (tableros en filas de ~6) y los carriles se empacan lado a lado, como un muro
const ANCHO_FILA=2300,ANCHO_MURO=2900,GX=30,GY=62,PAD=34,CAB=130,ENTRE=70;   // GY y CAB dejan sitio al título que va ENCIMA de cada tarjeta
function maquetar(){
  const cajas=[],carr=[];
  for(const l of S.orden||[]){
    const c=CARR.get(l.id);if(!c)continue;
    let x=PAD,yf=CAB,hf=0,ancho=0;const pos=[];
    for(const n of l.ns){
      const el=TABS.get(n);if(!el)continue;
      const w=el.offsetWidth,h=el.offsetHeight;
      if(x>PAD&&x+w>PAD+ANCHO_FILA){yf+=hf+GY;x=PAD;hf=0;}
      pos.push({n,el,x,y:yf,w,h});x+=w+GX;hf=Math.max(hf,h);ancho=Math.max(ancho,x-GX+PAD);
    }
    carr.push({c,pos,w:Math.max(ancho,330),h:yf+hf+PAD});
  }
  const muro=Math.max(ANCHO_MURO,...carr.map(L=>L.w));
  let X=0,Y=0,HF=0,maxX=0;
  for(const L of carr){
    if(X>0&&X+L.w>muro){Y+=HF+ENTRE;X=0;HF=0;}
    L.x=X;L.y=Y;X+=L.w+ENTRE;HF=Math.max(HF,L.h);maxX=Math.max(maxX,L.x+L.w);
  }
  for(const L of carr){
    Object.assign(L.c.banda.style,{left:L.x+"px",top:L.y+"px",width:L.w+"px",height:L.h+"px"});
    Object.assign(L.c.etq.style,{left:(L.x+18)+"px",top:(L.y+CAB-62)+"px"});
    L.c.x=L.x;L.c.w=L.w;
    for(const q of L.pos){
      const x=L.x+q.x,y=L.y+q.y;q.el.style.left=x+"px";q.el.style.top=y+"px";
      const p=porNombre(q.n);
      cajas.push({n:q.n,x,y,w:q.w,h:q.h,cc:q.n.startsWith("est:")?"#8b74ff":colorDe(p&&p.canal||"experimento"),corre:!!(p&&p.etapa_actual)});
    }
  }
  S.cajas=cajas;S.lim={x:0,y:-40,w:Math.max(600,maxX),h:Math.max(400,Y+HF+40)};
  anclar();aplicarVista();

    if(!ver){if(a.on){a.el.style.display="none";a.on=false;}continue;}

function md(s){
  const L=esc(s).split("\n");let out="",ul=false;

  for(let l of L){
    l=l.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");
    let m;
    if((m=l.match(/^(#{1,4})\s+(.*)/))){fin();out+=`<h${m[1].length+2}>${m[2]}</h${m[1].length+2}>`;}
    else if((m=l.match(/^\s*[-*]\s+(.*)/))){if(!ul){out+="<ul>";ul=true;}out+=`<li>${m[1]}</li>`;}
    else if(/^\s*\|/.test(l)){fin();if(!/^\s*\|[\s|:-]+\|\s*$/.test(l))out+=`<div class="tr">${l.split("|").slice(1,-1).map(c=>`<span>${c}</span>`).join("")}</div>`;}

// ---- abrir / cerrar tableros y leer lo producido
async function cargarRec(v){
  const R=S.rec[v]||(S.rec[v]={});
  if(R.cargando)return;R.cargando=true;
  try{
    const rec=await pedir("/api/v2/recursos?video="+enc(v));
    if(rec.error)throw new Error(rec.error);
    const gui=(!R.gui||!R.rec||R.rec.firma_textos!==rec.firma_textos)?await pedir("/api/v2/guion?video="+enc(v)):R.gui;
    const firma=[rec.firma,rec.firma_textos,rec.n_voz,rec.grupos.map(g=>g.id+":"+g.total).join(",")].join("|");
    const cambio=R.firma!==firma||R.error;
    R.rec=rec;R.gui=gui;R.firma=firma;R.error=null;
    R.idx={};for(const g of rec.grupos)for(const it of g.items)R.idx[it.r]=Object.assign(it,{g:g.id});
    if(cambio){R.ver=(R.ver||0)+1;if(pintarTab(v))maquetar();}
  }catch(e){R.error=String(e.message||e);R.ver=(R.ver||0)+1;if(pintarTab(v))maquetar();}
  finally{R.cargando=false;}
}
function alternarTablero(v,abrir){
  const ab=abrir??!S.abiertos.has(v);
  if(ab)S.abiertos.add(v);else S.abiertos.delete(v);
  LS.set("v2ab",[...S.abiertos]);
  pintarTab(v);S.volarA=v;maquetar();
  if(ab)cargarRec(v).then(()=>{if(S.abiertos.has(v)){S.volarA=v;maquetar();}});
}
function enVista(n){const c=S.cajas.find(c=>c.n===n);if(!c)return false;
  const x0=-V.x/V.z,y0=-V.y/V.z,x1=x0+vista.clientWidth/V.z,y1=y0+vista.clientHeight/V.z;return c.x<x1&&c.x+c.w>x0&&c.y<y1&&c.y+c.h>y0;}

// ====================================================== sistema en vivo (barra de arriba)
function spark(arr,color,max=100){
  if(arr.length<2)return `<svg class="spark"></svg>`;
  const n=arr.length,pts=arr.map((v,i)=>`${(i/(n-1)*58).toFixed(1)},${(21-clamp(v/max,0,1)*19).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 58 22" preserveAspectRatio="none"><path d="M0,22 L${pts.replace(/ /g," L")} L58,22 Z" fill="${color}"/><polyline points="${pts}" stroke="${color}"/></svg>`;
}
function hist(k,v){const a=S.hist[k];a.push(v);if(a.length>60)a.shift();}
async function cargarSis(){
  if(document.hidden||(S.pidiendoSis&&Date.now()-S.pidiendoSis<20000))return;
  S.pidiendoSis=Date.now();
  try{S.SIS=await pedir("/api/v2/sistema");S.sisOk=Date.now();}catch(e){S.SIS={error:String(e.message||e)};}
  S.pidiendoSis=0;
  const s=S.SIS;
  if(s&&!s.cargando&&!s.error){if(s.cpu)hist("cpu",s.cpu.uso);if(s.ram)hist("ram",s.ram.pct);if(s.gpu){hist("gpu",s.gpu.uso||0);hist("vram",s.gpu.mem_total?100*s.gpu.mem/s.gpu.mem_total:0);}}
  pintarSis();if($("#pop-proc").classList.contains("on"))pintarProcs();
}
function pintarSis(){
  const s=S.SIS,edad=S.ultimo?(Date.now()-S.ultimo)/1000:1e9,error=S.errEstado&&!S.pidiendo;
  const txt=error?"sin conexión":!S.D?"leyendo proyectos…":edad<20?"en vivo":hace(S.ultimo/1000);   // con la CPU al 100 % el escaneo puede tardar minutos

      <span class="sub" style="color:${vr>.92?"var(--bad)":"inherit"}">VRAM ${(g.mem/1024).toFixed(1)}/${(g.mem_total/1024).toFixed(0)} GB</span>${g.temp!=null?`<span class="sub" style="color:${g.temp>82?"var(--bad)":"inherit"}">${Math.round(g.temp)}°</span>`:""}</div>`;}
  h+=discosHTML();

function pintarProcs(){

    const hijos=S.procAbiertos&&S.procAbiertos.has(t.pid)?t.hijos.map(h=>`<tr class="hijo"><td>↳ ${esc(h.rol)} <span style="color:var(--faint)">${h.pid}</span></td><td class="n">${h.cpu}%</td><td class="n">${h.ram} MB</td><td></td></tr>`).join(""):"";

      ${t.hijos.length?`<br><small style="color:var(--mut)">${t.hijos.length} procesos más ${S.procAbiertos&&S.procAbiertos.has(t.pid)?"▴":"▾"}</small>`:""}</td><td class="n">${t.cpu_total}%</td><td class="n">${t.ram_total>=1024?(t.ram_total/1024).toFixed(1)+" GB":t.ram_total+" MB"}</td><td class="n" title="PID ${t.pid}">${hace(t.desde).replace("hace ","")}</td></tr>${hijos}`;}).join("");
  const gpu=s.gpu&&s.gpu.procesos&&s.gpu.procesos.length?`<div class="k" style="margin-top:14px">Usando la GPU</div>${s.gpu.procesos.map(g=>`<div style="font-size:12.5px;padding:3px 0">${esc(g.rol)}${g.video?" · "+esc(g.video):""}${g.mem?` · ${Math.round(g.mem)} MB`:""}</div>`).join("")}`:"";

    <p style="color:var(--mut);font-size:12px;margin:12px 0 0">Antes de un render largo conviene cerrar <code>chatterbox_server.py</code> y <code>app.py</code> (~8 GB cada uno). El panel nunca se detiene.</p>`;
}

async function cargarEstado(){
  if(S.pidiendo&&Date.now()-S.pidiendo<90000)return;                  // no apilar peticiones si el panel va lento
  S.pidiendo=Date.now();
  try{
    const D=await pedir("/api/v2/estado");S.D=D;S.ultimo=Date.now()-(D.edad||0)*1000;S.errEstado=null;encolarAvisos();
    for(const p of D.proyectos)if(p.nombre in S.ocultoLocal){if(p.oculto===S.ocultoLocal[p.nombre])delete S.ocultoLocal[p.nombre];else p.oculto=S.ocultoLocal[p.nombre];}   // «ocultar» al instante aunque el estado llegue viejo
    const ps=filtrados(),ahora=new Set(ps.map(p=>p.nombre)),antes=new Set((S.orden||[]).filter(l=>l.id!=="__est").flatMap(l=>l.ns));
    if(!S.orden||ahora.size!==antes.size||[...ahora].some(n=>!antes.has(n)))construir();
    else{let cambio=false;for(const n of TABS.keys())if(pintarTab(n))cambio=true;if(cambio)maquetar();pintarLado();}
    pintarCurso();pintarAv();if(S.sel&&S.sel.tipo==="proy")pintarInspSiCambio();
  }catch(e){S.errEstado=String(e.message||e);}
  S.pidiendo=0;pintarSis();
}

function accion(acc,v,el){

      const pant=tab&&$(`[data-pantalla="${CSS.escape(v+"|"+r)}"]`,tab);
      if(pant){reproducirEn(pant,uArch(v,r));break;}
      const po=tab&&$(".portada",tab);if(po)reproducirEn(po,uArch(v,r));else{S.caja={v,lista:[r],i:0};$("#caja").classList.add("on");pintarCaja();}

    case "ir-video":{const n=v;if(!TABS.has(n)){S.filtro=porNombre(n)&&porNombre(n).oculto?"ocultos":"todos";S.fCanal="";S.fEstilo="";guardarFiltros();construir();}irA(n);break;}
    case "montaje":abrirEmb("montaje",v);break;
    case "previa":abrirEmb("previa",v);break;
    case "muestra":abrirEmb("muestra",v);break;
    case "carpeta":postJSON("/api/v2/revelar",{video:v,ruta:""});break;
    case "revelar":if(S.sel)postJSON("/api/v2/revelar",{video:S.sel.v,ruta:S.sel.r||""});break;
    case "caja-revelar":if(S.caja)postJSON("/api/v2/revelar",{video:S.caja.v,ruta:S.caja.lista[S.caja.i]});break;
    case "ocultar":{const val=el.dataset.valor==="1",p=porNombre(v);if(p)p.oculto=val;S.ocultoLocal[v]=val;postJSON("/api/ocultar",{video:v,oculto:val}).then(cargarEstado);construir();break;}
    case "caja":if(S.sel&&S.sel.tipo==="arch")abrirCaja(S.sel.v,S.sel.r);break;
    case "caja-x":cerrarCaja();break;
    case "caja-ant":moverCaja(-1);break;
    case "caja-sig":moverCaja(1);break;
    case "insp-x":cerrarInsp();break;
    case "zoom+":zoomEn(anchoUtil()/2,vista.clientHeight/2,1.25);break;
    case "zoom-":zoomEn(anchoUtil()/2,vista.clientHeight/2,.8);break;
    case "zoom100":zoomEn(anchoUtil()/2,vista.clientHeight/2,1/V.z);break;
    case "todo":encuadrarTodo();break;
    case "rueda":S.rueda=S.rueda==="zoom"?"mover":"zoom";LS.set("v2rueda",S.rueda);pintarRueda();break;
    case "contraer":S.abiertos.clear();LS.set("v2ab",[]);for(const n of TABS.keys())pintarTab(n);maquetar();break;
    case "reordenar":construir(true);break;
    case "lado":{const sin=!document.body.classList.contains("sin-lado");document.body.classList.toggle("sin-lado",sin);LS.set("v2lado",!sin);setTimeout(aplicarVista,200);break;}
    case "tema":{const r=document.documentElement,osc=getComputedStyle(r).getPropertyValue("--bg").trim()==="#0b0d13";r.dataset.tema=osc?"claro":"oscuro";try{localStorage.setItem("t",r.dataset.tema)}catch(e){}pintarMinimapa();break;}
    case "estilos":S.verEst=!S.verEst;LS.set("v2est",S.verEst);$("#bt-est").classList.toggle("on",S.verEst);
      if(S.verEst){(S.GAL?Promise.resolve():cargarGal()).then(()=>{construir();const l=S.cajas.filter(c=>c.n.startsWith("est:"));if(l.length){const x0=Math.min(...l.map(c=>c.x)),y0=Math.min(...l.map(c=>c.y));encuadrar({x:x0,y:y0,w:Math.max(...l.map(c=>c.x+c.w))-x0,h:Math.max(...l.map(c=>c.y+c.h))-y0},40,1);}});}

  const escribiendo=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement&&document.activeElement.tagName);
  if(e.key==="Escape"){if(S.caja)cerrarCaja();else if($(".pop.on"))cerrarPops();else if($("#cajon").classList.contains("on"))$("#cajon").classList.remove("on");else if(escribiendo)document.activeElement.blur();else if(S.sel)cerrarInsp();return;}
  if(escribiendo)return;
  if(S.caja){if(e.key==="ArrowLeft")moverCaja(-1);if(e.key==="ArrowRight")moverCaja(1);return;}
  const w=anchoUtil()/2,h=vista.clientHeight/2;
  if(e.key==="/"){e.preventDefault();if(document.body.classList.contains("sin-lado"))accion("lado");$("#q").focus();}
  else if(e.key==="f"||e.key==="F")encuadrarTodo();
  else if(e.key==="1")zoomEn(w,h,1/V.z);
  else if(e.key==="+"||e.key==="=")zoomEn(w,h,1.25);
  else if(e.key==="-")zoomEn(w,h,.8);
  else if(e.key.startsWith("Arrow")){const d=e.shiftKey?400:90;if(e.key==="ArrowLeft")V.x+=d;if(e.key==="ArrowRight")V.x-=d;if(e.key==="ArrowUp")V.y+=d;if(e.key==="ArrowDown")V.y-=d;aplicarVista();}
  else if(e.key===" "&&AU.k){e.preventDefault();AU.el.paused?AU.el.play().catch(()=>{}):AU.el.pause();}
});
window.addEventListener("resize",()=>aplicarVista());
document.addEventListener("visibilitychange",()=>{if(!document.hidden){cargarSis();cargarEstado();}});

// ====================================================== arranque
(async function(){
  if(LS.get("v2ayuda",0))$("#ayuda").remove();
  pintarRueda();$("#bt-est").classList.toggle("on",S.verEst);
  aplicarVista();cargarSis();
  await Promise.all([cargarEstado(),cargarPortadas()]);
  if(S.verEst)cargarGal();
  for(const v of S.abiertos)if(TABS.has(v))cargarRec(v);
  const h=new URLSearchParams(location.hash.slice(1)).get("v");
  if(h&&porNombre(h)){if(!TABS.has(h)){S.filtro=porNombre(h).oculto?"ocultos":"todos";S.fCanal=S.fEstilo="";construir(true);}alternarTablero(h,true);}
  else if(PRIMERA_VEZ)encuadrarTodo();
  setInterval(cargarEstado,3000);setInterval(cargarSis,2000);setInterval(cargarPortadas,30000);setInterval(refrescarAbiertos,8000);
})();
</script>
