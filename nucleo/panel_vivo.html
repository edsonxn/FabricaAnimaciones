<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d13">
<title>En vivo · Fábrica de Animaciones</title>
<script>try{const t=localStorage.getItem("t");if(t)document.documentElement.dataset.tema=t;}catch(e){}</script>
<style>
/* /v2/vivo (30-oct-2026): lo que el agente hace, animado. Datos: nucleo/agente_vivo.py. Misma clave de tema que el lienzo. */
:root{
  --bg:#eceef4; --panel:#ffffff; --panel2:#f3f4f8; --line:#dfe2ea; --line2:#c9cedb;
  --txt:#161a24; --mut:#626a82; --faint:#9aa0b4; --cristal:rgba(255,255,255,.86);
  --acc:#6b4dff; --ok:#14a06c; --run:#2f6bff; --warn:#d9771a; --bad:#d9435b; --pink:#d6408f;
  --muro:#d9dde8; --muro2:#c6ccdb; --suelo:#b4bbcd; --mesa:#8b93aa;
  --cod-bg:#10131b; --cod-txt:#d9dce6; --cod-mut:#6c7389;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root:not([data-tema="claro"]){
  --bg:#0b0d13; --panel:#151821; --panel2:#1c202b; --line:#272c39; --line2:#363c4d;
  --txt:#e9ebf3; --mut:#8d93a8; --faint:#5f6579; --cristal:rgba(21,24,33,.86);
  --acc:#8b74ff; --ok:#3ecf8e; --run:#5b93ff; --warn:#ffa94d; --bad:#ff6b81; --pink:#ff7ab8;
  --muro:#141823; --muro2:#1b2030; --suelo:#242a3b; --mesa:#39415a;
}}
:root[data-tema="oscuro"]{
  --bg:#0b0d13; --panel:#151821; --panel2:#1c202b; --line:#272c39; --line2:#363c4d;
  --txt:#e9ebf3; --mut:#8d93a8; --faint:#5f6579; --cristal:rgba(21,24,33,.86);
  --acc:#8b74ff; --ok:#3ecf8e; --run:#5b93ff; --warn:#ffa94d; --bad:#ff6b81; --pink:#ff7ab8;
  --muro:#141823; --muro2:#1b2030; --suelo:#242a3b; --mesa:#39415a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}

/* cabecera */
#cab{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--cristal);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);flex:none;min-width:0}
.bt{height:34px;min-width:34px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;flex:none}
.bt:hover{border-color:var(--line2)}
.bt.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
.cas{cursor:pointer;user-select:none}
.cas input{margin:0;accent-color:var(--acc);cursor:pointer}
#titulo{min-width:0;flex:1}
#titulo b{display:block;font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#titulo small{display:block;color:var(--mut);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#modo{height:30px;padding:0 11px;border-radius:99px;font-size:12px;font-weight:650;display:inline-flex;align-items:center;gap:7px;background:var(--panel2);color:var(--mut);white-space:nowrap;flex:none}
#modo i{width:8px;height:8px;border-radius:50%;background:currentColor}
#modo.vivo{color:var(--ok)}
#modo.vivo i{animation:lat 1.6s infinite}
#modo.repe{color:var(--warn)}
@keyframes lat{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 55%,transparent)}100%{box-shadow:0 0 0 9px transparent}}

/* sesiones */
#ses{display:flex;gap:6px;padding:7px 12px;overflow-x:auto;scrollbar-width:none;flex:none;border-bottom:1px solid var(--line)}
#ses::-webkit-scrollbar{display:none}
.chip{height:28px;padding:0 11px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-size:12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.chip.act i{background:var(--ok)}

/* etapas */
#etapas{display:flex;align-items:center;gap:3px;padding:8px 12px 7px;flex:none}
#etapas .pip{flex:1;height:7px;border-radius:9px;background:var(--panel2);overflow:hidden;position:relative;min-width:0}
#etapas .pip i{position:absolute;inset:0 auto 0 0;background:var(--ok);border-radius:9px}
#etapas .pip.curso i{background:var(--run);animation:brillo 1.2s infinite alternate}
#etapas .pip.omit{opacity:.35}
@keyframes brillo{to{filter:brightness(1.5)}}
#etaInfo{font-size:12px;color:var(--mut);padding:0 12px 6px;display:flex;justify-content:space-between;gap:12px;flex:none}
#etaInfo b{color:var(--txt);font-weight:650}
#etaInfo span:first-child{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#etaInfo span:last-child{flex:none}

/* taller */
#taller{display:block;width:100%;height:clamp(150px,27vh,240px);flex:none;border-block:1px solid var(--line);cursor:pointer}

/* cuerpo */
#cuerpo{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:10px;padding:10px 12px}
#monitor{position:relative;min-height:0;border-radius:14px;background:var(--panel);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
#mcab{display:flex;align-items:center;gap:9px;padding:9px 13px;border-bottom:1px solid var(--line);flex:none;min-width:0}
#mico{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:15px;flex:none;background:color-mix(in srgb,var(--c,var(--acc)) 18%,transparent);color:var(--c,var(--acc))}
#mtit{min-width:0;flex:1}
#mtit b{display:block;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mtit small{display:block;color:var(--mut);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mhora{color:var(--faint);font-size:11.5px;flex:none;font-variant-numeric:tabular-nums}
#mbarra{height:2px;background:var(--c,var(--acc));width:0;flex:none}
#mcuerpo{flex:1;min-height:0;position:relative;overflow:hidden}
.pant{position:absolute;inset:0;animation:entra .28s ease-out}
@keyframes entra{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}

/* código y terminal */
.codigo{position:absolute;inset:0;background:var(--cod-bg);color:var(--cod-txt);overflow:hidden;padding:12px 0;font:12.5px/1.55 ui-monospace,"Cascadia Mono",Consolas,monospace}
.lin{display:flex;white-space:pre;height:1.55em}
.lin .n{width:44px;flex:none;text-align:right;padding-right:12px;color:var(--cod-mut);user-select:none}
.lin .s{width:14px;flex:none;color:var(--cod-mut)}
.lin .t{overflow:hidden;display:block;max-width:0;flex:none}
.lin.mas{background:rgba(62,207,142,.1)}.lin.mas .s{color:#3ecf8e}
.lin.menos{background:rgba(255,107,129,.11)}.lin.menos .s{color:#ff6b81}
.lin .car{display:none;width:7px;height:1.2em;background:var(--cod-txt);margin:.15em 0 0 1px;flex:none}
.lin.aqui .car{display:block;animation:parp .9s steps(2) infinite}
@keyframes parp{50%{opacity:0}}
.tk-k{color:#c792ea}.tk-s{color:#c3e88d}.tk-c{color:#6c7389;font-style:italic}.tk-n{color:#f78c6c}
.web{padding:14px 16px;display:flex;flex-direction:column;gap:9px;height:100%;overflow:hidden;box-sizing:border-box}
.web .barra{display:flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--line2);border-radius:22px;background:var(--panel2);font-size:15px;min-height:22px}
.web .barra .cur{width:2px;height:1.1em;background:var(--acc);animation:parp .9s steps(2) infinite}
.web .quien{font-size:12px;color:var(--mut)}
.web .r{padding:6px 2px;border-bottom:1px solid var(--line);opacity:0;transform:translateY(5px);transition:opacity .25s,transform .25s}
.web .r.ver{opacity:1;transform:none}
.web .r b{display:block;font-size:13.5px;font-weight:600;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.web .r span{font-size:11.5px;color:var(--mut)}
.web .sit{font-size:12.5px;color:var(--mut)}
.web h4{margin:0;font-size:18px;line-height:1.25}
.web .ex{margin:0;font-size:14px;line-height:1.5;color:var(--txt);overflow:hidden}
.term{padding:14px 16px;white-space:pre-wrap;word-break:break-word;overflow:hidden}
.term .pr{color:#3ecf8e}
.term .sal{color:#9aa3bb;opacity:0;transition:opacity .25s}
.term .sal.ver{opacity:1}
.term .fallo{color:#ff6b81}
.giro{display:inline-block;width:12px;height:12px;border:2px solid #3ecf8e;border-right-color:transparent;border-radius:50%;animation:gira .7s linear infinite;vertical-align:-2px}
@keyframes gira{to{transform:rotate(360deg)}}

/* imagen con lupa */
.visor{position:absolute;inset:0;display:grid;place-items:center;background:#0a0c11;padding:12px}
.marco{position:relative;display:inline-block;max-width:100%;max-height:100%;line-height:0}
.marco img{max-width:100%;max-height:100%;display:block;border-radius:6px}
.visor{--h:100%}
.lupa{position:absolute;width:150px;height:150px;border-radius:50%;border:4px solid #fff;box-shadow:0 8px 28px rgba(0,0,0,.55),inset 0 0 0 2px rgba(0,0,0,.35);background-repeat:no-repeat;pointer-events:none}
.lupa::after{content:"";position:absolute;width:62px;height:11px;background:#fff;border-radius:9px;left:calc(100% - 12px);top:calc(100% - 4px);transform:rotate(45deg);transform-origin:0 50%}
.barrido{position:absolute;left:0;right:0;height:2px;background:var(--ok);box-shadow:0 0 14px 3px color-mix(in srgb,var(--ok) 60%,transparent);pointer-events:none}
.sinimg{color:#8d93a8;font-size:13px;display:grid;place-items:center;gap:10px;text-align:center}
.sinimg .gr{font-size:44px}

/* navegador */
.nav{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--panel2)}
.navbar{height:34px;display:flex;align-items:center;gap:7px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.navbar i{width:10px;height:10px;border-radius:50%;background:var(--line2)}
.navbar span{flex:1;height:22px;border-radius:7px;background:var(--panel2);font-size:11.5px;color:var(--mut);padding:0 9px;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
.navvista{flex:1;min-height:0;position:relative;display:grid;place-items:center;overflow:hidden}
.navvista img{max-width:100%;max-height:100%;display:block}
.cursor{position:absolute;width:22px;height:22px;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));left:0;top:0}
.onda{position:absolute;width:40px;height:40px;border-radius:50%;border:3px solid var(--acc);margin:-20px;opacity:0;pointer-events:none}
.onda.ya{animation:onda .6s ease-out}
@keyframes onda{from{opacity:1;transform:scale(.3)}to{opacity:0;transform:scale(1.5)}}
.navtexto{padding:8px 12px;font-size:12.5px;color:var(--mut);border-top:1px solid var(--line);background:var(--panel);flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* burbujas, pasos, documento */
.centro{position:absolute;inset:0;display:grid;place-items:center;padding:22px;overflow:hidden}
.burbuja{max-width:640px;padding:16px 20px;border-radius:18px;background:var(--panel2);border:1px solid var(--line);font-size:16px;line-height:1.5;position:relative}
.burbuja.usu{background:color-mix(in srgb,var(--acc) 14%,var(--panel));border-color:color-mix(in srgb,var(--acc) 35%,transparent)}
.burbuja .quien{display:block;font-size:11px;font-weight:650;color:var(--mut);letter-spacing:.5px;text-transform:uppercase;margin-bottom:5px}
.lista-paso{width:min(520px,100%);display:grid;gap:7px}
.lp{display:flex;gap:10px;align-items:center;padding:9px 13px;border-radius:11px;background:var(--panel2);font-size:14px;transition:.3s}
.lp .mk{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;font-size:12px;flex:none}
.lp.completed{color:var(--mut)}.lp.completed .mk{background:var(--ok);border-color:var(--ok);color:#fff}
.lp.in_progress{background:color-mix(in srgb,var(--run) 16%,var(--panel));font-weight:650}.lp.in_progress .mk{border-color:var(--run);border-right-color:transparent;animation:gira 1s linear infinite}
.grande{text-align:center}
.grande .gr{font-size:58px;line-height:1.1;animation:late 1.4s ease-in-out infinite}
@keyframes late{50%{transform:scale(1.08)}}
.grande p{margin:10px 0 0;font-size:16px;max-width:560px}
.grande small{display:block;color:var(--mut);margin-top:6px;font-size:13px}
.doc{position:absolute;inset:0;padding:16px 22px;overflow:hidden;font:12.5px/1.6 ui-monospace,"Cascadia Mono",Consolas,monospace;color:var(--mut);white-space:pre-wrap;word-break:break-word}
.doc .foco{position:absolute;left:0;right:0;height:3.2em;background:color-mix(in srgb,var(--warn) 16%,transparent);border-block:1px solid color-mix(in srgb,var(--warn) 40%,transparent);pointer-events:none}

/* lateral */
#lado{min-height:0;display:flex;flex-direction:column;gap:10px}
.caja{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-height:0}
.caja h3{margin:0 0 7px;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);font-weight:650}
#plan{flex:none;max-height:42%;overflow:auto}
.pl{display:flex;gap:7px;font-size:12.5px;padding:2px 0;color:var(--mut)}
.pl.in_progress{color:var(--txt);font-weight:650}
.pl.completed{color:var(--faint);text-decoration:line-through}
#cifras{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center}
#cifras b{display:block;font-size:17px;font-variant-numeric:tabular-nums;line-height:1.2}
#cifras span{font-size:10.5px;color:var(--mut)}
#cifras p{grid-column:1/-1;margin:3px 0 0;font-size:11.5px;color:var(--mut);border-top:1px solid var(--line);padding-top:4px}
#feed{flex:1;overflow:auto;padding:6px}
.ev{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:8px;font-size:12.5px;cursor:pointer;min-width:0}
.ev:hover{background:var(--panel2)}
.ev.on{background:color-mix(in srgb,var(--c) 16%,transparent)}
.ev .ic{width:20px;text-align:center;flex:none;font-size:13px}
.ev .tx{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev img{width:32px;height:22px;object-fit:cover;border-radius:4px;flex:none}
.ev time{color:var(--faint);font-size:10.5px;flex:none;font-variant-numeric:tabular-nums}

/* línea de tiempo */
#pie{display:flex;align-items:center;gap:8px;padding:0 12px 10px;flex:none}
#linea{flex:1;min-width:0;height:30px;display:flex;align-items:flex-end;gap:1px;cursor:pointer;border-radius:7px;overflow:hidden;background:var(--panel2);padding:3px}
#linea i{flex:1;min-width:1px;border-radius:1px;background:var(--c);opacity:.55;height:45%}
#linea i.on{opacity:1;height:100%}
#linea i.pas{opacity:.9}

#vacio{position:absolute;inset:0;display:none;place-items:center;text-align:center;color:var(--mut);padding:24px;background:var(--panel)}

@media (max-width:900px){
  body{overflow:auto;height:auto;min-height:100%}
  #cuerpo{grid-template-columns:minmax(0,1fr);flex:none}
  #monitor{height:62vh;min-height:340px}
  #lado{display:contents}
  #plan{max-height:none}
  #feed{max-height:40vh;flex:none}
  #taller{height:150px}
  .lupa{width:104px;height:104px}
  .codigo{font-size:11px}
  .lin .n{width:30px;padding-right:7px}
  .bt .txt,#modo .n{display:none}
  #cab{flex-wrap:wrap}
  #titulo{order:9;flex-basis:100%}
  #modo{margin-right:auto}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<header id="cab">
  <a class="bt" href="/v2" title="Volver al lienzo">←</a>
  <div id="titulo"><b id="tVideo">Conectando…</b><small id="tSes"></small></div>
  <span id="modo"><i></i><span id="modoTx">—</span></span>
  <label class="bt cas" title="Sonidos del robot en cada acción"><input type="checkbox" id="chkSon">🔊 <span class="txt">Sonido</span></label>
  <label class="bt cas" title="Al llegar al final, volver a repetir las últimas acciones. Apagada: se queda en la última y espera lo nuevo"><input type="checkbox" id="chkBucle">🔁 <span class="txt">Repetir</span></label>
  <button class="bt" id="btPausa" title="Pausar (espacio)">⏸</button>
  <button class="bt" id="btVel" title="Velocidad">×1</button>
  <button class="bt" id="btVivo" title="Saltar a lo más reciente">⏭ <span class="txt">Ahora</span></button>
</header>
<nav id="ses" aria-label="Sesiones"></nav>
<div id="etapas"></div>
<div id="etaInfo"><span id="etaDet"></span><span id="etaPc"></span></div>
<canvas id="taller" aria-label="Taller: el robot hace lo que el agente está haciendo; tócalo y hace una gracia" title="Tócame"></canvas>
<main id="cuerpo">
  <section id="monitor" aria-live="off">
    <div id="mcab"><div id="mico">·</div><div id="mtit"><b id="mT">—</b><small id="mS"></small></div><span id="mhora"></span></div>
    <div id="mbarra"></div>
    <div id="mcuerpo"></div>
    <div id="vacio"><div><div style="font-size:48px">😴</div><p>No hay sesiones en las últimas 12 horas.<br>Cuando el agente trabaje, aquí se verá.</p></div></div>
  </section>
  <aside id="lado">
    <div class="caja" id="cifras"></div>
    <div class="caja" id="plan"><h3>Plan</h3><div id="planL"></div></div>
    <div class="caja" id="feed"></div>
  </aside>
</main>
<footer id="pie"><div id="linea" title="Clic para ir a ese momento"></div></footer>

<script>
"use strict";
// ---------------------------------------------------------- tipos de evento
const TIPOS={
  imagen:{ic:"🔍",c:"--pink",dur:4800,nom:"Mira una imagen"},
  codigo:{ic:"✎",c:"--ok",dur:4000,nom:"Código"},
  comando:{ic:"❯",c:"--run",dur:3400,nom:"Comando"},
  leer:{ic:"📄",c:"--warn",dur:2000,nom:"Lee"},
  buscar:{ic:"⌕",c:"--warn",dur:1300,nom:"Busca"},
  navegador:{ic:"🌐",c:"--acc",dur:3800,nom:"Navegador"},
  habla:{ic:"💬",c:"--mut",dur:3000,nom:"Explica"},
  usuario:{ic:"🧑",c:"--acc",dur:3400,nom:"Pide"},
  paso:{ic:"☑",c:"--run",dur:2000,nom:"Paso del plan"},
  cierre:{ic:"🏁",c:"--ok",dur:3200,nom:"Cierre"},
  privado:{ic:"🔒",c:"--faint",dur:1000,nom:"Privado"},
  ayudante:{ic:"🤖",c:"--acc",dur:1800,nom:"Ayudante"},
  busqueda:{ic:"🌍",c:"--warn",dur:2800,nom:"Busca en la web"},
  pagina:{ic:"📖",c:"--ok",dur:2800,nom:"Lee una página"},
};
const ESTACIONES=[["guion","Guion"],["voz","Voz"],["sonido","Sonido"],["imagenes","Imágenes"],["clips","Clips"],["animacion","Animación"],["render","Render"],["revision","Revisión"],["subida","Subida"]];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const hora=t=>new Date(t*1000).toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});

// ---------------------------------------------------------- estado
const Q=new URLSearchParams(location.search);
const S={sesion:Q.get("sesion")||"",video:Q.get("video")||"",fija:!!Q.get("sesion"),rev:0,ev:[],idx:-1,ultimoVisto:0,
  modo:"carga",pausa:false,vel:1,ini:0,dur:1,ctl:null,cambio:0,manual:0,pensando:false,activa:false,bucle:false};
try{S.bucle=localStorage.getItem("vivo_bucle")==="1";}catch(e){}
const IDLE_MS=9000;           // con «Repetir» activa: sin nada nuevo en este tiempo empieza la repetición
const VENTANA=90;             // eventos que entran en la repetición
const COLA_MAX=14;            // en vivo, si hay más atrasados que esto se salta a los últimos

// ---------------------------------------------------------- datos
async function pedir(){
  if(document.hidden)return;
  const u=new URLSearchParams({desde:S.rev});
  if(S.fija)u.set("sesion",S.sesion);    // si no, el servidor sigue a la sesión más reciente (el corte a 180 mil abre otra)
  if(S.video)u.set("video",S.video);
  try{
    const r=await (await fetch("/api/v2/agente?"+u)).json();
    recibir(r);
  }catch(e){}
}
function recibir(r){
  if(!r.sesion){$("vacio").style.display=S.ev.length?"none":"grid";$("tVideo").textContent=S.video||"Sin sesiones";return;}
  $("vacio").style.display="none";
  if(r.sesion!==S.sesion&&S.sesion&&S.rev){reiniciar();S.sesion=r.sesion;return pedir();}
  S.sesion=r.sesion;
  const porSeq=new Map(S.ev.map(e=>[e.seq,e]));
  let nuevos=0;
  for(const e of r.eventos){
    const y=porSeq.get(e.seq);
    if(y)Object.assign(y,e); else {S.ev.push(e);nuevos++;}
  }
  if(r.rev<S.rev)S.ev=r.eventos.slice();
  S.rev=r.rev;
  if(S.ev.length>600)S.ev.splice(0,S.ev.length-600),S.idx=-1;
  S.pensando=r.pensando;S.activa=r.activa;S.etapaViva=r.proyecto?.etapa_actual||null;
  S.ayud=r.ayudantes||[];S.web=r.web||{};
  Taller.sync(S.ayud,S.etapaViva);
  if(nuevos){
    S.cambio=performance.now();
    if(S.modo==="repe"&&S.cambio>S.manual)siguiente();     // llegó algo nuevo: se corta la repetición sin esperar
  }
  pintarCab(r);pintarPlan(r.plan||[]);pintarEtapas(r.proyecto);pintarCifras();pintarFeed();pintarLinea();
  if(S.modo==="carga"&&S.ev.length){S.modo="repe";S.idx=Math.max(0,S.ev.length-VENTANA)-1;S.ultimoVisto=S.ev.at(-1).seq;siguiente();}
}
function reiniciar(){S.ev=[];S.rev=0;S.idx=-1;S.modo="carga";S.ultimoVisto=0;S.ctl=null;$("mcuerpo").innerHTML="";}
async function pedirSesiones(){
  if(document.hidden)return;
  try{
    const l=await (await fetch("/api/v2/agente/sesiones")).json();
    const lista=[];const vistos=new Set();
    for(const s of l){const k=s.video||s.id;if(vistos.has(k))continue;vistos.add(k);lista.push(s);}
    $("ses").innerHTML=lista.map(s=>{
      const on=S.fija?s.id===S.sesion:(S.video?s.video===S.video:s.id===S.sesion);
      return `<button class="chip ${on?"on":""} ${s.activa?"act":""}" data-id="${esc(s.id)}" data-v="${esc(s.video||"")}" title="${esc(s.titulo)}"><i></i>${esc(s.video||s.titulo||"Sesión")}</button>`;
    }).join("");
  }catch(e){}
}
$("ses").onclick=e=>{
  const b=e.target.closest(".chip");if(!b)return;
  S.video=b.dataset.v;S.fija=!b.dataset.v;S.sesion=b.dataset.id;reiniciar();
  const u=new URL(location);u.search=S.video?"?video="+encodeURIComponent(S.video):"?sesion="+S.sesion;history.replaceState(0,"",u);

// ---------------------------------------------------------- reproductor
function duracion(e){
  const t=TIPOS[e.tipo]||TIPOS.habla;let d=t.dur;
  if(e.tipo==="codigo")d=Math.min(9000,1800+(e.lineas||[]).length*110);
  if(e.tipo==="habla"||e.tipo==="usuario"||e.tipo==="cierre")d=Math.min(7500,1400+(e.detalle||"").length*30);
  if(e.tipo==="comando")d=e.salida?3800:2600;
  if(e.de)d=Math.min(d,1800);            // un ayudante hace cientos: no deben tapar lo que hace el principal
  return d;
}
function velocidad(){
  let v=S.vel;
  if(S.modo==="vivo"){const atras=S.ev.filter(e=>e.seq>(S.ev[S.idx]?.seq||0)).length;if(atras>2)v*=1+atras/3;}
  if(S.modo==="repe")v*=2.2;
  return v;
}
function siguiente(){
  const fin=S.ev.at(-1);if(!fin)return;
  const nuevo=fin.seq>S.ultimoVisto;
  if(nuevo&&S.modo!=="vivo"&&performance.now()>S.manual){   // llegó algo nuevo: se va a lo de ahora (salvo si acabas de elegir un momento)
    const i=S.ev.findIndex(e=>e.seq>S.ultimoVisto);
    S.modo="vivo";S.idx=i-1;
  }
  if(S.modo==="vivo"){
    if(S.idx<S.ev.length-1){
      if(S.ev.length-1-S.idx>COLA_MAX)S.idx=S.ev.length-1-COLA_MAX;
      S.idx++;
    }else return false;                  // al día: espera
  }else{
    S.idx++;
    const prim=S.ev.length-ventana().length;
    if(S.idx>=S.ev.length&&!S.bucle){      // sin «Repetir»: se queda en la última acción y espera lo nuevo
      S.idx=S.ev.length-1;S.modo="vivo";pintarModo();
      return false;
    }
    if(S.idx>=S.ev.length||S.idx<prim)S.idx=prim;
  }
  mostrar(S.ev[S.idx]);
  return true;
}
function mostrar(e){
  S.ultimoVisto=Math.max(S.ultimoVisto,S.modo==="vivo"?e.seq:0);
  const t=TIPOS[e.tipo]||TIPOS.habla;
  const m=$("monitor");m.style.setProperty("--c",`var(${t.c})`);
  $("mico").textContent=t.ic;
  $("mT").textContent=e.tipo==="habla"||e.tipo==="usuario"?t.nom:e.titulo;
  $("mS").textContent=e.ruta||(e.fallo?"terminó con error":"")||(e.tipo==="habla"||e.tipo==="usuario"?"":e.detalle)||"";
  $("mhora").textContent=hora(e.t);
  const c=$("mcuerpo");c.innerHTML="";
  const p=document.createElement("div");p.className="pant";c.appendChild(p);
  S.ctl=(PANT[e.tipo]||PANT.habla)(p,e);
  S.ini=performance.now();S.dur=duracion(e);S.prog=0;
  Taller.ir(e);
  marcarActual();
  pintarModo();
}
function pintarModo(){
  const el=$("modo");el.className=S.modo==="vivo"?"vivo":S.modo==="repe"?"repe":"";
  $("modoTx").innerHTML=S.modo==="vivo"?(S.activa?"EN VIVO":"AL DÍA"):S.modo==="repe"?`REPETICIÓN<span class="n"> · ${ventana().length} acciones</span>`:"—";
  $("btVivo").style.visibility=S.modo==="vivo"?"hidden":"";
}
let previo=performance.now();
function bucle(ahora){
  requestAnimationFrame(bucle);
  const dt=Math.min(1500,ahora-previo);previo=ahora;   // con un render a toda CPU hay ~1 cuadro/s: el avance sigue el reloj
  if(!S.pausa&&S.ctl){
    S.prog=(S.prog||0)+dt*velocidad()/S.dur;
    const p=Math.min(1,S.prog);
    try{S.ctl(p,S.ev[S.idx]);}catch(e){}
    $("mbarra").style.width=(p*100).toFixed(1)+"%";
    if(S.prog>=1.12){
      const siguio=siguiente();
      if(siguio===false&&S.bucle&&S.modo==="vivo"&&ahora-Math.max(S.cambio,S.ini)>IDLE_MS){   // al día y sin novedades: empieza el bucle
        S.modo="repe";S.idx=S.ev.length-ventana().length-1;siguiente();
      }
    }
  }
  Taller.pinta(ahora,Math.min(120,dt));
}

// ---------------------------------------------------------- pantallas: cada una devuelve tick(p, evento)
const KW=/\b(def|class|return|if|elif|else|for|while|in|not|and|or|import|from|as|try|except|with|lambda|None|True|False|self|const|let|function|async|await|new|this|null|true|false)\b/g;
function resaltar(s){
  const trozos=[];
  const rx=/(#[^\n]*|\/\/[^\n]*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`[^`]*`)/g;
  let u=0,m;
  while((m=rx.exec(s))){
    trozos.push(plano(s.slice(u,m.index)));
    trozos.push(`<span class="${m[1]?"tk-c":"tk-s"}">${esc(m[0])}</span>`);u=rx.lastIndex;
  }
  trozos.push(plano(s.slice(u)));
  return trozos.join("");
}

// ---------------------------------------------------------- sonidos de robot: todo sintetizado aquí, sin archivos ni APIs
const Son=(()=>{
  let ctx=null,salida=null,bus=null,ruido=null,on=false,finPrincipal=0;
  const hazRuido=c=>{const b=c.createBuffer(1,c.sampleRate,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b;};
  function cadena(c){                    // volumen bajo y compresor: nada debe sonar de golpe
    const m=c.createGain(),k=c.createDynamicsCompressor();m.gain.value=.24;m.connect(k);k.connect(c.destination);return m;
  }
  function abrir(){

    grita(t,f){parlo(t,4,f*.8,.4);},

  const R={
    hola(t){const u=parlo(t,3,900);bip(u,1100,1900,.16,.4);},
    libros(t){for(let i=0;i<3;i++)sopla(t+i*.46,.13,2500,3900,.24,1.5);bip(t+1.45,520,780,.09,.22);},
    preguntar(t){const u=parlo(t,2,820,.34);bip(u,700,1250,.13,.3);},
    gritar(t){parlo(t,4,640,.26);},
    chocar(t){sopla(t,.05,2600,1700,.9,.9);bip(t+.08,880,1320,.12,.28);},
    manos(t){parlo(t,3,880,.28);},
    prisa(t){for(let i=0;i<4;i++)bip(t+i*.3,210,120,.05,.35,"triangle");},
    teclear(t){for(let i=0;i<16;i++){const u=t+i*.1+Math.random()*.05;bip(u,1700+Math.random()*900,1300,.016,.2,"square");sopla(u,.018,3800,3000,.12);}bip(t+1.75,1200,1800,.09,.28);},
    escribir(t){for(let i=0;i<7;i++)sopla(t+i*.23,.17,3400,5200,.3,2.4);bip(t+1.65,1000,1500,.1,.26);},
    pintar(t){for(let i=0;i<4;i++)sopla(t+i*.3,.24,800,1800,.46,1.1);parlo(t+1.25,3,1050,.34);},
    grabar(t){[523,659,784,659,880].forEach((f,i)=>{const u=t+i*.2;bip(u,f,f*1.03,.19,.34);bip(u,f*2,f*2,.14,.1,"triangle");});},
    dj(t){notas(t,[392,523,659,784,659,523],.13,.3);sopla(t+.82,.09,500,2600,.55,3);sopla(t+.94,.09,2600,500,.55,3);},
    claqueta(t){sopla(t,.035,2100,1500,1,.8);bip(t,190,90,.07,.65);parlo(t+.22,2,1100,.3);},

// ---------------------------------------------------------- el taller: el robot hace cada acción con su utilería
const ACCIONES={pintar:"Pintando",grabar:"Grabando voz",dj:"Mezclando sonido",claqueta:"Bajando clips",teclear:"Programando",escribir:"Escribiendo guion",
  rueda:"Renderizando",lupa:"Revisando",subir:"Subiendo video",leer:"Leyendo",buscar:"Buscando",navegar:"Navegando",explicar:"Explicando",escuchar:"Te escucha",
  palomita:"¡Paso listo!",fiesta:"¡Tramo listo!",tapa:"Esto es privado",amigo:"Llamó a un ayudante",boton:"Corriendo comando",pensar:"Pensando",dormir:"Dormido",fallo:"¡Ups!",quieto:"",
  libros:"Investigando",prisa:"Esperando el render"};
const EST_ACCION={pintar:"imagenes",grabar:"voz",dj:"sonido",claqueta:"clips",teclear:"animacion",escribir:"guion",rueda:"render",lupa:"revision",subir:"subida",prisa:"render"};
const POR_ESTACION={voz:"grabar",sonido:"dj",imagenes:"pintar",clips:"claqueta",render:"rueda",revision:"lupa",subida:"subir",animacion:"teclear",guion:"escribir"};
const ETAPA_REPOSO={voz:"grabar",seleccion:"grabar",musica:"dj",sfx:"dj",mezcla:"dj",video:"rueda",final:"rueda",flow:"pintar",subida:"subir"};
function estacionDe(nom,e){              // null = no se trabaja en ninguna estación: el robot va al descanso
  if(e&&(nom==="teclear"||nom==="fallo"))return e.estacion||null;   // teclear se hace donde toque, y un fallo se llora donde pasó
  return EST_ACCION[nom]||null;
}
function accionDe(e){
  if(e.fallo)return "fallo";
  const est=e.estacion;
  switch(e.tipo){
    case "privado":return "tapa";
    case "ayudante":return "amigo";
    case "usuario":return "escuchar";
    case "cierre":return "fiesta";
    case "paso":return "palomita";
    case "habla":return "explicar";
    case "leer":return "leer";
    case "buscar":return "buscar";
    case "busqueda":case "pagina":return "libros";
    case "imagen":return "lupa";
    case "codigo":return est==="guion"?"escribir":"teclear";
    case "navegador":return POR_ESTACION[est]||"navegar";
    case "comando":return POR_ESTACION[est]||"boton";
  }
  return "quieto";
}

const Taller=(()=>{

  const MAX_MS=3000;                     // tope por si camina muy lento (render a toda CPU, ~1 cuadro/s)

  let W=0,H=0,K=1,dpr=1,robotX=DESCANSO,meta=DESCANSO,paso=0,idx=-1,dir=1,parts=[],pal={},pend=null,A={nom:"quieto",ini:0,e:null},llego=0,ahora=0,sue=0,tiempos={};
  const leerPal=()=>{for(const k of ["--muro","--muro2","--suelo","--mesa","--txt","--mut","--faint","--acc","--ok","--run","--warn","--pink","--panel"])pal[k]=css(k);};
  function medida(){

  const camino=(x,y,w,h,r)=>{g.beginPath();g.roundRect(x,y,w,h,r);};

  function ojos(cara,T,mira){

  // ---- cada acción: su pose y su utilería. x hacia delante del robot, y negativa hacia arriba; s = segundos desde que llegó

          for(let i=0;i<hecho;i++){const y=-50+i*3,x=27+(i*37)%9;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+12,y-4+(i%3)*3,x+24,y+2);g.strokeStyle=COLORES[i%6];g.lineWidth=3.4;g.lineCap="round";g.stroke();}

  // ---- el taller
  function poner(nom,e){
    finEsc();
    A={nom,ini:ahora,e:e||null};llego=0;pend=null;
    if(nom==="fallo")for(const [i,m] of enEscena().entries()){m.susto=ahora;m.meta=Math.max(.02,meta-.035*(i+1));}
    if(nom==="fiesta")for(const m of enEscena())m.porra=ahora;
    const est=estacionDe(nom,e),i=ESTACIONES.findIndex(x=>x[0]===est);
    idx=i;
    const atras=nom==="rueda"?0:32*K/Math.max(W,1);
    meta=i>=0?Math.max(.03,X(i)-atras):DESCANSO;
    Son.accion(nom);
  }
  const ir=e=>{
    if(e.de)return delAyudante(e);       // el principal no lo hizo: lo enseña su mini
    pend={nom:accionDe(e),e};
  };
  function reposo(t){                    // al día: si hay un proceso corriendo sigue en él; si no, piensa, espera a un ayudante o se duerme
    const proceso=ETAPA_REPOSO[S.etapaViva]==="rueda"?"prisa":ETAPA_REPOSO[S.etapaViva];   // el render lo corre el Rodador
    if(S.activa&&proceso)return proceso;
    if(S.activa&&S.pensando)return "pensar";
    if(proceso)return proceso;
    if(activos().length)return "quieto";
    return t-Math.max(S.cambio,A.ini)>15000&&!S.activa?"dormir":"quieto";
  }

    else if(k==="sonido"){for(let b=0;b<5;b++){const h=5+b%3*3;g.fillRect(-12+b*5.4,-h,3.4,h*2);}}
    else if(k==="imagenes"){camino(-13,-13,26,22,2);g.stroke();g.beginPath();g.moveTo(-10,6);g.lineTo(-3,-3);g.lineTo(2,3);g.lineTo(6,-1);g.lineTo(11,6);g.stroke();g.beginPath();g.arc(5,-7,2.5,0,7);g.fill();}
    else if(k==="clips"){g.beginPath();g.arc(0,0,13,0,7);g.stroke();for(let a=0;a<5;a++){g.beginPath();g.arc(Math.cos(a*1.256)*7,Math.sin(a*1.256)*7,2.6,0,7);g.fill();}}
    else if(k==="animacion"){camino(-14,-13,28,20,2);g.stroke();g.beginPath();g.moveTo(-5,10);g.lineTo(5,10);g.stroke();for(let l=0;l<3;l++)g.fillRect(-10+(l%2)*3,-9+l*5,11,2);}
    else if(k==="render"){for(let a=0;a<8;a++){g.rotate(.785);g.fillRect(-2.5,-15,5,6);}g.beginPath();g.arc(0,0,10,0,7);g.stroke();g.beginPath();g.arc(0,0,3,0,7);g.fill();}
    else if(k==="revision"){g.beginPath();g.arc(-2,-3,9,0,7);g.stroke();g.lineWidth=3.4;g.beginPath();g.moveTo(5,4);g.lineTo(12,11);g.stroke();}
    else if(k==="subida"){g.beginPath();g.moveTo(0,-13);g.lineTo(0,10);g.moveTo(-8,-5);g.lineTo(0,-13);g.lineTo(8,-5);g.stroke();}
    g.restore();
  }
  function rotulo(txt,x,y){
    if(!txt)return;
    g.font=`650 ${Math.max(10,11*K)}px "Segoe UI",system-ui,sans-serif`;
    const w=g.measureText(txt).width+18,h=Math.max(19,19*K),px=Math.min(W-w-4,Math.max(4,x-w/2)),py=Math.max(4,y);
    caja(px,py,w,h,h/2,pal["--panel"]);marco(px,py,w,h,h/2,pal["--faint"],1);
    g.fillStyle=pal["--txt"];g.textAlign="left";g.textBaseline="middle";g.fillText(txt,px+9,py+h/2+.5);g.textBaseline="alphabetic";
  }
  function pinta(t,dt){
    if(!W)medida();
    if(!W||!H)return;
    ahora=t;sue=H*.72;
    g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
    if(pend&&Esc&&pend.e)finEsc();          // llegó trabajo real: se acaba el teatro
    if(pend&&t-A.ini>MIN_MS&&(llego?t-llego>MIN_MS:t-A.ini>MAX_MS)){if(pend.e)ultReal=t;poner(pend.nom,pend.e);}
    if(A.e&&A.e.fallo&&A.nom!=="fallo")poner("fallo",A.e);
    if(!Esc&&!pend&&S.modo==="vivo"&&(S.prog||0)>=1.12&&t-A.ini>2600){const r=reposo(t);if(r!==A.nom)poner(r);}
    if(!Esc&&!pend&&A.nom==="quieto"&&t-A.ini>3500)lanzaEscena(t);
    if(Esc)pasaEscena(t);
    const dif=meta-robotX,anda=Math.abs(dif)>.003;
    if(anda){robotX+=Math.sign(dif)*Math.min(Math.abs(dif),dt*.00042*(1+Math.min(3,Math.abs(dif)*9)));dir=dif>0?1:-1;paso+=dt*.016;llego=0;}
    else{robotX=meta;dir=1;if(!llego)llego=t;}
    fondo(t);rincon(t);
    const conProp=!anda&&!!EST_ACCION[A.nom];
    for(let i=0;i<ESTACIONES.length;i++)estacion(i,t,conProp);
    pasaMinis(t,dt,anda);
    const vis=visibles();
    for(const m of vis)dibujaMini(m,t);
    if(minis.size>vis.length)rotulo(`+${minis.size-vis.length}`,(vis.at(-1)?.x||.5)*W+26*K,sue-46*K);
    const x=robotX*W,T=t/1000,s=llego?(t-llego)/1000:0;
    const enNube=Esc&&Esc.nube;
    if(enNube)nube((robotX+Esc.m.x)/2*W,t);
    else{
      g.fillStyle="rgba(0,0,0,.2)";g.beginPath();g.ellipse(x,sue+4*K,17*K,4*K,0,0,7);g.fill();
      const P=(anda?POSES.andar:POSES[A.nom]||POSES.quieto)(T,s);
      if(t<peloHasta)P.pelo=true;
      g.save();g.translate(x,sue+3*K);g.scale(K*dir,K);
      if(P.atras)P.atras();
      figura(P,T);
      if(P.frente)P.frente();
      g.restore();
    }
    for(const a of aviones)avionPapel(a,t);
    parts=parts.filter(p=>p.v>0);
    for(const p of parts){
      p.x+=p.vx*dt/1000;p.y+=p.vy*dt/1000;p.v-=dt/1300;
      g.globalAlpha=Math.max(0,Math.min(1,p.v*1.6));letra(p.txt,p.x,p.y,11*K,p.c);
    }
    g.globalAlpha=1;
    const nomR=anda?(pend?pend.nom:A.nom):A.nom,espera=activos()[0];
    rotulo(ACCIONES[nomR]||(Esc&&Esc.m?TM[Esc.m.tipo].espera:espera?TM[espera.tipo].espera:""),x,sue-(A.nom==="rueda"&&!anda?112:A.nom==="fiesta"?116:92)*K);
  }
  const VARIAS=["pintar","grabar","dj","claqueta","teclear","escribir","lupa","subir","leer","buscar","navegar","escuchar","fiesta","tapa","amigo","pensar","libros"];
  cv.addEventListener("click",()=>{Son.despertar();ahora=performance.now();poner(VARIAS[Math.floor(Math.random()*VARIAS.length)]);A.ini+=1800;});   // la gracia dura más que una acción normal
  return {ir,pinta,poner,POSES,sync,escena,TM,minis:()=>minis,finEsc,estado:()=>({nom:A.nom,x:robotX,meta,estacion:ESTACIONES[idx]?.[0]||null,esc:Esc&&Esc.tipo})};
})();

// ---------------------------------------------------------- controles
try{$("chkSon").checked=localStorage.getItem("vivo_sonido")==="1";}catch(e){}
if($("chkSon").checked)Son.activar(true);
$("chkSon").onchange=e=>{Son.activar(e.target.checked);try{localStorage.setItem("vivo_sonido",e.target.checked?"1":"0");}catch(x){}};
addEventListener("pointerdown",()=>Son.despertar());
$("chkBucle").checked=S.bucle;
$("chkBucle").onchange=e=>{S.bucle=e.target.checked;try{localStorage.setItem("vivo_bucle",S.bucle?"1":"0");}catch(x){}};
$("btPausa").onclick=()=>{S.pausa=!S.pausa;$("btPausa").textContent=S.pausa?"▶":"⏸";$("btPausa").classList.toggle("on",S.pausa);};
$("btVel").onclick=()=>{S.vel={1:2,2:4,4:1}[S.vel];$("btVel").textContent="×"+S.vel;};
$("btVivo").onclick=()=>{S.modo="vivo";S.idx=Math.max(-1,S.ev.length-2);S.ultimoVisto=S.ev.at(-1)?.seq||0;siguiente();};
addEventListener("keydown",e=>{if(e.code==="Space"&&e.target===document.body){e.preventDefault();$("btPausa").click();}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden){pedir();pedirSesiones();}});

pedir();pedirSesiones();
setInterval(pedir,2200);
setInterval(pedirSesiones,8000);
setInterval(()=>{if(S.ev.length)pintarModo();},4000);
requestAnimationFrame(bucle);
</script>
