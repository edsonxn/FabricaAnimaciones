<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d13">
<title>En vivo · Fábrica de Animaciones</title>
<script>try{const t=localStorage.getItem("t");if(t)document.documentElement.dataset.tema=t;}catch(e){}</script>
<style>
/* /v2/vivo (30-oct-2026): lo que el agente hace, animado. Datos: nucleo/agente_vivo.py. Misma clave de tema que el lienzo. */
:root{
  --bg:#eceef4; --panel:#ffffff; --panel2:#f3f4f8; --line:#dfe2ea; --line2:#c9cedb;
  --txt:#161a24; --mut:#626a82; --faint:#9aa0b4; --cristal:rgba(255,255,255,.86);
  --acc:#6b4dff; --ok:#14a06c; --run:#2f6bff; --warn:#d9771a; --bad:#d9435b; --pink:#d6408f;
  --muro:#d9dde8; --muro2:#c6ccdb; --suelo:#b4bbcd; --mesa:#8b93aa;
  --cod-bg:#10131b; --cod-txt:#d9dce6; --cod-mut:#6c7389;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root:not([data-tema="claro"]){
  --bg:#0b0d13; --panel:#151821; --panel2:#1c202b; --line:#272c39; --line2:#363c4d;
  --txt:#e9ebf3; --mut:#8d93a8; --faint:#5f6579; --cristal:rgba(21,24,33,.86);
  --acc:#8b74ff; --ok:#3ecf8e; --run:#5b93ff; --warn:#ffa94d; --bad:#ff6b81; --pink:#ff7ab8;
  --muro:#141823; --muro2:#1b2030; --suelo:#242a3b; --mesa:#39415a;
}}
:root[data-tema="oscuro"]{
  --bg:#0b0d13; --panel:#151821; --panel2:#1c202b; --line:#272c39; --line2:#363c4d;
  --txt:#e9ebf3; --mut:#8d93a8; --faint:#5f6579; --cristal:rgba(21,24,33,.86);
  --acc:#8b74ff; --ok:#3ecf8e; --run:#5b93ff; --warn:#ffa94d; --bad:#ff6b81; --pink:#ff7ab8;
  --muro:#141823; --muro2:#1b2030; --suelo:#242a3b; --mesa:#39415a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}

/* cabecera */
#cab{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--cristal);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);flex:none;min-width:0}
.bt{height:34px;min-width:34px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;flex:none}
.bt:hover{border-color:var(--line2)}
.bt.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
.cas{cursor:pointer;user-select:none}
.cas input{margin:0;accent-color:var(--acc);cursor:pointer}
#titulo{min-width:0;flex:1}
#titulo b{display:block;font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#titulo small{display:block;color:var(--mut);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#modo{height:30px;padding:0 11px;border-radius:99px;font-size:12px;font-weight:650;display:inline-flex;align-items:center;gap:7px;background:var(--panel2);color:var(--mut);white-space:nowrap;flex:none}
#modo i{width:8px;height:8px;border-radius:50%;background:currentColor}
#modo.vivo{color:var(--ok)}
#modo.vivo i{animation:lat 1.6s infinite}
#modo.repe{color:var(--warn)}
@keyframes lat{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 55%,transparent)}100%{box-shadow:0 0 0 9px transparent}}

/* sesiones */
#ses{display:flex;gap:6px;padding:7px 12px;overflow-x:auto;scrollbar-width:none;flex:none;border-bottom:1px solid var(--line)}
#ses::-webkit-scrollbar{display:none}
.chip{height:28px;padding:0 11px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-size:12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.chip.act i{background:var(--ok)}

/* etapas */
#etapas{display:flex;align-items:center;gap:3px;padding:8px 12px 7px;flex:none}
#etapas .pip{flex:1;height:7px;border-radius:9px;background:var(--panel2);overflow:hidden;position:relative;min-width:0}
#etapas .pip i{position:absolute;inset:0 auto 0 0;background:var(--ok);border-radius:9px}
#etapas .pip.curso i{background:var(--run);animation:brillo 1.2s infinite alternate}
#etapas .pip.omit{opacity:.35}
@keyframes brillo{to{filter:brightness(1.5)}}
#etaInfo{font-size:12px;color:var(--mut);padding:0 12px 6px;display:flex;justify-content:space-between;gap:12px;flex:none}
#etaInfo b{color:var(--txt);font-weight:650}
#etaInfo span:first-child{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#etaInfo span:last-child{flex:none}

/* taller */
#taller{display:block;width:100%;height:calc(clamp(150px,27vh,240px) + clamp(84px,10.5vh,108px));flex:none;border-block:1px solid var(--line);cursor:pointer}

/* cuerpo */
#cuerpo{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:10px;padding:10px 12px}
#monitor{position:relative;min-height:0;border-radius:14px;background:var(--panel);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
#mcab{display:flex;align-items:center;gap:9px;padding:9px 13px;border-bottom:1px solid var(--line);flex:none;min-width:0}
#mico{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:15px;flex:none;background:color-mix(in srgb,var(--c,var(--acc)) 18%,transparent);color:var(--c,var(--acc))}
#mtit{min-width:0;flex:1}
#mtit b{display:block;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mtit small{display:block;color:var(--mut);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mhora{color:var(--faint);font-size:11.5px;flex:none;font-variant-numeric:tabular-nums}
#mbarra{height:2px;background:var(--c,var(--acc));width:0;flex:none}
#mcuerpo{flex:1;min-height:0;position:relative;overflow:hidden}
.pant{position:absolute;inset:0;animation:entra .28s ease-out}
@keyframes entra{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}

/* código y terminal */
.codigo{position:absolute;inset:0;background:var(--cod-bg);color:var(--cod-txt);overflow:hidden;padding:12px 0;font:12.5px/1.55 ui-monospace,"Cascadia Mono",Consolas,monospace}
.lin{display:flex;white-space:pre;height:1.55em}
.lin .n{width:44px;flex:none;text-align:right;padding-right:12px;color:var(--cod-mut);user-select:none}
.lin .s{width:14px;flex:none;color:var(--cod-mut)}
.lin .t{overflow:hidden;display:block;max-width:0;flex:none}
.lin.mas{background:rgba(62,207,142,.1)}.lin.mas .s{color:#3ecf8e}
.lin.menos{background:rgba(255,107,129,.11)}.lin.menos .s{color:#ff6b81}
.lin .car{display:none;width:7px;height:1.2em;background:var(--cod-txt);margin:.15em 0 0 1px;flex:none}
.lin.aqui .car{display:block;animation:parp .9s steps(2) infinite}
@keyframes parp{50%{opacity:0}}
.tk-k{color:#c792ea}.tk-s{color:#c3e88d}.tk-c{color:#6c7389;font-style:italic}.tk-n{color:#f78c6c}
.web{padding:14px 16px;display:flex;flex-direction:column;gap:9px;height:100%;overflow:hidden;box-sizing:border-box}
.web .barra{display:flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--line2);border-radius:22px;background:var(--panel2);font-size:15px;min-height:22px}
.web .barra .cur{width:2px;height:1.1em;background:var(--acc);animation:parp .9s steps(2) infinite}
.web .quien{font-size:12px;color:var(--mut)}
.web .r{padding:6px 2px;border-bottom:1px solid var(--line);opacity:0;transform:translateY(5px);transition:opacity .25s,transform .25s}
.web .r.ver{opacity:1;transform:none}
.web .r b{display:block;font-size:13.5px;font-weight:600;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.web .r span{font-size:11.5px;color:var(--mut)}
.web .sit{font-size:12.5px;color:var(--mut)}
.web h4{margin:0;font-size:18px;line-height:1.25}
.web .ex{margin:0;font-size:14px;line-height:1.5;color:var(--txt);overflow:hidden}
.term{padding:14px 16px;white-space:pre-wrap;word-break:break-word;overflow:hidden}
.term .pr{color:#3ecf8e}
.term .sal{color:#9aa3bb;opacity:0;transition:opacity .25s}
.term .sal.ver{opacity:1}
.term .fallo{color:#ff6b81}
.giro{display:inline-block;width:12px;height:12px;border:2px solid #3ecf8e;border-right-color:transparent;border-radius:50%;animation:gira .7s linear infinite;vertical-align:-2px}
@keyframes gira{to{transform:rotate(360deg)}}

/* imagen con lupa */
.visor{position:absolute;inset:0;display:grid;place-items:center;background:#0a0c11;padding:12px}
.marco{position:relative;display:inline-block;max-width:100%;max-height:100%;line-height:0}
.marco img{max-width:100%;max-height:100%;display:block;border-radius:6px}
.visor{--h:100%}
.lupa{position:absolute;width:150px;height:150px;border-radius:50%;border:4px solid #fff;box-shadow:0 8px 28px rgba(0,0,0,.55),inset 0 0 0 2px rgba(0,0,0,.35);background-repeat:no-repeat;pointer-events:none}
.lupa::after{content:"";position:absolute;width:62px;height:11px;background:#fff;border-radius:9px;left:calc(100% - 12px);top:calc(100% - 4px);transform:rotate(45deg);transform-origin:0 50%}
.barrido{position:absolute;left:0;right:0;height:2px;background:var(--ok);box-shadow:0 0 14px 3px color-mix(in srgb,var(--ok) 60%,transparent);pointer-events:none}
.sinimg{color:#8d93a8;font-size:13px;display:grid;place-items:center;gap:10px;text-align:center}
.sinimg .gr{font-size:44px}

/* navegador */
.nav{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--panel2)}
.navbar{height:34px;display:flex;align-items:center;gap:7px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.navbar i{width:10px;height:10px;border-radius:50%;background:var(--line2)}
.navbar span{flex:1;height:22px;border-radius:7px;background:var(--panel2);font-size:11.5px;color:var(--mut);padding:0 9px;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
.navvista{flex:1;min-height:0;position:relative;display:grid;place-items:center;overflow:hidden}
.navvista img{max-width:100%;max-height:100%;display:block}
.cursor{position:absolute;width:22px;height:22px;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));left:0;top:0}
.onda{position:absolute;width:40px;height:40px;border-radius:50%;border:3px solid var(--acc);margin:-20px;opacity:0;pointer-events:none}
.onda.ya{animation:onda .6s ease-out}
@keyframes onda{from{opacity:1;transform:scale(.3)}to{opacity:0;transform:scale(1.5)}}
.navtexto{padding:8px 12px;font-size:12.5px;color:var(--mut);border-top:1px solid var(--line);background:var(--panel);flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* burbujas, pasos, documento */
.centro{position:absolute;inset:0;display:grid;place-items:center;padding:22px;overflow:hidden}
.burbuja{max-width:640px;padding:16px 20px;border-radius:18px;background:var(--panel2);border:1px solid var(--line);font-size:16px;line-height:1.5;position:relative}
.burbuja.usu{background:color-mix(in srgb,var(--acc) 14%,var(--panel));border-color:color-mix(in srgb,var(--acc) 35%,transparent)}
.burbuja .quien{display:block;font-size:11px;font-weight:650;color:var(--mut);letter-spacing:.5px;text-transform:uppercase;margin-bottom:5px}
.lista-paso{width:min(520px,100%);display:grid;gap:7px}
.lp{display:flex;gap:10px;align-items:center;padding:9px 13px;border-radius:11px;background:var(--panel2);font-size:14px;transition:.3s}
.lp .mk{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;font-size:12px;flex:none}
.lp.completed{color:var(--mut)}.lp.completed .mk{background:var(--ok);border-color:var(--ok);color:#fff}
.lp.in_progress{background:color-mix(in srgb,var(--run) 16%,var(--panel));font-weight:650}.lp.in_progress .mk{border-color:var(--run);border-right-color:transparent;animation:gira 1s linear infinite}
.grande{text-align:center}
.grande .gr{font-size:58px;line-height:1.1;animation:late 1.4s ease-in-out infinite}
@keyframes late{50%{transform:scale(1.08)}}
.grande p{margin:10px 0 0;font-size:16px;max-width:560px}
.grande small{display:block;color:var(--mut);margin-top:6px;font-size:13px}
.doc{position:absolute;inset:0;padding:16px 22px;overflow:hidden;font:12.5px/1.6 ui-monospace,"Cascadia Mono",Consolas,monospace;color:var(--mut);white-space:pre-wrap;word-break:break-word}
.doc .foco{position:absolute;left:0;right:0;height:3.2em;background:color-mix(in srgb,var(--warn) 16%,transparent);border-block:1px solid color-mix(in srgb,var(--warn) 40%,transparent);pointer-events:none}

/* lateral */
#lado{min-height:0;display:flex;flex-direction:column;gap:10px}
.caja{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-height:0}
.caja h3{margin:0 0 7px;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);font-weight:650}
#plan{flex:none;max-height:42%;overflow:auto}
.pl{display:flex;gap:7px;font-size:12.5px;padding:2px 0;color:var(--mut)}
.pl.in_progress{color:var(--txt);font-weight:650}
.pl.completed{color:var(--faint);text-decoration:line-through}
#cifras{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center}
#cifras b{display:block;font-size:17px;font-variant-numeric:tabular-nums;line-height:1.2}
#cifras span{font-size:10.5px;color:var(--mut)}
#cifras p{grid-column:1/-1;margin:3px 0 0;font-size:11.5px;color:var(--mut);border-top:1px solid var(--line);padding-top:4px}
#feed{flex:1;overflow:auto;padding:6px}
.ev{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:8px;font-size:12.5px;cursor:pointer;min-width:0}
.ev:hover{background:var(--panel2)}
.ev.on{background:color-mix(in srgb,var(--c) 16%,transparent)}
.ev .ic{width:20px;text-align:center;flex:none;font-size:13px}
.ev .tx{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev img{width:32px;height:22px;object-fit:cover;border-radius:4px;flex:none}
.ev time{color:var(--faint);font-size:10.5px;flex:none;font-variant-numeric:tabular-nums}
.ev.de{box-shadow:inset 3px 0 0 var(--m);padding-left:9px}
.ev .mi{width:18px;height:18px;border-radius:6px;display:grid;place-items:center;font-size:11px;flex:none;background:color-mix(in srgb,var(--m) 26%,transparent)}
#filtro{flex:none;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:1px}
#filtro::-webkit-scrollbar{display:none}
#filtro:empty{display:none}
.fil{height:26px;padding:0 9px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-size:11.5px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;flex:none;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.fil span{overflow:hidden;text-overflow:ellipsis}
.fil i{font-style:normal;flex:none}
.fil b{width:6px;height:6px;border-radius:50%;background:var(--m);flex:none;animation:lat 1.6s infinite;color:var(--m)}
.fil.on{background:var(--m,var(--txt));border-color:var(--m,var(--txt));color:#10131b;font-weight:650}
.fil:not(.de).on{color:var(--bg)}
#mquien{display:none;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:99px;font-size:11.5px;font-weight:600;max-width:42%;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
#mquien.ver{display:inline-flex}

/* línea de tiempo */
#pie{display:flex;align-items:center;gap:8px;padding:0 12px 10px;flex:none}
#linea{flex:1;min-width:0;height:30px;display:flex;align-items:flex-end;gap:1px;cursor:pointer;border-radius:7px;overflow:hidden;background:var(--panel2);padding:3px}
#linea i{flex:1;min-width:1px;border-radius:1px;background:var(--c);opacity:.55;height:45%}
#linea i.on{opacity:1;height:100%}
#linea i.pas{opacity:.9}

#vacio{position:absolute;inset:0;display:none;place-items:center;text-align:center;color:var(--mut);padding:24px;background:var(--panel)}

#tabsM,#btMas,#menuM{display:none}
/* teléfono (30-oct-2026): una sola pantalla sin desplazar; los controles los acomoda panel_vivo_movil.js */
@media (max-width:900px),(max-height:500px){
  html,body{height:100%;height:100dvh;overscroll-behavior:none}
  body{overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);-webkit-tap-highlight-color:transparent}
  #cab{padding:6px 10px;gap:8px}
  #titulo b{font-size:14px}
  #titulo small{font-size:11px}
  #modo{height:26px;padding:0 9px;font-size:11px}
  #ses{padding:5px 10px;gap:5px}
  .chip{height:26px;max-width:210px}
  #etapas{padding:6px 10px 2px}
  #etaInfo{padding:2px 10px 4px;font-size:11px}
  #taller{height:clamp(250px,42dvh,340px);touch-action:manipulation}
  #tabsM{display:flex;gap:4px;padding:6px 10px 0;flex:none}
  .tabM{flex:1;height:32px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--mut);font-size:12.5px;font-weight:600;white-space:nowrap}
  .tabM.on{background:var(--acc);border-color:var(--acc);color:#fff}
  #cuerpo{display:block;position:relative;flex:1;min-height:0;padding:6px 10px}
  #monitor{height:100%}
  #mcab{padding:6px 10px}
  #lado{display:none;position:absolute;inset:6px 10px;background:var(--bg);gap:6px;overflow-y:auto;overscroll-behavior:contain}
  #lado>*{flex:none}
  body[data-tab="hist"] #feed{flex:1 1 0;min-height:0}
  body[data-tab="hist"] #lado,body[data-tab="plan"] #lado{display:flex}
  body[data-tab="hist"] #cifras,body[data-tab="hist"] #plan,body[data-tab="hist"] #juego,body[data-tab="plan"] #filtro,body[data-tab="plan"] #feed{display:none}
  #plan{max-height:none}
  .ev{padding:6px;font-size:13px}
  #pie{gap:6px;padding:0 10px 8px}
  #linea{height:34px}
  #btMas{display:inline-flex;font-size:18px}
  #menuM{position:fixed;z-index:30;right:calc(10px + env(safe-area-inset-right));bottom:calc(52px + env(safe-area-inset-bottom));padding:8px;border-radius:14px;background:var(--panel);border:1px solid var(--line2);box-shadow:0 10px 34px rgba(0,0,0,.4);flex-direction:column;gap:6px}
  #menuM.abierto{display:flex}
  #menuM .bt{justify-content:flex-start;width:100%;height:38px}
  #menuM .bt .txt{display:inline}
  .bt .txt,#modo .n{display:none}
  .lupa{width:104px;height:104px}
  .codigo{font-size:11px}
  .lin .n{width:30px;padding-right:7px}
  .burbuja{font-size:15px;padding:12px 14px}
  .centro{padding:12px}
}
/* teléfono acostado: el taller a la izquierda y las pestañas a la derecha */
@media (max-height:500px) and (orientation:landscape){
  body{display:grid;grid-template-columns:minmax(0,54%) minmax(0,1fr);grid-template-rows:auto auto auto minmax(0,1fr) auto}
  #cab,#etapas{grid-column:1/-1}
  #cab{padding-block:4px}
  #ses,#etaInfo{display:none}
  #etapas{padding-bottom:4px}
  #taller{grid-column:1;grid-row:3/6;width:100%;height:auto;align-self:stretch;contain:size;border-block:0;border-right:1px solid var(--line)}
  #tabsM{grid-column:2;grid-row:3}
  #cuerpo{grid-column:2;grid-row:4}
  #pie{grid-column:2;grid-row:5}
}
/* edificio en escritorio (31-oct-2026): el lienzo al centro con todo el alto; a los lados, el monitor y el lateral */
@media (min-width:901px) and (min-height:501px){
  body.edif{--izq:clamp(250px,19vw,340px);--der:clamp(240px,17vw,320px);display:grid;grid-template-columns:var(--izq) minmax(0,1fr) var(--der);grid-template-rows:auto auto auto minmax(0,1fr) auto;column-gap:10px}
  body.edif #cab,body.edif #pie{grid-column:1/-1}

  #imgGrande img{max-width:100%;max-height:94vh;border-radius:8px}

<body>
<header id="cab">
  <a class="bt" href="/v2" title="Volver al lienzo">←</a>
  <div id="titulo"><b id="tVideo">Conectando…</b><small id="tSes"></small></div>
  <span id="modo"><i></i><span id="modoTx">—</span></span>
  <label class="bt cas" title="Sonidos del robot en cada acción"><input type="checkbox" id="chkSon">🔊 <span class="txt">Sonido</span></label>
  <label class="bt cas"><input type="checkbox" id="chkNar">🎙 <span class="txt">Narrador</span></label>
  <label class="bt cas" title="Al llegar al final, volver a repetir las últimas acciones. Apagada: se queda en la última y espera lo nuevo"><input type="checkbox" id="chkBucle">🔁 <span class="txt">Repetir</span></label>
  <button class="bt" id="btPausa" title="Pausar (espacio)">⏸</button>
  <button class="bt" id="btVel" title="Velocidad">×1</button>
  <button class="bt" id="btVivo" title="Saltar a lo más reciente">⏭ <span class="txt">Ahora</span></button>
</header>
<nav id="ses" aria-label="Sesiones"></nav>
<div id="etapas"></div>
<div id="etaInfo"><span id="etaDet"></span><span id="etaPc"></span></div>
<canvas id="taller" aria-label="Taller: el robot hace lo que el agente está haciendo; tócalo y hace una gracia" title="Tócame"></canvas>
<main id="cuerpo">
  <section id="monitor" aria-live="off">
    <div id="mcab"><div id="mico">·</div><div id="mtit"><b id="mT">—</b><small id="mS"></small></div><span id="mquien"></span><span id="mhora"></span></div>
    <div id="mbarra"></div>
    <div id="mcuerpo"></div>
    <div id="vacio"><div><div style="font-size:48px">😴</div><p>No hay sesiones en las últimas 12 horas.<br>Cuando el agente trabaje, aquí se verá.</p></div></div>
  </section>
  <aside id="lado">
    <div class="caja" id="cifras"></div>
    <div class="caja" id="plan"><h3>Plan</h3><div id="planL"></div></div>
    <div id="filtro" role="group" aria-label="Filtrar por quién trabaja"></div>
    <div class="caja" id="feed"></div>
  </aside>
</main>
<footer id="pie"><div id="linea" title="Clic para ir a ese momento"></div></footer>

<script>
"use strict";
// ---------------------------------------------------------- tipos de evento
const TIPOS={
  imagen:{ic:"🔍",c:"--pink",dur:4800,nom:"Mira una imagen"},
  codigo:{ic:"✎",c:"--ok",dur:4000,nom:"Código"},
  comando:{ic:"❯",c:"--run",dur:3400,nom:"Comando"},
  leer:{ic:"📄",c:"--warn",dur:2000,nom:"Lee"},
  buscar:{ic:"⌕",c:"--warn",dur:1300,nom:"Busca"},
  navegador:{ic:"🌐",c:"--acc",dur:3800,nom:"Navegador"},
  habla:{ic:"💬",c:"--mut",dur:3000,nom:"Explica"},
  usuario:{ic:"🧑",c:"--acc",dur:3400,nom:"Pide"},
  encargo:{ic:"📨",c:"--run",dur:3000,nom:"Encargo"},
  paso:{ic:"☑",c:"--run",dur:2000,nom:"Paso del plan"},
  cierre:{ic:"🏁",c:"--ok",dur:3200,nom:"Cierre"},
  privado:{ic:"🔒",c:"--faint",dur:1000,nom:"Privado"},
  ayudante:{ic:"🤖",c:"--acc",dur:1800,nom:"Ayudante"},
  busqueda:{ic:"🌍",c:"--warn",dur:2800,nom:"Busca en la web"},
  pagina:{ic:"📖",c:"--ok",dur:2800,nom:"Lee una página"},
  relevo:{ic:"🏃",c:"--run",dur:3000,nom:"Relevo"},
};
const ESTACIONES=[["guion","Guion"],["voz","Voz"],["sonido","Sonido"],["imagenes","Imágenes"],["clips","Clips"],["animacion","Animación"],["render","Render"],["revision","Revisión"],["subida","Subida"]];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const hora=t=>new Date(t*1000).toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});

// ---------------------------------------------------------- estado
const Q=new URLSearchParams(location.search);
const S={sesion:Q.get("sesion")||"",video:Q.get("video")||"",fija:!!Q.get("sesion"),rev:0,ev:[],idx:-1,ultimoVisto:0,
  gen:0,modo:"carga",pausa:false,vel:1,ini:0,dur:1,ctl:null,cambio:0,manual:0,pensando:false,activa:false,bucle:false,filtro:"todos",eq:new Map()};
try{S.bucle=localStorage.getItem("vivo_bucle")==="1";}catch(e){}
const IDLE_MS=9000;           // con «Repetir» activa: sin nada nuevo en este tiempo empieza la repetición
const VENTANA=90;             // eventos que entran en la repetición
const TRAMO=3;                // al elegir una sesión solo se reproducen sus últimas acciones: desde la antepenúltima
const COLA_MAX=14;            // en vivo, si hay más atrasados que esto se salta a los últimos
const COLA_AY=6;              // lo mismo con un ayudante: hace cientos de acciones
const TOPE_PRIN=500,TOPE_AY=220;   // la página guarda por separado lo del principal y lo de cada ayudante
const MINI_IC={investigador:"🔎",explorador:"🔦",obrero:"🔨",inspector:"🕵",rodador:"🎞",cantor:"🎤",pintor:"🎨",cargador:"📦"};
const pasa=e=>S.filtro==="todos"||(S.filtro==="principal"?!e.de:e.de===S.filtro);
function miniDe(id){                     // color, icono y nombre del ayudante, del equipo real que manda la API
  const f=S.eq.get(id)||{},tipo=f.tipo||"investigador",q=Taller.TM[tipo]||Taller.TM.investigador;
  return {id,tipo,c:q.c,ic:MINI_IC[tipo]||"🤖",nombre:f.desc||"Ayudante",activo:!!f.activo};
}

// ---------------------------------------------------------- datos
async function pedir(){
  if(document.hidden)return;
  const u=new URLSearchParams({desde:S.rev});
  if(S.fija)u.set("sesion",S.sesion);    // si no, el servidor sigue a la sesión más reciente (el corte a 180 mil abre otra)
  if(S.video)u.set("video",S.video);
  const gen=S.gen;
  try{
    const r=await (await fetch("/api/v2/agente?"+u)).json();
    if(gen===S.gen)recibir(r);    // lo pedido antes de cambiar de sesión ya no vale
  }catch(e){}
}
function recibir(r){
  if(!r.sesion){$("vacio").style.display=S.ev.length?"none":"grid";$("tVideo").textContent=S.video||"Sin sesiones";return;}
  $("vacio").style.display="none";
  if(r.sesion!==S.sesion&&S.sesion&&S.rev){if(!Taller.Flo.on)window.Extras?.cambioSesion();reiniciar();S.sesion=r.sesion;return pedir();}
  S.sesion=r.sesion;
  const porSeq=new Map(S.ev.map(e=>[e.seq,e]));
  let nuevos=0;
  for(const e of r.eventos){
    const y=porSeq.get(e.seq);
    if(y)Object.assign(y,e); else {S.ev.push(e);nuevos++;}
  }
  if(r.rev<S.rev)S.ev=r.eventos.slice();
  S.rev=r.rev;
  podar();
  S.pensando=r.pensando;S.activa=r.activa;S.etapaViva=r.proyecto?.etapa_actual||null;S.ultimo=r.ultimo||0;
  S.ayud=r.ayudantes||[];S.web=r.web||{};S.eq=new Map((r.equipo||[]).map(x=>[x.id,x]));
  if(S.filtro!=="todos"&&S.filtro!=="principal"&&!S.eq.has(S.filtro))S.filtro="todos";
  Taller.sync(S.ayud,S.etapaViva);
  window.Extras?.datos(r);
  if(nuevos){
    S.cambio=performance.now();
    if(S.modo==="repe"&&S.cambio>S.manual)siguiente();     // llegó algo nuevo: se corta la repetición sin esperar
  }
  pintarCab(r);pintarPlan(r.plan||[]);pintarEtapas(r.proyecto);pintarFiltro();pintarCifras();pintarFeed();pintarLinea();
  if(S.modo==="carga")S.ev.length?irTramo():$("mcuerpo").innerHTML="";
}
function podar(){                        // un ayudante nunca echa al principal, ni a otro ayudante
  if(S.ev.length<=TOPE_PRIN)return;
  const cur=S.ev[S.idx],n=new Map(),fila=[];
  for(let i=S.ev.length-1;i>=0;i--){
    const e=S.ev[i],k=e.de||"",c=(n.get(k)||0)+1;n.set(k,c);
    if(c<=(k?TOPE_AY:TOPE_PRIN))fila.push(e);
  }
  S.ev=fila.reverse();S.idx=cur?S.ev.indexOf(cur):-1;
}
function reiniciar(){S.ev=[];S.rev=0;S.idx=-1;S.modo="carga";S.ultimoVisto=0;S.ctl=null;S.filtro="todos";S.gen++;}
async function pedirSesiones(){
  if(document.hidden)return;
  try{
    const l=await (await fetch("/api/v2/agente/sesiones")).json();
    const lista=[];const vistos=new Set();
    for(const s of l){const k=s.video||s.id;if(vistos.has(k))continue;vistos.add(k);lista.push(s);}
    const edif=document.body.classList.contains("edif");
    if(edif)Taller.fabrica(lista);
    $("ses").innerHTML=(edif?`<button class="chip fab ${Taller.Flo.on?"on":""}" data-fab="1" title="Todas las sesiones a la vez en el mismo edificio">🏢 Toda la fábrica</button>`:"")+lista.map(s=>{
      const on=S.fija?s.id===S.sesion:(S.video?s.video===S.video:s.id===S.sesion);
      return `<button class="chip ${on?"on":""} ${s.activa?"act":""}" data-id="${esc(s.id)}" data-v="${esc(s.video||"")}" title="${esc(s.titulo)}"><i></i>${esc(s.video||s.titulo||"Sesión")}</button>`;
    }).join("");
  }catch(e){}
}
function abreSesion(id,video){
  S.video=video||"";S.fija=!video;S.sesion=id;reiniciar();
  const u=new URL(location);u.search=S.video?"?video="+encodeURIComponent(S.video):"?sesion="+S.sesion;history.replaceState(0,"",u);
  if(Taller.Flo.on)Taller.enfoca();      // en la fábrica entera el edificio sigue igual: cambian la cámara, la TV y los paneles
  pedir();pedirSesiones();
}
$("ses").onclick=e=>{
  const b=e.target.closest(".chip");if(!b)return;
  if(b.dataset.fab){Taller.ponFabrica(!Taller.Flo.on);return pedirSesiones();}
  abreSesion(b.dataset.id,b.dataset.v);
};

// ---------------------------------------------------------- cabecera, plan, etapas, cifras
function pintarCab(r){
  const p=r.proyecto;
  $("tVideo").textContent=(p&&p.titulo)||r.video||r.titulo||"Sesión sin video";
  document.title=(r.activa?"● ":"")+(r.video||r.titulo||"Sesión")+" · En vivo";
  const hace=r.ultimo?Math.round((Date.now()/1000-r.ultimo)/60):0;
  const corta=(r.sesion||"").slice(0,8),ses=r.titulo?`sesión «${r.titulo}»`:`sesión ${corta}`;
  $("tSes").textContent=[r.video,ses,r.activa?"trabajando ahora":hace>0?`última acción hace ${hace} min`:""].filter(Boolean).join(" · ");
  $("tSes").title=`Lo que ves viene de la sesión ${r.sesion}`;
}
function pintarPlan(plan){
  $("plan").style.display=plan.length?"":"none";
  $("planL").innerHTML=plan.map(p=>`<div class="pl ${p.estado}"><span>${p.estado==="completed"?"✓":p.estado==="in_progress"?"▸":"·"}</span><span>${esc(p.texto)}</span></div>`).join("");
}
function pintarEtapas(p){
  const el=$("etapas");
  if(!p||!p.etapas){el.style.display="none";$("etaInfo").style.display="none";return;}
  el.style.display="";$("etaInfo").style.display="";
  el.innerHTML=p.etapas.map(e=>{
    const hecho=e.estado==="listo"||e.estado==="lista",omit=e.estado==="omitido",curso=e.estado==="en_curso"||e.id===p.etapa_actual;
    return `<div class="pip ${curso?"curso":""} ${omit?"omit":""}" title="${esc(e.nombre)}: ${esc(e.detalle||e.estado||"")}"><i style="width:${Math.round((hecho?1:e.progreso||0)*100)}%"></i></div>`;
  }).join("");
  const c=p.etapas.find(e=>e.id===p.etapa_actual)||p.etapas.find(e=>e.estado==="en_curso");
  $("etaDet").innerHTML=c?`<b>${esc(c.nombre)}</b> · ${esc(c.detalle||"en curso")}`:"Sin proceso corriendo";
  $("etaPc").textContent=Math.round((p.progreso||0)*100)+" % del video";
}
function pintarCifras(){
  const ev=S.ev.filter(pasa),n=t=>ev.filter(e=>e.tipo===t).length;
  const lin=ev.reduce((a,e)=>a+(e.nuevas||0),0);
  $("cifras").innerHTML=[[n("imagen"),"imágenes"],[n("codigo"),"ediciones"],[lin>999?(lin/1000).toFixed(1)+" k":lin,"líneas"],[n("comando"),"comandos"]].map(([v,t])=>`<div><b>${v}</b><span>${t}</span></div>`).join("");
  const w=S.web||{},ay=(S.ayud||[]).filter(x=>x.activo&&!x.fondo).length;
  const plural=(k,s,p)=>`${k} ${k===1?s:p}`;
  if(w.busquedas||w.paginas||ay)$("cifras").innerHTML+=`<p>${plural(w.busquedas||0,"búsqueda","búsquedas")} · ${plural(w.paginas||0,"página","páginas")} · ${plural(ay,"ayudante trabajando","ayudantes trabajando")}</p>`;
}
function pintarFiltro(){
  const eq=[...S.eq.values()],el=$("filtro");
  if(!eq.length){el.innerHTML="";return;}
  const b=(id,txt,ic,c,extra="")=>`<button class="fil ${c?"de":""} ${S.filtro===id?"on":""}" data-id="${esc(id)}" style="${c?`--m:${c}`:""}" title="${esc(txt)}"><i>${ic}</i><span>${esc(txt)}</span>${extra}</button>`;
  el.innerHTML=b("todos","Todos","☰")+b("principal","Principal","🤖")+eq.map(x=>{const q=miniDe(x.id);return b(x.id,q.nombre,q.ic,q.c,x.activo?"<b></b>":"");}).join("");
}
$("filtro").onclick=e=>{
  const b=e.target.closest(".fil");if(!b||b.dataset.id===S.filtro)return;
  S.filtro=b.dataset.id;pintarFiltro();pintarCifras();pintarFeed();pintarLinea();
  irAhora();                             // el monitor pasa enseguida a lo último de quien elegiste
};
const ensenable=e=>pasa(e)&&(!e.de||S.filtro===e.de||S.eq.get(e.de)?.activo);
function irTramo(){                      // al elegir una sesión, nueva o ya vista: de golpe a lo último, sin recorrer su historia
  const v=S.ev.filter(ensenable),e=v.at(-TRAMO)||v[0]||S.ev.at(-1);
  S.modo="vivo";S.idx=S.ev.indexOf(e);mostrar(e);
}
function irAhora(){                      // lo más reciente que se puede enseñar con el selector actual
  let i=S.ev.length-1;
  while(i>=0&&!ensenable(S.ev[i]))i--;
  if(i<0)return;
  S.modo="vivo";S.idx=i;S.ultimoVisto=S.ev.at(-1).seq;mostrar(S.ev[i]);
}
function pintarFeed(){
  const f=$("feed"),arriba=f.scrollTop<8;
  const u=S.sesion,fin=ventana().reverse();
  f.innerHTML=fin.map(e=>{
    const t=TIPOS[e.tipo]||TIPOS.habla,q=e.de?miniDe(e.de):null;
    const txt=e.tipo==="habla"||e.tipo==="usuario"||e.tipo==="cierre"?(e.detalle||t.nom):e.titulo;
    return `<div class="ev ${q?"de":""}" data-seq="${e.seq}" style="--c:${q?q.c:`var(${t.c})`}${q?`;--m:${q.c}`:""}" ${q?`title="${esc(q.nombre)}"`:""}>${q?`<span class="mi">${q.ic}</span>`:""}<span class="ic">${t.ic}</span><span class="tx">${esc(txt)}</span>${e.img?`<img loading="lazy" src="/v2/vivo/img/${u}/${e.img}" alt="">`:""}<time>${hora(e.t).slice(0,5)}</time></div>`;
  }).join("");
  if(arriba)f.scrollTop=0;
  marcarActual();
}
function pintarLinea(){
  const v=ventana();
  $("linea").innerHTML=v.map(e=>`<i data-seq="${e.seq}" style="--c:${e.de?miniDe(e.de).c:`var(${(TIPOS[e.tipo]||TIPOS.habla).c})`}"></i>`).join("");
  marcarActual();
}
function marcarActual(){
  const e=S.ev[S.idx];if(!e)return;
  document.querySelectorAll("#feed .ev.on,#linea i.on").forEach(x=>x.classList.remove("on"));
  document.querySelectorAll(`[data-seq="${e.seq}"]`).forEach(x=>x.classList.add("on"));
  document.querySelectorAll("#linea i").forEach(x=>x.classList.toggle("pas",+x.dataset.seq<e.seq));
}
const ventana=()=>S.ev.filter(pasa).slice(-VENTANA);
const inicioVentana=()=>Math.max(0,S.ev.indexOf(ventana()[0]));
const irA=seq=>{const i=S.ev.findIndex(e=>e.seq===seq);if(i>=0){S.modo="repe";S.idx=i-1;S.ultimoVisto=S.ev.at(-1).seq;S.manual=performance.now()+20000;siguiente();}};
$("feed").onclick=e=>{const b=e.target.closest(".ev");if(b)irA(+b.dataset.seq);};
$("linea").onclick=e=>{
  const r=$("linea").getBoundingClientRect(),v=ventana();
  const i=Math.floor((e.clientX-r.left)/r.width*v.length);if(v[i])irA(v[i].seq);
};

// ---------------------------------------------------------- reproductor
function duracion(e){
  const t=TIPOS[e.tipo]||TIPOS.habla;let d=t.dur;
  if(e.tipo==="codigo")d=Math.min(9000,1800+(e.lineas||[]).length*110);
  if(e.tipo==="habla"||e.tipo==="usuario"||e.tipo==="cierre")d=Math.min(7500,1400+(e.detalle||"").length*30);
  if(e.tipo==="comando")d=e.salida?3800:2600;
  if(e.de)d=Math.min(d,S.modo==="vivo"?3200:1800);   // un ayudante hace cientos: no deben tapar lo que hace el principal
  return d;
}
function pendientes(){                   // lo que falta por enseñar en vivo: {prin, ay}, índices en S.ev
  const prin=[],ay=[];
  for(let i=S.idx+1;i<S.ev.length;i++){
    const e=S.ev[i];
    if(!e.de)prin.push(i);else if(S.filtro===e.de||S.eq.get(e.de)?.activo)ay.push(i);
  }
  return {prin,ay};
}
function proximoVivo(){                  // el principal va primero; si espera, el monitor enseña solo a los ayudantes activos
  const {prin,ay}=pendientes();
  if(S.filtro==="todos"||S.filtro==="principal"){
    if(prin.length)return prin[Math.max(0,prin.length-COLA_MAX)];
    return S.filtro==="todos"&&ay.length?ay[Math.max(0,ay.length-COLA_AY)]:-1;
  }
  const suyo=ay.filter(i=>S.ev[i].de===S.filtro);
  if(prin.length){Taller.ir(S.ev[prin.at(-1)]);if(!suyo.length)S.idx=prin.at(-1);}   // el principal sigue en el taller aunque el monitor no lo enseñe
  return suyo.length?suyo[Math.max(0,suyo.length-COLA_AY)]:-1;
}
function principalAlDia(){               // nada suyo en pantalla ni por llegar: para el taller, el principal está libre
  if(!S.ev.length)return true;
  if(S.modo!=="vivo")return false;
  const e=S.ev[S.idx];
  if(e&&!e.de&&(S.prog||0)<1.12)return false;
  for(let i=S.ev.length-1;i>S.idx;i--)if(!S.ev[i].de)return false;
  return true;
}
function velocidad(){
  let v=S.vel;
  if(S.modo==="vivo"){const {prin,ay}=pendientes(),atras=(prin.length||(S.filtro==="todos"?ay.length:0));if(atras>2)v*=1+atras/3;}
  if(S.modo==="repe")v*=2.2;
  return v;
}
function siguiente(){
  const fin=S.ev.at(-1);if(!fin)return;
  const nuevo=fin.seq>S.ultimoVisto;
  if(nuevo&&S.modo!=="vivo"&&performance.now()>S.manual){   // llegó algo nuevo: se va a lo de ahora (salvo si acabas de elegir un momento)
    const i=S.ev.findIndex(e=>e.seq>S.ultimoVisto);
    S.modo="vivo";S.idx=i-1;
  }
  if(S.modo==="vivo"){
    const i=proximoVivo();
    if(i<0)return false;                 // al día: espera
    S.idx=i;
  }else{
    const v=ventana();if(!v.length)return false;
    const prim=S.ev.indexOf(v[0]),ult=S.ev.indexOf(v.at(-1));
    do S.idx++;while(S.idx<S.ev.length&&!pasa(S.ev[S.idx]));
    if(S.idx>=S.ev.length&&!S.bucle){      // sin «Repetir»: se queda en la última acción y espera lo nuevo
      S.idx=ult;S.modo="vivo";pintarModo();
      return false;
    }
    if(S.idx>=S.ev.length||S.idx<prim)S.idx=prim;
  }
  mostrar(S.ev[S.idx]);
  return true;
}
function mostrar(e){
  S.ultimoVisto=Math.max(S.ultimoVisto,S.modo==="vivo"?e.seq:0);
  const t=TIPOS[e.tipo]||TIPOS.habla,q=e.de?miniDe(e.de):null;
  const m=$("monitor");m.style.setProperty("--c",q?q.c:`var(${t.c})`);
  $("mico").textContent=t.ic;
  const mq=$("mquien");mq.classList.toggle("ver",!!q);mq.textContent=q?`${q.ic} ${q.nombre}`:"";mq.title=q?`Lo hace el ayudante: ${q.nombre}`:"";
  $("mT").textContent=e.tipo==="habla"||e.tipo==="usuario"?t.nom:e.titulo;
  $("mS").textContent=e.ruta||(e.fallo?"terminó con error":"")||(e.tipo==="habla"||e.tipo==="usuario"?"":e.detalle)||"";
  $("mhora").textContent=hora(e.t);
  const c=$("mcuerpo");c.innerHTML="";
  const p=document.createElement("div");p.className="pant";c.appendChild(p);
  S.ctl=(PANT[e.tipo]||PANT.habla)(p,e);
  S.ini=performance.now();S.dur=duracion(e);S.prog=0;
  Taller.ir(e);
  marcarActual();
  pintarModo();
}
function pintarModo(){
  const el=$("modo");el.className=S.modo==="vivo"?"vivo":S.modo==="repe"?"repe":"";
  $("modoTx").innerHTML=S.modo==="vivo"?(S.activa?"EN VIVO":"AL DÍA"):S.modo==="repe"?`REPETICIÓN<span class="n"> · ${ventana().length} acciones</span>`:"—";
  $("btVivo").style.visibility=S.modo==="vivo"?"hidden":"";
}
let previo=performance.now();
function bucle(ahora){
  requestAnimationFrame(bucle);
  const dt=Math.min(1500,ahora-previo);previo=ahora;   // con un render a toda CPU hay ~1 cuadro/s: el avance sigue el reloj
  if(!S.pausa&&S.ctl){
    S.prog=(S.prog||0)+dt*velocidad()/S.dur;
    const p=Math.min(1,S.prog);
    try{S.ctl(p,S.ev[S.idx]);}catch(e){}
    $("mbarra").style.width=(p*100).toFixed(1)+"%";
    if(S.prog>=1.12){
      const siguio=siguiente();
      if(siguio===false&&S.bucle&&S.modo==="vivo"&&ahora-Math.max(S.cambio,S.ini)>IDLE_MS){   // al día y sin novedades: empieza el bucle
        S.modo="repe";S.idx=inicioVentana()-1;siguiente();
      }
    }
  }
  Taller.pinta(ahora,Math.min(120,dt));
}

const KW=/\b(def|class|return|if|elif|else|for|while|in|not|and|or|import|from|as|try|except|with|lambda|None|True|False|self|const|let|function|async|await|new|this|null|true|false)\b/g;
function resaltar(s){
  const trozos=[];
  const rx=/(#[^\n]*|\/\/[^\n]*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`[^`]*`)/g;
  let u=0,m;
  while((m=rx.exec(s))){
    trozos.push(plano(s.slice(u,m.index)));
    trozos.push(`<span class="${m[1]?"tk-c":"tk-s"}">${esc(m[0])}</span>`);u=rx.lastIndex;
  }
  trozos.push(plano(s.slice(u)));
  return trozos.join("");
}
const plano=s=>esc(s).replace(KW,'<span class="tk-k">$1</span>').replace(/\b\d+(\.\d+)?\b/g,'<span class="tk-n">$&</span>');

// ---------------------------------------------------------- sonidos de robot: todo sintetizado aquí, sin archivos ni APIs
const Son=(()=>{
  let ctx=null,salida=null,bus=null,ruido=null,on=false,finPrincipal=0;
  const hazRuido=c=>{const b=c.createBuffer(1,c.sampleRate,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b;};
  function cadena(c){                    // volumen bajo y compresor: nada debe sonar de golpe
    const m=c.createGain(),k=c.createDynamicsCompressor();m.gain.value=.24;m.connect(k);k.connect(c.destination);return m;
  }
  function abrir(){
    if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();salida=cadena(ctx);ruido=hazRuido(ctx);}
    if(ctx.state==="suspended")ctx.resume();
  }
  function nuevoBus(){
    if(bus){try{bus.gain.setTargetAtTime(0,ctx.currentTime,.03);}catch(e){}}
    bus=ctx.createGain();bus.connect(salida);
  }
  function bip(t,f0,f1,d,v=.5,tipo="sine"){
    const o=ctx.createOscillator(),a=ctx.createGain();
    o.type=tipo;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+d);
    a.gain.setValueAtTime(0,t);a.gain.linearRampToValueAtTime(v,t+Math.min(.012,d/3));a.gain.exponentialRampToValueAtTime(.0008,t+d);
    o.connect(a);a.connect(bus);o.start(t);o.stop(t+d+.02);
  }
  function sopla(t,d,f0,f1,v=.4,q=1.2){
    const s=ctx.createBufferSource(),fl=ctx.createBiquadFilter(),a=ctx.createGain();
    s.buffer=ruido;s.loop=true;fl.type="bandpass";fl.Q.value=q;
    fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+d);
    a.gain.setValueAtTime(0,t);a.gain.linearRampToValueAtTime(v,t+d*.25);a.gain.exponentialRampToValueAtTime(.0008,t+d);
    s.connect(fl);fl.connect(a);a.connect(bus);s.start(t,Math.random()*.5);s.stop(t+d+.02);
  }
  const ESC=[1,1.125,1.25,1.5,1.667,2];
  const azar=n=>Math.floor(Math.random()*n);
  function parlo(t,n,base=760,v=.42){    // el «idioma» del robot: sílabas con deslizamiento de tono
    for(let i=0;i<n;i++){
      const f=base*ESC[azar(ESC.length)],d=.05+Math.random()*.06;
      bip(t,f,f*(.72+Math.random()*.75),d,v,i%3?"sine":"triangle");t+=d+.018;
    }
    return t;
  }
  const M={                              // los minis: la pelea es corta y baja
    habla(t,f){parlo(t,3,f,.42);},
    grita(t,f){parlo(t,4,f*.8,.4);},
    pelea(t){for(let i=0;i<5;i++){sopla(t+i*.2,.14,260,520,.3,.9);bip(t+i*.2,150,80,.08,.28,"triangle");}},
    choca(t,f){sopla(t,.05,2600,1700,.8,.9);parlo(t+.1,2,f,.34);},
    salto(t,f){bip(t,f*.6,f*1.5,.14,.4);},
    ronca(t){sopla(t,.8,170,300,.4,1);},
    avion(t){sopla(t,.5,800,2300,.3,.8);},
    uy(t,f){bip(t,f*1.4,f*.45,.38,.34,"triangle");},              // los del muñeco de trapo: cae, golpe, se levanta, baila
    plaf(t){sopla(t,.1,900,260,.9,.8);bip(t,150,55,.14,.5,"triangle");},
    upa(t,f){bip(t,f*.7,f*1.15,.09,.3);bip(t+.13,f*1.15,f*1.7,.12,.3);},
    baile(t,f){[1,1.25,1.5,2,1.5,2.5].forEach((k,i)=>bip(t+i*.11,f*k,f*k,.1,.22,"square"));},
  };
  const notas=(t,fs,d=.11,v=.4,tipo="triangle")=>{fs.forEach((f,i)=>bip(t+i*d,f,f,d*1.5,v,tipo));return t+fs.length*d;};
  const R={
    hola(t){const u=parlo(t,3,900);bip(u,1100,1900,.16,.4);},
    libros(t){for(let i=0;i<3;i++)sopla(t+i*.46,.13,2500,3900,.24,1.5);bip(t+1.45,520,780,.09,.22);},
    preguntar(t){const u=parlo(t,2,820,.34);bip(u,700,1250,.13,.3);},
    gritar(t){parlo(t,4,640,.26);},
    chocar(t){sopla(t,.05,2600,1700,.9,.9);bip(t+.08,880,1320,.12,.28);},
    manos(t){parlo(t,3,880,.28);},
    prisa(t){for(let i=0;i<4;i++)bip(t+i*.3,210,120,.05,.35,"triangle");},
    teclear(t){for(let i=0;i<16;i++){const u=t+i*.1+Math.random()*.05;bip(u,1700+Math.random()*900,1300,.016,.2,"square");sopla(u,.018,3800,3000,.12);}bip(t+1.75,1200,1800,.09,.28);},
    escribir(t){for(let i=0;i<7;i++)sopla(t+i*.23,.17,3400,5200,.3,2.4);bip(t+1.65,1000,1500,.1,.26);},
    pintar(t){for(let i=0;i<4;i++)sopla(t+i*.3,.24,800,1800,.46,1.1);parlo(t+1.25,3,1050,.34);},
    grabar(t){[523,659,784,659,880].forEach((f,i)=>{const u=t+i*.2;bip(u,f,f*1.03,.19,.34);bip(u,f*2,f*2,.14,.1,"triangle");});},
    dj(t){notas(t,[392,523,659,784,659,523],.13,.3);sopla(t+.82,.09,500,2600,.55,3);sopla(t+.94,.09,2600,500,.55,3);},
    claqueta(t){sopla(t,.035,2100,1500,1,.8);bip(t,190,90,.07,.65);parlo(t+.22,2,1100,.3);},
    rueda(t){for(let i=0;i<13;i++)bip(t+i*(.15-.004*i),260+i*11,190,.03,.3,"square");bip(t,74,92,1.6,.26,"sawtooth");},
    lupa(t){bip(t,480,920,.22,.36);bip(t+.3,920,620,.14,.28);bip(t+.62,1320,1320,.26,.26);bip(t+.68,1760,1760,.24,.18);},
    subir(t){[1,2,3].forEach(i=>bip(t+i*.2,880,880,.07,.32,"square"));bip(t+.85,240,2400,1,.3);sopla(t+.85,1.15,300,3400,.5,.9);notas(t+2,[1047,1319,1568],.09,.3);},
    leer(t){sopla(t,.22,1100,3000,.8,1.1);sopla(t+.85,.22,1100,3000,.7,1.1);},
    buscar(t){bip(t,520,780,.15,.34);bip(t+.3,620,1040,.17,.34);},
    navegar(t){sopla(t,.7,300,1100,.34,.7);bip(t+.68,420,1180,.13,.32);bip(t+.84,700,1500,.11,.26);},
    explicar(t){parlo(t,9,740,.4);},
    escuchar(t){bip(t,1046,1046,.2,.34);bip(t+.17,1319,1319,.3,.34);parlo(t+.55,2,1400,.26);},
    palomita(t){bip(t,780,1560,.13,.36);bip(t+.15,1560,1560,.22,.3);},
    fiesta(t){notas(t,[523,659,784,1047,784,1047,1319],.11,.38);sopla(t+.75,.5,2600,6200,.26,.8);},
    tapa(t){bip(t,740,560,.17,.34);bip(t+.22,520,360,.26,.34);},
    amigo(t){const u=parlo(t,3,820,.36);parlo(u+.04,3,1500,.28);sopla(u+.5,.05,2400,1700,.7,.9);},
    boton(t){sopla(t,.025,1900,1400,.8,1);bip(t+.03,980,980,.11,.3,"square");bip(t+.18,1320,1320,.1,.24,"square");},
    pensar(t){bip(t,300,370,.32,.28);bip(t+.36,370,300,.34,.26);},

    hamaca(t){bip(t,210,250,.45,.16,"triangle");bip(t+.7,250,210,.45,.16,"triangle");sopla(t+.2,1,300,620,.2,1.2);},

    picnic(t){for(let i=0;i<5;i++)sopla(t+i*.16,.07,1100,2000,.3,1.6);bip(t+1,660,880,.16,.24);},

    mini(nom,tono=1000){               // cada mini con su tono, bajito; si suena el principal, más todavía

      bus=ctx.createGain();bus.gain.value=ctx.currentTime<finPrincipal?.12:.32;bus.connect(salida);

      bus=previo;
    },
    nombres:()=>Object.keys(R),
    estado:()=>({activo:on,audio:ctx?ctx.state:"sin abrir"}),
    async medir(nom){                  // prueba: pico y duración de una receta, sin que suene
      const previo=[ctx,bus,ruido],oc=new OfflineAudioContext(1,44100*4,44100);
      ctx=oc;ruido=hazRuido(oc);bus=oc.createGain();bus.connect(cadena(oc));

    },

})();

// ---------------------------------------------------------- el taller: el robot hace cada acción con su utilería
const ACCIONES={pintar:"Pintando",grabar:"Grabando voz",dj:"Mezclando sonido",claqueta:"Bajando clips",teclear:"Programando",escribir:"Escribiendo guion",
  rueda:"Renderizando",lupa:"Revisando",subir:"Subiendo video",leer:"Leyendo",buscar:"Buscando",navegar:"Navegando",explicar:"Explicando",escuchar:"Te escucha",
  palomita:"¡Paso listo!",fiesta:"¡Tramo listo!",tapa:"Esto es privado",amigo:"Llamó a un ayudante",boton:"Corriendo comando",pensar:"Pensando",dormir:"Dormido",fallo:"¡Ups!",quieto:"",
  libros:"Investigando",prisa:"Esperando el render"};
const EST_ACCION={pintar:"imagenes",grabar:"voz",dj:"sonido",claqueta:"clips",teclear:"animacion",escribir:"guion",rueda:"render",lupa:"revision",subir:"subida",prisa:"render"};
const POR_ESTACION={voz:"grabar",sonido:"dj",imagenes:"pintar",clips:"claqueta",render:"rueda",revision:"lupa",subida:"subir",animacion:"teclear",guion:"escribir"};
const ETAPA_REPOSO={voz:"grabar",seleccion:"grabar",musica:"dj",sfx:"dj",mezcla:"dj",video:"rueda",final:"rueda",flow:"pintar",subida:"subir"};
function estacionDe(nom,e){              // null = no se trabaja en ninguna estación: el robot va al descanso
  if(e&&(nom==="teclear"||nom==="fallo"))return e.estacion||null;   // teclear se hace donde toque, y un fallo se llora donde pasó
  return EST_ACCION[nom]||null;
}
function accionDe(e){
  if(e.fallo)return "fallo";
  const est=e.estacion;
  switch(e.tipo){
    case "privado":return "tapa";
    case "ayudante":return "amigo";
    case "usuario":return "escuchar";
    case "encargo":return "leer";
    case "cierre":return "fiesta";
    case "paso":return "palomita";
    case "habla":return "explicar";
    case "leer":return "leer";
    case "buscar":return "buscar";
    case "busqueda":case "pagina":return "libros";
    case "imagen":return "lupa";
    case "codigo":return est==="guion"?"escribir":"teclear";
    case "navegador":return POR_ESTACION[est]||"navegar";
    case "comando":return POR_ESTACION[est]||"boton";
  }
  return "quieto";
}

const Taller=(()=>{
  const cv=$("taller"),g=cv.getContext("2d");
  const MADERA="#b27c50",TINTA="#2b3048",CABEZA="#f5f7ff",VISOR="#171b2b",OJO="#7df3e1",ROSA="#ff8fbf",ROJO="#ff5d73",AMAR="#ffd166",AZUL="#5bc0ff",VERDE="#5fe0a0",LILA="#b388ff";
  const COLORES=[ROJO,AMAR,AZUL,VERDE,ROSA,LILA];
  const MIN_MS=1500;                     // cada acción se queda al menos esto ya en su sitio: si no, el robot solo caminaría
  const MAX_MS=!window.EN_VIDEO&&!/[?&]clasico\b/.test(location.search)?8000:3000;   // tope por si camina muy lento (render a toda CPU, ~1 cuadro/s); en el edificio también cuenta el viaje entre pisos
  const DESCANSO=.5/(ESTACIONES.length+1);   // primer puesto del taller, fuera de las estaciones
  // ---- el edificio (31-oct-2026): cada piso es la franja de siempre apilada. Las x llevan el piso dentro: x = piso*10 + fracción, así lo que suma o compara posiciones sigue igual.
  // En los videos del canal (EN_VIDEO) y con ?clasico sigue siendo una sola franja: piso 0 y las fórmulas de antes
  const EDIF=!window.EN_VIDEO&&!/[?&]clasico\b/.test(location.search);
  const PISOS=[{k:"maq",c:"S",n:"Sótano · Sala de máquinas",col:AZUL},{k:"pb",c:"PB",n:"Planta baja · Descanso",col:VERDE},{k:"p1",c:"1",n:"Piso 1 · Guion y voz",col:AMAR},{k:"p2",c:"2",n:"Piso 2 · Arte",col:ROSA},{k:"p3",c:"3",n:"Piso 3 · Montaje",col:LILA},{k:"az",c:"Az",n:"Azotea · Subida",col:ROJO}];
  const LUGAR={guion:[2,.2],voz:[2,.44],sonido:[2,.66],imagenes:[3,.28],clips:[3,.58],animacion:[4,.2],render:[4,.44],revision:[4,.66],subida:[5,.42]};
  const SALA=0,P_PB=1,ESC_A=.03,ESC_B=.095,ASC=.82,ASC_W=112,CAB_A=138,LOSA=12,TECHO=240,TIERRA=120,GAB_X=.125,GAB_W=.625,ZMAX=2.8,MUNDO_W=1500;
  const pisoDe=v=>EDIF?Math.round(v/10):0,fr=v=>v-pisoDe(v)*10,enP=(p,f)=>EDIF?p*10+f:f;
  const rampa=p=>p%2?[ESC_B,ESC_A]:[ESC_A,ESC_B];   // sube en zigzag: cada tramo acaba donde empieza el siguiente
  let Yo=null;                           // quién hace la pose: lo que suelta (`em`) sale de él, no de Token
  const Rb={x:0,dir:1,via:null,oy:null},Cab={y:P_PB,de:null,pu:0},Cam={x:0,y:0,z:1,tx:0,ty:0,tz:1,rot:0,sigue:true,listo:false,ini:0};
  let CW=0,CH=0,pisoY=[],ALTOM=0,enMundo=false,pisoAct=-1;
  if(EDIF)document.body.classList.add("edif");
  let W=0,H=0,K=1,PCH=0,TH=0,dpr=1,robotX=DESCANSO,meta=DESCANSO,paso=0,idx=-1,dir=1,parts=[],pal={},pend=null,A={nom:"quieto",ini:0,e:null},llego=0,ahora=0,sue=0,tiempos={};
  const Cap={fondo:null,medio:null,encima:null,atras:null,cuerpo:null,cabeza:null,clic:null,sinCajas:false,cuerpoR:null,oculto:false};   // lo que añade panel_vivo_extras.js
  let palExtra={};
  const leerPal=()=>{for(const k of ["--muro","--muro2","--suelo","--mesa","--txt","--mut","--faint","--acc","--ok","--run","--warn","--pink","--panel"])pal[k]=css(k);Object.assign(pal,palExtra);};
  function medida(){
    dpr=Math.min(2,devicePixelRatio||1);
    CW=cv.clientWidth;CH=cv.clientHeight;
    if(EDIF){
      W=MUNDO_W;K=1.3;PCH=108;TH=0;H=PCH+150*K;
      let y=TECHO;pisoY=[];
      for(let p=PISOS.length-1;p>=0;p--){if(p===SALA)y+=PCH;pisoY[p]=y-PCH;y+=H-PCH+LOSA;}   // el gabinete cuelga en la sala: ese piso es más alto
      ALTOM=y+TIERRA;
    }else{W=CW;H=CH;PCH=Math.round(Math.max(84,Math.min(108,H*.31)));TH=W<=900?96:0;K=(H-PCH-TH)/150;}   // arriba, el gabinete; debajo, el taller
    cv.width=CW*dpr;cv.height=CH*dpr;leerPal();
  }
  addEventListener("resize",medida);
  if(EDIF&&window.ResizeObserver)new ResizeObserver(()=>{if(CW)medida();}).observe(cv);   // el alto del lienzo depende de la cabecera y de las sesiones, no solo de la ventana
  matchMedia("(prefers-color-scheme:dark)").addEventListener("change",medida);
  const AN=()=>W>900?.88:1;              // ancho del taller: en pantalla ancha, a la derecha vive Torre; en lo angosto, en un carril abajo
  const DES=()=>EDIF?enP(P_PB,.2):window.EN_VIDEO?.12:DESCANSO*AN();   // a 1080p el robot es grande: en un video no puede quedar cortado por el borde
  const X=i=>{if(!EDIF)return (i+1.5)/(ESTACIONES.length+1)*AN();const [p,f]=LUGAR[ESTACIONES[i][0]];return p*10+f;};
  const oyCab=()=>{const p=Math.floor(Cab.y),k=Cab.y-p;return pisoY[p]+((pisoY[p+1]??pisoY[p])-pisoY[p])*k;};
  const lim=v=>{const p=pisoDe(v);return p*10+Math.max(.03,Math.min(.97*AN(),v-p*10));};
  function viaja(E,t,dt){                // 1 = camina, 2 = espera o va en el elevador
    const V=E.via;
    if(V.t==="esc"){
      const f=Math.min(1,(t-V.ini)/V.dur);
      E.x=V.de*10+V.x0+(V.x1-V.x0)*f;E.dir=V.x1>V.x0?1:-1;E.oy=pisoY[V.de]+(pisoY[V.a]-pisoY[V.de])*f;
      if(f>=1){E.x=V.a*10+V.x1;E.via=null;E.oy=null;}
      return 1;
    }
    const s=dt/640,cab=dest=>{const d=dest-Cab.y;if(Math.abs(d)<=s){Cab.y=dest;return true;}Cab.y+=Math.sign(d)*s;return false;};
    const ding=()=>{if(E===Rb)Son.mini("habla",1760);};
    if(V.f===0){if(cab(V.de)){V.f=1;ding();}}
    else if(V.f===1){Cab.pu=Math.min(1,Cab.pu+dt/300);if(Cab.pu>=1){V.f=2;V.t0=t;E.oy=pisoY[V.de];}}
    else if(V.f===2){if(t-V.t0>240)V.f=3;}
    else if(V.f===3){Cab.pu=Math.max(0,Cab.pu-dt/300);if(!Cab.pu)V.f=4;}
    else if(V.f===4){if(cab(V.a)){V.f=5;ding();}E.oy=oyCab();}
    else if(V.f===5){Cab.pu=Math.min(1,Cab.pu+dt/300);if(Cab.pu>=1){V.f=6;V.t0=t;}}
    else if(t-V.t0>180){E.x=V.a*10+ASC;E.via=null;E.oy=null;Cab.de=null;return 1;}
    return 2;
  }
  function avanza(E,meta,paso,t,dt){     // 0 = llegó, 1 = camina, 2 = espera o va en el elevador. A otro piso: un piso por la escalera; dos o más, por el elevador si está libre
    if(E.trapo)return 2;                 // es un muñeco de trapo (panel_vivo_ragdoll.js): la física lo mueve, no el camino
    if(E.via){
      const V=E.via,q=pisoDe(meta);
      if(V.t==="asc"&&V.a!==q&&V.f<=4){  // cambió de destino: el elevador se desvía, no llega hasta el piso viejo
        if(q===V.de&&V.f<=1){E.via=null;Cab.de=null;return 1;}
        V.a=q;
      }
      return viaja(E,t,dt);
    }
    const p=pisoDe(E.x),q=pisoDe(meta);
    let dest=meta;
    if(p!==q){
      const sube=q>p,asc=Math.abs(q-p)>=2&&(!Cab.de||Cab.de===E);
      const r=sube?rampa(p):[rampa(p-1)[1],rampa(p-1)[0]];
      dest=p*10+(asc?ASC:r[0]);
      if(Math.abs(dest-E.x)<=.003){
        E.x=dest;
        if(asc){Cab.de=E;E.via={t:"asc",f:0,de:p,a:q};}
        else{const a=sube?p+1:p-1;E.via={t:"esc",de:p,a,ini:t,x0:r[0],x1:r[1],dur:(E===Rb?1400:1900)*(Math.min(p,a)===SALA?1.3:1)};}
        return viaja(E,t,dt);
      }
    }
    const d=dest-E.x;
    if(Math.abs(d)>.003){E.x+=Math.sign(d)*Math.min(Math.abs(d),paso);E.dir=d>0?1:-1;return 1;}
    E.x=dest;return 0;
  }

  // ---- primitivas
  const camino=(x,y,w,h,r)=>{g.beginPath();g.roundRect(x,y,w,h,r);};
  const caja=(x,y,w,h,r,c)=>{camino(x,y,w,h,r);g.fillStyle=c;g.fill();};
  const marco=(x,y,w,h,r,c,lw=1.5)=>{camino(x,y,w,h,r);g.strokeStyle=c;g.lineWidth=lw;g.stroke();};
  const circ=(x,y,r,c)=>{g.beginPath();g.arc(x,y,Math.max(0,r),0,7);g.fillStyle=c;g.fill();};
  const aro=(x,y,r,c,lw=1.5,a=0,b=7)=>{g.beginPath();g.arc(x,y,Math.max(0,r),a,b);g.strokeStyle=c;g.lineWidth=lw;g.stroke();};
  const elip=(x,y,a,b,c,rot=0)=>{g.beginPath();g.ellipse(x,y,a,b,rot,0,7);g.fillStyle=c;g.fill();};
  const raya=(x1,y1,x2,y2,c,lw=1.5)=>{g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.strokeStyle=c;g.lineWidth=lw;g.lineCap="round";g.stroke();};
  const letra=(s,x,y,px,c)=>{g.font=`700 ${px}px "Segoe UI Symbol","Segoe UI",sans-serif`;g.fillStyle=c;g.textAlign="center";g.textBaseline="middle";g.fillText(s,x,y);g.textBaseline="alphabetic";};
  const corazon=(x,y,r,c)=>{g.beginPath();g.moveTo(x,y+r*.9);g.bezierCurveTo(x-r*1.5,y-r*.1,x-r*.7,y-r,x,y-r*.3);g.bezierCurveTo(x+r*.7,y-r,x+r*1.5,y-r*.1,x,y+r*.9);g.fillStyle=c;g.fill();};
  const em=(ms,x,y,txt,c,vy=-26)=>{      // suelta un dibujito que sube y se apaga, cada `ms`
    const k=txt+ms;if(ahora-(tiempos[k]||0)<ms)return;tiempos[k]=ahora;
    parts.push({x:fr(Yo?Yo.x:robotX)*W+x*K,y:sue+y*K,vx:(Math.random()-.5)*26*K,vy:vy*K,v:1,c,txt,o:EDIF?(Yo?Yo.oy??pisoY[pisoDe(Yo.x)]:oyRobot()):0});
  };

  // ---- el robot: cabeza grande, visor con ojos que brillan, mejillas rosas
  function ojos(cara,T,mira){
    const y=-47.5,xs=[-6.5+mira,6.5+mira];
    const parpadeo=Math.sin(T*1.7)>.985||Math.sin(T*.73+1)>.992;
    for(const [i,x] of xs.entries()){
      if(cara==="feliz"){aro(x,y+1.5,3.4,OJO,2.2,Math.PI,0);continue;}
      if(cara==="dormido"||(parpadeo&&cara==="normal")){raya(x-3,y,x+3,y,OJO,2.2);continue;}
      if(cara==="corazon"){corazon(x,y,3.4,ROSA);continue;}
